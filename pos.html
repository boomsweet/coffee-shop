<!DOCTYPE html><html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS PRO Complete Fixed</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; background: #f1f5f9; }
.header { background: #0f172a; color: white; padding: 16px; text-align: center; font-size: 20px; }
.container { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card { background: white; border-radius: 16px; padding: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
.menu-img { width: 100%; border-radius: 12px; cursor: pointer; transition: transform 0.2s; }
.menu-img:hover { transform: scale(1.05); }
.qty { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; }
button { padding: 10px 16px; border: none; border-radius: 10px; background: #0ea5e9; color: white; font-size: 18px; cursor: pointer; }
button:hover { background: #0284c7; }
input { padding: 12px; border-radius: 10px; border: 1px solid #ccc; width: 100%; margin-top: 8px; }
.admin { background: #020617; color: white; padding: 16px; margin-top: 20px; border-radius: 12px; }
.order { background: #1e293b; padding: 10px; margin-top: 10px; border-radius: 10px; }
.selected { border: 3px solid #0ea5e9; }
</style>
</head>
<body>
<div class="header">🍔 ร้านของฉัน POS PRO Complete</div>
<div class="container" id="menu-container"></div>
<div class="card">
  <h3>ข้อมูลลูกค้า</h3>
  <input id="name" placeholder="👤 ชื่อ">
  <input id="phone" placeholder="📞 เบอร์โทร" type="tel">
  <button onclick="order()">สั่งซื้อ</button>
</div>
<div class="admin">
  <h3>📊 รายการออเดอร์</h3>
  <div id="orders"></div>
  <div id="total"></div>
</div>
<script>
const menuItems = [
  {name:'เบอร์เกอร์', price:59, img:'https://source.unsplash.com/400x300/?burger'},
  {name:'ไก่ทอด', price:79, img:'https://source.unsplash.com/400x300/?fried-chicken'},
  {name:'ชาเย็น', price:35, img:'https://source.unsplash.com/400x300/?tea'},
  {name:'พิซซ่า', price:199, img:'https://source.unsplash.com/400x300/?pizza'},
  {name:'โค้ก', price:25, img:'https://source.unsplash.com/400x300/?coke'},
  {name:'น้ำเปล่า', price:10, img:'https://source.unsplash.com/400x300/?water'},
  {name:'เฟรนช์ฟราย', price:45, img:'https://source.unsplash.com/400x300/?fries'}
];let selectedItem = null; let qty = 1; let orders = [];

function renderMenu() { const container = document.getElementById('menu-container'); container.innerHTML = ''; menuItems.forEach((item,index)=>{ const div = document.createElement('div'); div.className = 'card'; div.innerHTML = <img src='${item.img}' class='menu-img' onclick='selectItem(${index}, event)'> <h3>${item.name}</h3> <p>ราคา ${item.price} บาท</p> <div class='qty'> <button onclick='changeQty(-1)'>-</button> <input type='number' id='qty' value='1'> <button onclick='changeQty(1)'>+</button> </div>; container.appendChild(div); }); }

function selectItem(index, event){ selectedItem = menuItems[index]; document.querySelectorAll('.menu-img').forEach(img=>img.classList.remove('selected')); event.target.classList.add('selected'); document.getElementById('qty').value = 1; qty = 1; }

function changeQty(num){ qty += num; if(qty<1) qty=1; document.getElementById('qty').value = qty; }

function order(){ const nameInput = document.getElementById('name').value.trim(); const phoneInput = document.getElementById('phone').value.trim(); if(!selectedItem) return alert('กรุณาเลือกสินค้า'); if(!nameInput) return alert('กรุณาใส่ชื่อ'); if(phoneInput.length < 9) return alert('กรุณาใส่เบอร์โทรถูกต้อง'); const orderData = {name:nameInput,phone:phoneInput,item:selectedItem.name,price:selectedItem.price,qty:qty}; orders.push(orderData); renderOrders(); }

function renderOrders(){ let html=''; let total=0; orders.forEach(o=>{ const subtotal = o.price*o.qty; total += subtotal; html+=<div class='order'>${o.name} (${o.phone}) - ${o.item} x ${o.qty} = ${subtotal} บาท</div>; }); document.getElementById('orders').innerHTML = html; document.getElementById('total').innerHTML = <b>ยอดรวมทั้งหมด: ${total} บาท</b>; }

renderMenu(); </script>

</body>
</html>
