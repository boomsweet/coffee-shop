<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HOP CHAFE - เมนูระบบดิจิทัล</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
        body { font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .category-active { background: #000; color: #fff; border-color: #000; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hop-gradient { background: linear-gradient(135deg, #facc15 0%, #eab308 100%); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 overflow-x-hidden">

    <!-- 1. หน้าเลือกโหมด (Landing Page) -->
    <div id="view-landing" class="view min-h-screen flex flex-col items-center justify-center p-8 bg-white">
        <div class="text-center mb-12">
            <div class="w-24 h-24 bg-black text-white rounded-[30px] flex items-center justify-center mx-auto mb-4 shadow-2xl">
                <i class="fas fa-mug-hot text-4xl"></i>
            </div>
            <h1 class="text-4xl font-bold tracking-tighter italic">HOP <span class="text-yellow-500">CHAFE</span></h1>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-[0.3em] mt-2">Good morning starts with hop</p>
        </div>

        <div class="grid grid-cols-1 gap-6 w-full max-w-sm">
            <button onclick="switchView('customer')" class="bg-slate-50 p-8 rounded-[40px] border border-slate-100 shadow-sm flex flex-col items-center active:scale-95 transition-all">
                <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center text-2xl mb-4">
                    <i class="fas fa-shopping-basket"></i>
                </div>
                <span class="font-bold text-xl">สำหรับลูกค้า</span>
                <span class="text-xs text-gray-400 mt-1">สั่งเครื่องดื่มฟรีไข่มุก</span>
            </button>

            <button onclick="showLogin()" class="hop-gradient p-8 rounded-[40px] shadow-lg flex flex-col items-center active:scale-95 transition-all">
                <div class="w-14 h-14 bg-black text-white rounded-2xl flex items-center justify-center text-2xl mb-4">
                    <i class="fas fa-user-shield"></i>
                </div>
                <span class="font-bold text-xl">สำหรับเจ้าของร้าน</span>
                <span class="text-xs text-black/60 mt-1">จัดการออเดอร์ (ต้องใช้รหัส)</span>
            </button>
        </div>
    </div>

    <!-- 2. หน้าลูกค้า (Customer View) -->
    <div id="view-customer" class="view hidden min-h-screen flex flex-col pb-32">
        <header class="bg-white p-5 flex justify-between items-center sticky top-0 z-50 shadow-sm">
            <button onclick="switchView('landing')" class="text-gray-400"><i class="fas fa-arrow-left text-xl"></i></button>
            <h2 class="font-bold text-2xl italic tracking-tighter">HOP CHAFE</h2>
            <div class="bg-black text-white px-3 py-1 rounded-full text-[10px] font-bold">20.- FREEไข่มุก</div>
        </header>

        <!-- หมวดหมู่ (ตามใบเมนู) -->
        <div class="flex overflow-x-auto gap-3 p-4 bg-white sticky top-[72px] z-40 hide-scroll border-b">
            <button onclick="setCategory('All')" class="cat-btn px-6 py-2 rounded-full border border-gray-200 text-sm font-bold whitespace-nowrap category-active">ทั้งหมด</button>
            <button onclick="setCategory('Hop Tea')" class="cat-btn px-6 py-2 rounded-full border border-gray-200 text-sm font-bold whitespace-nowrap text-gray-400 bg-white">Hop Tea</button>
            <button onclick="setCategory('Hop Jasmine')" class="cat-btn px-6 py-2 rounded-full border border-gray-200 text-sm font-bold whitespace-nowrap text-gray-400 bg-white">Jasmine Tea</button>
            <button onclick="setCategory('Hop Berry')" class="cat-btn px-6 py-2 rounded-full border border-gray-200 text-sm font-bold whitespace-nowrap text-gray-400 bg-white">Berry Tea</button>
            <button onclick="setCategory('Hop Milk')" class="cat-btn px-6 py-2 rounded-full border border-gray-200 text-sm font-bold whitespace-nowrap text-gray-400 bg-white">Hop Milk</button>
            <button onclick="setCategory('Hop Coffee')" class="cat-btn px-6 py-2 rounded-full border border-gray-200 text-sm font-bold whitespace-nowrap text-gray-400 bg-white">Coffee</button>
            <button onclick="setCategory('Hop Soda')" class="cat-btn px-6 py-2 rounded-full border border-gray-200 text-sm font-bold whitespace-nowrap text-gray-400 bg-white">Hop Soda</button>
        </div>

        <main class="p-4 grid grid-cols-2 gap-4" id="menu-grid">
            <!-- เมนูโหลดจาก Script -->
        </main>

        <!-- แถบตะกร้าลอย -->
        <div id="cart-bar" class="fixed bottom-6 left-6 right-6 bg-black text-white p-5 rounded-[30px] shadow-2xl flex justify-between items-center hidden z-50 animate-pulse-once" onclick="openCart()">
            <div class="flex items-center gap-4">
                <div id="cart-count" class="bg-yellow-400 text-black w-8 h-8 rounded-xl flex items-center justify-center font-bold">0</div>
                <span class="font-bold text-lg">รายการที่เลือก</span>
            </div>
            <span id="cart-total" class="text-2xl font-bold text-yellow-400">฿0</span>
        </div>
    </div>

    <!-- 3. หน้าเจ้าของร้าน (Owner View) -->
    <div id="view-owner" class="view hidden min-h-screen bg-slate-100 flex flex-col">
        <nav class="bg-black text-white p-5 flex justify-between items-center sticky top-0 z-50">
            <button onclick="switchView('landing')" class="text-red-400"><i class="fas fa-power-off text-xl"></i></button>
            <div class="flex gap-8 font-bold text-xs uppercase tracking-widest">
                <span class="text-yellow-400 border-b-2 border-yellow-400 pb-1">Orders</span>
            </div>
            <div class="w-8"></div>
        </nav>
        <main class="p-4 space-y-4 overflow-y-auto flex-grow" id="owner-orders">
            <!-- ออเดอร์จะแสดงที่นี่ -->
        </main>
    </div>

    <!-- Modal ล็อกอินเจ้าของร้าน -->
    <div id="login-modal" class="fixed inset-0 bg-black/90 z-[100] hidden flex items-center justify-center p-6 backdrop-blur-md">
        <div class="bg-white w-full max-w-xs rounded-[40px] p-10 text-center shadow-2xl">
            <div class="bg-gray-100 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-6 text-gray-400 text-3xl">
                <i class="fas fa-lock"></i>
            </div>
            <h3 class="text-xl font-bold mb-2">รหัสผ่านเจ้าของ</h3>
            <p class="text-xs text-gray-400 mb-8">กรุณากรอกรหัส 4 หลักเพื่อเข้าสู่ระบบ</p>
            <input type="password" id="pin-input" maxlength="4" placeholder="••••" class="w-full text-center text-5xl tracking-[0.4em] bg-gray-50 p-5 rounded-3xl border-none outline-none mb-8 focus:ring-2 ring-yellow-400 font-mono">
            <div class="flex gap-4">
                <button onclick="closeModal('login-modal')" class="flex-1 font-bold text-gray-400">ยกเลิก</button>
                <button onclick="verifyPin()" class="flex-1 bg-black text-white py-5 rounded-3xl font-bold shadow-lg">เข้าสู่ระบบ</button>
            </div>
        </div>
    </div>

    <!-- Modal ตะกร้าสินค้า -->
    <div id="cart-modal" class="fixed inset-0 bg-black/60 z-[90] hidden flex items-end">
        <div class="bg-white w-full rounded-t-[50px] p-8 max-h-[85vh] flex flex-col shadow-2xl">
            <div class="w-16 h-1.5 bg-gray-200 rounded-full mx-auto mb-8"></div>
            <h3 class="text-3xl font-bold mb-8 italic tracking-tighter">ตะกร้าของคุณ</h3>
            <div id="cart-items-list" class="flex-grow overflow-y-auto space-y-4 mb-8">
                <!-- รายการในตะกร้า -->
            </div>
            <div class="border-t pt-8">
                <div class="flex justify-between items-center mb-8">
                    <span class="text-gray-400 font-bold uppercase text-xs">รวมค่าบริการทั้งสิ้น</span>
                    <span id="modal-total" class="text-5xl font-bold tracking-tighter">฿0</span>
                </div>
                <button onclick="submitOrder()" class="w-full bg-black text-white py-6 rounded-[30px] font-bold text-xl shadow-2xl active:scale-95 transition">ยืนยันการสั่งซื้อ</button>
                <button onclick="closeModal('cart-modal')" class="w-full mt-4 text-gray-400 font-bold">เลือกเครื่องดื่มเพิ่ม</button>
            </div>
        </div>
    </div>

    <script>
        // ข้อมูลเมนูตามใบจริง (Hop Chafe 20.- ฟรีไข่มุก)
        const menuItems = [
            // Hop Tea
            { id: 1, name: 'ชาเขียว', price: 20, cat: 'Hop Tea', img: 'https://images.unsplash.com/photo-1571935445874-6629d16886aa?w=400' },
            { id: 2, name: 'ชานมโกโก้', price: 25, cat: 'Hop Tea', img: 'https://images.unsplash.com/photo-1541167760496-162955ed8a9f?w=400' },
            { id: 3, name: 'ชาไทย', price: 20, cat: 'Hop Tea', img: 'https://images.unsplash.com/photo-1594631252845-29fc4586d51c?w=400' },
            { id: 4, name: 'ชานมไต้หวัน', price: 20, cat: 'Hop Tea', img: 'https://images.unsplash.com/photo-1525193612562-0ec53b0e5d7c?w=400' },
            // Hop Jasmine Tea
            { id: 5, name: 'ชามะลิ', price: 20, cat: 'Hop Jasmine', img: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=400' },
            { id: 6, name: 'ชามะลิลิ้นจี่', price: 20, cat: 'Hop Jasmine', img: 'https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=400' },
            // Hop Milk
            { id: 7, name: 'นมสด', price: 20, cat: 'Hop Milk', img: 'https://images.unsplash.com/photo-1550583724-1d55d04adcb1?w=400' },
            { id: 8, name: 'นมชมพู', price: 20, cat: 'Hop Milk', img: 'https://images.unsplash.com/photo-1497034825429-c343d7c6a68f?w=400' },
            { id: 9, name: 'โกโก้', price: 25, cat: 'Hop Milk', img: 'https://images.unsplash.com/photo-1544787210-2213d84ad96b?w=400' },
            // Hop Coffee
            { id: 10, name: 'เอสเพรสโซ่', price: 25, cat: 'Hop Coffee', img: 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=400' },
            { id: 11, name: 'ลาเต้', price: 25, cat: 'Hop Coffee', img: 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400' },
            // Hop Soda
            { id: 12, name: 'แดงโซดา', price: 20, cat: 'Hop Soda', img: 'https://images.unsplash.com/photo-1527661591475-527312dd65f5?w=400' },
            { id: 13, name: 'บลูฮาวาย', price: 20, cat: 'Hop Soda', img: 'https://images.unsplash.com/photo-1536935338218-d4133eba883b?w=400' }
        ];

        let cart = [];
        let orders = JSON.parse(localStorage.getItem('hop_orders')) || [];
        let currentCategory = 'All';

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById('view-' + viewId).classList.remove('hidden');
            if(viewId === 'customer') renderMenu();
            if(viewId === 'owner') renderOwnerOrders();
        }

        function showLogin() { document.getElementById('login-modal').classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function verifyPin() {
            const pin = document.getElementById('pin-input').value;
            if(pin === '0000') {
                document.getElementById('pin-input').value = '';
                closeModal('login-modal');
                switchView('owner');
            } else {
                alert('รหัสผ่านไม่ถูกต้อง กรุณาลองอีกครั้ง');
                document.getElementById('pin-input').value = '';
            }
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('category-active', 'text-white');
                btn.classList.add('text-gray-400', 'bg-white');
                if(btn.innerText.includes(cat) || (cat==='All' && btn.innerText==='ทั้งหมด')) {
                    btn.classList.add('category-active');
                    btn.classList.remove('text-gray-400', 'bg-white');
                }
            });
            renderMenu();
        }

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            const items = currentCategory === 'All' ? menuItems : menuItems.filter(m => m.cat === currentCategory);
            grid.innerHTML = items.map(m => `
                <div class="bg-white p-3 rounded-[35px] shadow-sm border border-slate-100 flex flex-col active:scale-95 transition-all" onclick="addToCart(${m.id})">
                    <img src="${m.img}" class="w-full aspect-square object-cover rounded-[28px] mb-3 shadow-inner">
                    <div class="px-2">
                        <h3 class="font-bold text-sm truncate">${m.name}</h3>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-yellow-600 font-bold">฿${m.price}</span>
                            <div class="bg-black text-white w-7 h-7 rounded-xl flex items-center justify-center text-[10px]">
                                <i class="fas fa-plus"></i>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = menuItems.find(m => m.id === id);
            const inCart = cart.find(c => c.id === id);
            if(inCart) inCart.qty++; else cart.push({...product, qty: 1});
            updateCartBar();
        }

        function updateCartBar() {
            const qty = cart.reduce((s, i) => s + i.qty, 0);
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const bar = document.getElementById('cart-bar');
            bar.classList.toggle('hidden', qty === 0);
            document.getElementById('cart-count').innerText = qty;
            document.getElementById('cart-total').innerText = `฿${total}`;
        }

        function openCart() {
            const list = document.getElementById('cart-items-list');
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            document.getElementById('modal-total').innerText = `฿${total}`;
            list.innerHTML = cart.map(i => `
                <div class="flex items-center gap-4 bg-gray-50 p-4 rounded-3xl">
                    <img src="${i.img}" class="w-14 h-14 rounded-2xl object-cover">
                    <div class="flex-grow font-bold text-sm leading-tight">${i.name}</div>
                    <div class="flex items-center gap-3">
                        <button onclick="updateQty(${i.id}, -1)" class="w-9 h-9 bg-white rounded-xl shadow-sm border border-gray-100 font-bold">-</button>
                        <span class="font-bold text-lg w-5 text-center">${i.qty}</span>
                        <button onclick="updateQty(${i.id}, 1)" class="w-9 h-9 bg-white rounded-xl shadow-sm border border-gray-100 font-bold">+</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        window.updateQty = (id, delta) => {
            const item = cart.find(c => c.id === id);
            if(item) {
                item.qty += delta;
                if(item.qty <= 0) cart = cart.filter(c => c.id !== id);
                openCart();
                updateCartBar();
                if(cart.length === 0) closeModal('cart-modal');
            }
        };

        function submitOrder() {
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const order = {
                id: Math.floor(1000 + Math.random() * 9000),
                items: [...cart],
                total: total,
                status: 'pending',
                time: new Date().toLocaleTimeString('th-TH')
            };
            orders.push(order);
            localStorage.setItem('hop_orders', JSON.stringify(orders));
            cart = [];
            updateCartBar();
            closeModal('cart-modal');
            alert('ส่งออเดอร์ไปยังร้านแล้วครับ!');
        }

        function renderOwnerOrders() {
            const container = document.getElementById('owner-orders');
            if(orders.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-gray-400 font-bold">ไม่มีรายการออเดอร์</div>`;
                return;
            }
            container.innerHTML = orders.slice().reverse().map(o => `
                <div class="bg-white p-6 rounded-[35px] shadow-sm border-l-8 ${o.status==='pending' ? 'border-yellow-400' : 'border-green-400'}">
                    <div class="flex justify-between items-center mb-4 border-b pb-3">
                        <span class="text-[10px] font-bold text-gray-400">ORDER #${o.id}</span>
                        <span class="text-[10px] font-bold ${o.status==='pending' ? 'text-yellow-600' : 'text-green-600'} italic">${o.time}</span>
                    </div>
                    <div class="space-y-2 mb-6">
                        ${o.items.map(i => `<div class="font-bold flex justify-between"><span>${i.name}</span> <span class="text-gray-400">x${i.qty}</span></div>`).join('')}
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="text-2xl font-bold tracking-tighter">฿${o.total}</div>
                        ${o.status === 'pending' ? 
                            `<button onclick="completeOrder(${o.id})" class="bg-black text-white px-6 py-2 rounded-2xl text-xs font-bold shadow-lg">ยืนยันทำเสร็จ</button>` : 
                            `<i class="fas fa-check-circle text-green-500 text-2xl"></i>`
                        }
                    </div>
                </div>
            `).join('');
        }

        window.completeOrder = (id) => {
            const o = orders.find(x => x.id === id);
            if(o) o.status = 'completed';
            localStorage.setItem('hop_orders', JSON.stringify(orders));
            renderOwnerOrders();
        };

        // เริ่มต้นแอป
        switchView('landing');
    </script>
</body>
</html>
