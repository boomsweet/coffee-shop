<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HOP Chafe - Super App</title>
    <!-- ลิงก์สำหรับการติดตั้งแอป (PWA) -->
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkhPUCBDaGFmZSIsCiAgInNob3J0X25hbWUiOiAiSE9QIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiNmZmZmZmYiLAogICJ0aGVtZV9jb2xvciI6ICIjMDAwMDAwIgp9">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
        body { font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- ส่วนที่ 1: หน้าเลือกโหมด (Home) -->
    <div id="view-home" class="view min-h-screen flex flex-col items-center justify-center p-6">
        <div class="mb-12 text-center scale-110">
            <div class="bg-black text-white w-20 h-20 rounded-[25px] flex items-center justify-center mx-auto mb-4 shadow-2xl">
                <i class="fas fa-mug-hot text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tighter">HOP <span class="text-yellow-500">CHAFE</span></h1>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-[0.3em] mt-1">Digital Coffee Solutions</p>
        </div>

        <div class="grid grid-cols-1 gap-6 w-full max-w-xs">
            <button onclick="switchView('customer')" class="bg-white p-6 rounded-[35px] shadow-lg border border-gray-100 flex flex-col items-center active:scale-95 transition-all">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl mb-3">
                    <i class="fas fa-user"></i>
                </div>
                <span class="font-bold text-lg">สำหรับลูกค้า</span>
                <span class="text-[10px] text-gray-400">สั่งเครื่องดื่มผ่านมือถือ</span>
            </button>

            <button onclick="switchView('owner')" class="bg-yellow-400 p-6 rounded-[35px] shadow-lg border border-yellow-500 flex flex-col items-center active:scale-95 transition-all text-black">
                <div class="w-12 h-12 bg-black text-white rounded-2xl flex items-center justify-center text-xl mb-3">
                    <i class="fas fa-store"></i>
                </div>
                <span class="font-bold text-lg">สำหรับเจ้าของร้าน</span>
                <span class="text-[10px] text-black/50">จัดการออเดอร์และเมนู</span>
            </button>
        </div>
    </div>

    <!-- ส่วนที่ 2: หน้าลูกค้า (Customer) -->
    <div id="view-customer" class="view min-h-screen hidden flex flex-col">
        <header class="p-6 flex justify-between items-center glass sticky top-0 z-30">
            <button onclick="switchView('home')" class="text-gray-400"><i class="fas fa-arrow-left"></i></button>
            <h2 class="font-bold italic">HOP CHAFE</h2>
            <div class="w-8"></div>
        </header>
        
        <main class="p-6 flex-grow pb-32">
            <h1 class="text-3xl font-bold mb-6">เลือกเมนูโปรด 🥤</h1>
            <div id="customer-menu-grid" class="grid grid-cols-2 gap-4">
                <!-- เมนูจะแสดงที่นี่ -->
            </div>
        </main>

        <div id="cart-bar" class="fixed bottom-6 left-6 right-6 bg-black text-white p-5 rounded-[25px] shadow-2xl flex justify-between items-center hidden cursor-pointer z-40" onclick="showCartModal()">
            <div class="flex items-center gap-3">
                <div id="cart-count" class="bg-yellow-400 text-black w-7 h-7 rounded-lg flex items-center justify-center font-bold text-sm">0</div>
                <span class="font-bold">ดูตะกร้าสินค้า</span>
            </div>
            <span id="cart-total-price" class="text-xl font-bold text-yellow-400">฿0</span>
        </div>
    </div>

    <!-- ส่วนที่ 3: หน้าเจ้าของร้าน (Owner) -->
    <div id="view-owner" class="view min-h-screen hidden flex flex-col">
        <nav class="bg-black text-white p-6 flex justify-between items-center sticky top-0 z-30">
            <button onclick="switchView('home')"><i class="fas fa-home"></i></button>
            <div class="flex gap-6 font-bold text-xs uppercase">
                <button id="btn-tab-orders" onclick="setOwnerTab('orders')" class="text-yellow-400 border-b-2 border-yellow-400">ออเดอร์</button>
                <button id="btn-tab-menu" onclick="setOwnerTab('menu')" class="text-gray-400">จัดการเมนู</button>
            </div>
            <div class="w-4"></div>
        </nav>

        <main id="owner-orders" class="p-6 space-y-4 flex-grow overflow-y-auto">
            <!-- ออเดอร์ลูกค้า -->
        </main>

        <main id="owner-menu" class="p-6 hidden flex-grow overflow-y-auto">
            <button onclick="openMenuModal()" class="w-full bg-white border-2 border-dashed border-gray-300 p-6 rounded-[30px] text-gray-400 font-bold mb-6">
                <i class="fas fa-plus mr-2"></i> เพิ่มเมนูใหม่
            </button>
            <div id="owner-menu-list" class="space-y-3"></div>
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-container" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center p-6 backdrop-blur-sm">
        <!-- เนื้อหา Modal จะเปลี่ยนไปตามสถานะ -->
        <div id="modal-content" class="bg-white w-full max-w-sm rounded-[40px] p-8 shadow-2xl relative">
            <!-- Dynamic Content -->
        </div>
    </div>

    <script>
        // --- ระบบจำลองฐานข้อมูล (Local Database) ---
        let state = {
            menu: JSON.parse(localStorage.getItem('hop_menu')) || [
                { id: 1, name: 'โกโก้เย็น', price: 20, image: 'https://images.unsplash.com/photo-1541167760496-162955ed8a9f?w=400' },
                { id: 2, name: 'ชาเขียวมัทฉะ', price: 20, image: 'https://images.unsplash.com/photo-1571935445874-6629d16886aa?w=400' }
            ],
            orders: JSON.parse(localStorage.getItem('hop_orders')) || [],
            cart: []
        };

        function save() {
            localStorage.setItem('hop_menu', JSON.stringify(state.menu));
            localStorage.setItem('hop_orders', JSON.stringify(state.orders));
        }

        // --- ระบบเปลี่ยนหน้า (Navigation) ---
        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById('view-' + viewId).classList.remove('hidden');
            render();
        }

        function setOwnerTab(tab) {
            document.getElementById('owner-orders').classList.toggle('hidden', tab !== 'orders');
            document.getElementById('owner-menu').classList.toggle('hidden', tab !== 'menu');
            document.getElementById('btn-tab-orders').className = tab === 'orders' ? 'text-yellow-400 border-b-2 border-yellow-400' : 'text-gray-400';
            document.getElementById('btn-tab-menu').className = tab === 'menu' ? 'text-yellow-400 border-b-2 border-yellow-400' : 'text-gray-400';
        }

        // --- ระบบจัดการเมนู ---
        function render() {
            // Render Customer Menu
            const customerGrid = document.getElementById('customer-menu-grid');
            if(customerGrid) {
                customerGrid.innerHTML = state.menu.map(m => `
                    <div class="bg-white p-3 rounded-[35px] shadow-sm border border-gray-100">
                        <img src="${m.image}" class="w-full aspect-square object-cover rounded-[28px] mb-3">
                        <div class="px-2">
                            <h3 class="font-bold text-sm truncate">${m.name}</h3>
                            <div class="flex justify-between items-center mt-1">
                                <span class="text-yellow-600 font-bold">฿${m.price}</span>
                                <button onclick="addToCart(${m.id})" class="bg-black text-white w-8 h-8 rounded-xl flex items-center justify-center active:scale-75 transition">
                                    <i class="fas fa-plus text-[10px]"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            // Render Owner Menu List
            const ownerMenuList = document.getElementById('owner-menu-list');
            if(ownerMenuList) {
                ownerMenuList.innerHTML = state.menu.map(m => `
                    <div class="bg-white p-4 rounded-3xl flex items-center gap-4 shadow-sm">
                        <img src="${m.image}" class="w-12 h-12 rounded-xl object-cover">
                        <div class="flex-grow font-bold">${m.name} <span class="text-yellow-600 ml-2">฿${m.price}</span></div>
                        <button onclick="deleteMenu(${m.id})" class="text-red-400 p-2"><i class="fas fa-trash"></i></button>
                    </div>
                `).join('');
            }

            // Render Owner Orders
            const ownerOrders = document.getElementById('owner-orders');
            if(ownerOrders) {
                ownerOrders.innerHTML = state.orders.length === 0 ? '<p class="text-center text-gray-400 mt-10">ไม่มีออเดอร์ใหม่</p>' : 
                state.orders.slice().reverse().map(o => `
                    <div class="bg-white p-6 rounded-[35px] shadow-sm border-l-[10px] ${o.status === 'pending' ? 'border-yellow-400' : 'border-green-500'}">
                        <div class="flex justify-between mb-4">
                            <span class="font-bold text-xs opacity-40 uppercase">Order #${o.id}</span>
                            <span class="text-[10px] font-bold ${o.status === 'pending' ? 'text-yellow-600' : 'text-green-600'} italic">
                                ${o.status === 'pending' ? 'รอดำเนินการ' : 'สำเร็จแล้ว'}
                            </span>
                        </div>
                        <div class="space-y-1 mb-6">
                            ${o.items.map(i => `<div class="font-bold text-gray-800">${i.name} x${i.qty}</div>`).join('')}
                        </div>
                        <div class="flex justify-between items-center border-t pt-4">
                            <span class="text-2xl font-bold tracking-tighter">฿${o.total}</span>
                            ${o.status === 'pending' ? `<button onclick="completeOrder(${o.id})" class="bg-black text-white px-6 py-2 rounded-2xl text-[10px] font-bold shadow-lg">ยืนยัน</button>` : `<i class="fas fa-check-circle text-green-500 text-xl"></i>`}
                        </div>
                    </div>
                `).join('');
            }

            updateCartUI();
        }

        // --- ระบบตะกร้าสินค้า ---
        function addToCart(id) {
            const item = state.menu.find(m => m.id === id);
            const inCart = state.cart.find(c => c.id === id);
            if(inCart) inCart.qty++; else state.cart.push({...item, qty: 1});
            updateCartUI();
        }

        function updateCartUI() {
            const qty = state.cart.reduce((s, i) => s + i.qty, 0);
            const total = state.cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const bar = document.getElementById('cart-bar');
            if(bar) {
                bar.classList.toggle('hidden', qty === 0);
                document.getElementById('cart-count').innerText = qty;
                document.getElementById('cart-total-price').innerText = `฿${total}`;
            }
        }

        function showCartModal() {
            const total = state.cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            content.innerHTML = `
                <h3 class="text-2xl font-bold mb-6 italic">สรุปรายการสั่งซื้อ</h3>
                <div class="space-y-4 mb-8 max-h-60 overflow-y-auto">
                    ${state.cart.map(i => `
                        <div class="flex justify-between items-center bg-gray-50 p-3 rounded-2xl">
                            <div class="font-bold text-sm">${i.name} x${i.qty}</div>
                            <div class="font-bold">฿${i.price * i.qty}</div>
                        </div>
                    `).join('')}
                </div>
                <div class="flex justify-between items-end mb-8">
                    <span class="text-gray-400 font-bold uppercase text-xs">ราคารวมทั้งสิ้น</span>
                    <span class="text-4xl font-bold tracking-tighter">฿${total}</span>
                </div>
                <button onclick="placeOrder()" class="w-full bg-black text-white py-5 rounded-[25px] font-bold shadow-xl">ยืนยันสั่งซื้อ</button>
                <button onclick="closeModal()" class="w-full mt-4 text-gray-400 font-bold text-xs">กลับไปเลือกเพิ่ม</button>
            `;
        }

        function placeOrder() {
            const total = state.cart.reduce((s, i) => s + (i.price * i.qty), 0);
            state.orders.push({
                id: Math.floor(1000 + Math.random() * 9000),
                items: [...state.cart],
                total: total,
                status: 'pending',
                createdAt: Date.now()
            });
            state.cart = [];
            save();
            closeModal();
            render();
            alert('ส่งออเดอร์เรียบร้อย!');
        }

        // --- ระบบหลังบ้าน (Owner Actions) ---
        function completeOrder(id) {
            const order = state.orders.find(o => o.id === id);
            if(order) order.status = 'completed';
            save();
            render();
        }

        function openMenuModal() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            content.innerHTML = `
                <h3 class="text-2xl font-bold mb-6 italic">เพิ่มเมนูใหม่</h3>
                <div class="space-y-4 mb-6">
                    <input type="text" id="new-name" placeholder="ชื่อเมนู" class="w-full bg-gray-50 p-4 rounded-2xl outline-none border border-gray-100">
                    <input type="number" id="new-price" placeholder="ราคา (บาท)" class="w-full bg-gray-50 p-4 rounded-2xl outline-none border border-gray-100">
                    <input type="text" id="new-img" placeholder="ลิงก์รูปภาพ (URL)" class="w-full bg-gray-50 p-4 rounded-2xl outline-none border border-gray-100 text-xs">
                </div>
                <button onclick="addMenu()" class="w-full bg-black text-white py-5 rounded-[25px] font-bold shadow-xl">บันทึกเมนู</button>
                <button onclick="closeModal()" class="w-full mt-4 text-gray-400 font-bold text-xs uppercase tracking-widest">ยกเลิก</button>
            `;
        }

        function addMenu() {
            const name = document.getElementById('new-name').value;
            const price = Number(document.getElementById('new-price').value);
            const image = document.getElementById('new-img').value || 'https://images.unsplash.com/photo-1541167760496-162955ed8a9f?w=400';
            if(!name || !price) return alert('กรุณาใส่ชื่อและราคา');
            state.menu.push({ id: Date.now(), name, price, image });
            save();
            closeModal();
            render();
        }

        function deleteMenu(id) {
            if(confirm('ลบเมนูนี้ใช่ไหม?')) {
                state.menu = state.menu.filter(m => m.id !== id);
                save();
                render();
            }
        }

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }

        // เริ่มต้นแอป
        render();

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
