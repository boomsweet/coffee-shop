<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Hop Cafe</title>

<style>
body{font-family:sans-serif;padding:10px;background:#f1f5f9}
.card{background:#fff;padding:10px;margin:10px 0;border-radius:10px}
button{padding:8px;margin:3px;border:none;border-radius:8px;background:#0ea5e9;color:#fff}
.cart{background:#fff;padding:10px;margin:5px 0;border-radius:10px}
</style>
</head>

<body>

<h1>☕ เมนู</h1>
<div id="menu"></div>

<h2>🧾 รายการ</h2>
<input id="name" placeholder="ชื่อ">
<input id="phone" placeholder="เบอร์">
<div id="cart"></div>
<h3 id="total"></h3>

<button onclick="submitOrder()">ยืนยัน</button>

<script type="module">
import { db, collection, addDoc } from "./firebase.js";

let cart=[];

const menu=[
{name:"ชาเขียวนม",price:25,cat:"ชา"},
{name:"โกโก้ชา",price:25,cat:"ชา"},
{name:"ชาไทย",price:20,cat:"ชา"},
{name:"ชานมไต้หวัน",price:20,cat:"ชา"},
{name:"เอสเพรสโซ่",price:25,cat:"กาแฟ"},
{name:"ลาเต้",price:25,cat:"กาแฟ"},
{name:"โกโก้",price:25,cat:"นม"},
{name:"นมสด",price:20,cat:"นม"},
{name:"แดงโซดา",price:20,cat:"โซดา"},
{name:"มะนาวโซดา",price:20,cat:"โซดา"}
];

const menuDiv=document.getElementById("menu");

menu.forEach((m,i)=>{
 menuDiv.innerHTML+=`
 <div class="card">
  [${m.cat}] ${m.name} - ${m.price}
  <br><button onclick="add(${i})">เพิ่ม</button>
 </div>`;
});

window.add=i=>{
 const e=cart.find(x=>x.id==i);
 if(e){e.qty++}else{cart.push({...menu[i],id:i,qty:1})}
 render();
}

function render(){
 let total=0;
 cart.innerHTML="";
 const div=document.getElementById("cart");
 div.innerHTML="";
 cart.forEach((c,i)=>{
  total+=c.price*c.qty;
  div.innerHTML+=`
  <div class="cart">
  ${c.name} x ${c.qty}
  <button onclick="inc(${i})">+</button>
  <button onclick="dec(${i})">-</button>
  </div>`;
 });
 document.getElementById("total").innerText="รวม: "+total+" บาท";
}

window.inc=i=>{cart[i].qty++;render()}
window.dec=i=>{cart[i].qty--;if(cart[i].qty<=0)cart.splice(i,1);render()}

window.submitOrder=async()=>{
 await addDoc(collection(db,"orders"),{
  name:document.getElementById("name").value,
  phone:document.getElementById("phone").value,
  cart,status:"new",time:Date.now()
 });
 alert("สำเร็จ");
 cart=[];render();
}
</script>

</body>
</html>
