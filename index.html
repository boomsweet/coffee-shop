<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hop Cafe</title>
<style>
body{font-family:sans-serif;background:#f1f5f9;padding:10px}
.card{background:#fff;padding:10px;margin:10px;border-radius:10px}
button{padding:8px;margin:3px}
.cart{background:#fff;padding:10px;margin:5px;border-radius:10px}
</style>
</head>

<body>

<h1>☕ Hop Cafe</h1>
<div id="menu"></div>

<h2>🧾 รายการ</h2>
<input id="name" placeholder="ชื่อ">
<input id="phone" placeholder="เบอร์">
<div id="cart"></div>
<h3 id="total"></h3>

<button onclick="submitOrder()">ยืนยันออเดอร์</button>

<script type="module">
import { db, collection, addDoc } from "./firebase.js";

let cart=[];

const menu=[
{name:"ชาเขียวนม",price:25},{name:"โกโก้ชา",price:25},
{name:"ชาไทย",price:20},{name:"ชานมไต้หวัน",price:20},{name:"เนสที",price:20},
{name:"ชามะนาว",price:20},{name:"ชาดำ",price:20},{name:"ชาเขียวใส",price:20},
{name:"ชาเขียวมะนาว",price:20},{name:"ชาเขียวน้ำผึ้งมะนาว",price:20},
{name:"โกโก้",price:25},{name:"นมสด",price:20},
{name:"เอสเพรสโซ่",price:25},{name:"ลาเต้",price:25},
{name:"แดงโซดา",price:20},{name:"มะนาวโซดา",price:20}
];

const menuDiv=document.getElementById("menu");
const cartDiv=document.getElementById("cart");

menu.forEach((m,i)=>{
 menuDiv.innerHTML+=`
 <div class="card">
 ${m.name} (${m.price})
 <br>
 <label><input type="checkbox" id="b${i}"> ไข่มุก +5</label>
 <br>
 <button onclick="add(${i})">เพิ่ม</button>
 </div>`;
});

window.add=i=>{
 const bubble=document.getElementById("b"+i).checked?5:0;
 const e=cart.find(x=>x.id==i && x.bubble==bubble);

 if(e){e.qty++}
 else{cart.push({...menu[i],id:i,qty:1,bubble})}

 render();
}

function render(){
 let total=0;
 cartDiv.innerHTML="";

 cart.forEach((c,i)=>{
  total+=(c.price+c.bubble)*c.qty;

  cartDiv.innerHTML+=`
  <div class="cart">
  ${c.name} ${c.bubble?"+ไข่มุก":""}
  <br>
  จำนวน: ${c.qty}
  <br>
  <button onclick="inc(${i})">➕</button>
  <button onclick="dec(${i})">➖</button>
  <button onclick="removeItem(${i})">❌ ลบ</button>
  </div>`;
 });

 document.getElementById("total").innerText="รวม "+total+" บาท";
}

window.inc=i=>{cart[i].qty++;render()}
window.dec=i=>{cart[i].qty--;if(cart[i].qty<=0)cart.splice(i,1);render()}
window.removeItem=i=>{cart.splice(i,1);render()}

window.submitOrder=async()=>{
 if(cart.length===0) return alert("ยังไม่ได้สั่ง");

 await addDoc(collection(db,"orders"),{
  name:document.getElementById("name").value,
  phone:document.getElementById("phone").value,
  cart,
  status:"new",
  time:Date.now()
 });

 alert("สั่งสำเร็จ");
 cart=[]; render();
}
</script>

</body>
</html>
