<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Hop Tea - ลูกค้า</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b00">
<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5}
.header{background:#ff6b00;color:#fff;padding:15px;font-size:20px;text-align:center}
.tabs{display:flex;background:#fff;margin-top:10px}
.tab{flex:1;text-align:center;padding:10px;cursor:pointer}
.active{border-bottom:3px solid #ff6b00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:10px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 4px 8px rgba(0,0,0,0.1)}
.card img{width:100%;height:120px;object-fit:cover}
.card-body{padding:10px}
.cart{position:fixed;bottom:0;width:100%;background:#fff;padding:10px;box-shadow:0 -2px 8px rgba(0,0,0,0.1)}
.cart input{width:calc(50% - 10px);margin:5px 5px 5px 0;padding:5px}
button{padding:8px;margin:5px;border:none;border-radius:6px;background:#ff6b00;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="header">☕ Hop Tea - ลูกค้า</div>

<div class="tabs">
<div class="tab active" onclick="setCat('tea',this)">ชา</div>
<div class="tab" onclick="setCat('jasmine',this)">ชามะลิ</div>
<div class="tab" onclick="setCat('berry',this)">ชาเบอร์รี่</div>
<div class="tab" onclick="setCat('milk',this)">นม</div>
<div class="tab" onclick="setCat('coffee',this)">กาแฟ</div>
<div class="tab" onclick="setCat('soda',this)">โซดา</div>
<div class="tab" onclick="setCat('other',this)">อื่นๆ</div>
</div>

<div id="menu" class="grid"></div>

<div class="cart">
<div id="cart"></div>
รวม: <span id="total">0</span> บาท
<h4>💳 ชำระเงิน</h4>
<img id="qr" width="180"><br>
<input id="name" placeholder="ชื่อ">
<input id="phone" placeholder="เบอร์">
<button onclick="order()">สั่งเลย</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
  apiKey:"YOUR_API_KEY",
  databaseURL:"YOUR_DB_URL"
});
const db = getDatabase(app);

const menuData = {
 // Hop Tea (ชา)
 "tea1":{name:"ชาเขียวนม",price:25,img:"images/green-milk-tea.jpg"},
 "tea2":{name:"ชานมโกโก้",price:25,img:"images/cocoa-tea.jpg"},
 "tea3":{name:"ชาไทย",price:20,img:"images/thai-tea.jpg"},
 "tea4":{name:"ชานมไต้หวัน",price:20,img:"images/taiwan-milk-tea.jpg"},
 "tea5":{name:"ชาเนสที",price:20,img:"images/nestea.jpg"},
 "tea6":{name:"ชามะนาว",price:20,img:"images/lemon-tea.jpg"},
 "tea7":{name:"ชาดำ",price:20,img:"images/black-tea.jpg"},
 "tea8":{name:"ชาเขียวใส",price:20,img:"images/green-tea.jpg"},
 "tea9":{name:"ชาเขียวมะนาว",price:20,img:"images/lemon-green-tea.jpg"},
 "tea10":{name:"ชาเขียวน้ำผึ้งมะนาว",price:20,img:"images/honey-lemon-green-tea.jpg"},

 // Hop Jasmine Tea
 "jasmine1":{name:"ชามะลิ",price:20,img:"images/jasmine-tea.jpg"},
 "jasmine2":{name:"ชามะลิลิ้นจี่",price:20,img:"images/lychee-jasmine.jpg"},
 "jasmine3":{name:"ชามะลิแอปเปิ้ล",price:20,img:"images/apple-jasmine.jpg"},
 "jasmine4":{name:"ชามะลิสตรอว์เบอร์รี่",price:20,img:"images/strawberry-jasmine.jpg"},
 "jasmine5":{name:"ชามะลิเก๊กฮวย",price:20,img:"images/honey-jasmine.jpg"},
 "jasmine6":{name:"ชามะลินม",price:20,img:"images/milk-jasmine.jpg"},

 // Hop Berry Tea
 "berry1":{name:"ชาเบอร์รี่",price:20,img:"images/berry-tea.jpg"},
 "berry2":{name:"ชาเบอร์รี่มะนาว",price:20,img:"images/lemon-berry.jpg"},
 "berry3":{name:"ชาเบอร์รี่น้ำผึ้ง",price:20,img:"images/honey-berry.jpg"},
 "berry4":{name:"ชาเบอร์รี่โกโก้",price:25,img:"images/cocoa-berry.jpg"},

 // Hop Milk
 "milk1":{name:"นมสด",price:20,img:"images/fresh-milk.jpg"},
 "milk2":{name:"นมชมพู",price:20,img:"images/pink-milk.jpg"},
 "milk3":{name:"โกโก้",price:25,img:"images/cocoa.jpg"},
 "milk4":{name:"โอวัลติน",price:20,img:"images/ovaltine.jpg"},
 "milk5":{name:"นมเผือก",price:20,img:"images/taro-milk.jpg"},
 "milk6":{name:"นมแคนตาลูป",price:20,img:"images/cantaloupe-milk.jpg"},
 "milk7":{name:"สตรอว์เบอร์รี่นมสด",price:20,img:"images/strawberry-milk.jpg"},

 // Hop Coffee
 "coffee1":{name:"เอสเปรสโซ่",price:25,img:"images/espresso.jpg"},
 "coffee2":{name:"ลาเต้",price:25,img:"images/latte.jpg"},
 "coffee3":{name:"มอคค่า",price:25,img:"images/mocha.jpg"},
 "coffee4":{name:"คาปูชิโน่",price:25,img:"images/cappuccino.jpg"},

 // Hop Soda
 "soda1":{name:"แดงโซดา",price:20,img:"images/red-soda.jpg"},
 "soda2":{name:"เขียวโซดา",price:20,img:"images/green-soda.jpg"},
 "soda3":{name:"มะนาวโซดา",price:20,img:"images/lemon-soda.jpg"},
 "soda4":{name:"น้ำผึ้งมะนาวโซดา",price:20,img:"images/honey-lemon-soda.jpg"},
 "soda5":{name:"เสาวรสโซดา",price:20,img:"images/passion-soda.jpg"},
 "soda6":{name:"บลูฮาวายโซดา",price:20,img:"images/blue-hawaii-soda.jpg"},
 "soda7":{name:"องุ่นโซดา",price:20,img:"images/grape-soda.jpg"},
 "soda8":{name:"ลิ้นจี่โซดา",price:20,img:"images/lychee-soda.jpg"},
 "soda9":{name:"แคนตาลูปโซดา",price:20,img:"images/cantaloupe-soda.jpg"},
 "soda10":{name:"สตรอว์เบอร์รี่โซดา",price:20,img:"images/strawberry-soda.jpg"},
 "soda11":{name:"มะม่วงโซดา",price:20,img:"images/mango-soda.jpg"},
 "soda12":{name:"กีวี่โซดา",price:20,img:"images/kiwi-soda.jpg"},
 "soda13":{name:"แอปเปิ้ลโซดา",price:20,img:"images/apple-soda.jpg"},

 // เมนูอื่นๆ
 "other1":{name:"ชาพีช",price:20,img:"images/peach-tea.jpg"},
 "other2":{name:"ชานมไต้หวันบราวน์ชูก้า",price:25,img:"images/brown-sugar-milk-tea.jpg"},
 "other3":{name:"ชาเขียวบราวน์ชูก้า",price:25,img:"images/brown-sugar-green-tea.jpg"},
 "other4":{name:"นมสดบราวน์ชูก้า",price:25,img:"images/brown-sugar-milk.jpg"}
};

let cart={}, cat="tea";

function setCat(c,e){
  cat=c;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  e.classList.add("active");
  renderMenu();
}

function renderMenu(){
  let html="";
  for(let k in menuData){
    const m=menuData[k];
    if(cat==="tea" && !k.startsWith("tea")) continue;
    if(cat==="jasmine" && !k.startsWith("jasmine")) continue;
    if(cat==="berry" && !k.startsWith("berry")) continue;
    if(cat==="milk" && !k.startsWith("milk")) continue;
    if(cat==="coffee" && !k.startsWith("coffee")) continue;
    if(cat==="soda" && !k.startsWith("soda")) continue;
    if(cat==="other" && !k.startsWith("other")) continue;
    html+=`<div class="card"><img src="${m.img}">
      <div class="card-body">
      ${m.name} ${m.price} บาท<br>
      <button onclick="add('${k}')">+</button>
      <button onclick="removeItem('${k}')">-</button>
      จำนวน: ${cart[k]?.qty||0}
      </div>
    </div>`;
  }
  document.getElementById("menu").innerHTML=html;
}

function add(k){
  if(!cart[k]) cart[k]={qty:0,price:menuData[k].price};
  cart[k].qty++;
  renderCart();
}
function removeItem(k){
  if(cart[k]){cart[k].qty--; if(cart[k].qty<=0) delete cart[k];}
  renderCart();
}
function renderCart(){
  let t=0, html="";
  for(let k in cart){t+=cart[k].price*cart[k].qty; html+=`${menuData[k].name} x${cart[k].qty}<br>`;}
  document.getElementById("cart").innerHTML=html;
  document.getElementById("total").innerText=t;
}
function order(){
  push(ref(db,"orders"),{
    name:document.getElementById("name").value,
    phone:document.getElementById("phone").value,
    cart:cart,
    total:Object.values(cart).reduce((a,c)=>a+c.price*c.qty,0),
    status:"new",
    time:new Date().toLocaleString()
  });
  alert("สั่งสำเร็จ");
  cart={}; renderMenu(); renderCart();
}

renderMenu();
</script>
</body>
</html>
