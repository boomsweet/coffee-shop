.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}

button{background:#ff6b00;color:#fff;border:none;padding:5px;border-radius:5px;cursor:pointer}
input{padding:5px;margin:3px;border-radius:5px;border:1px solid #ccc;width:48%}
select{padding:3px;margin:3px;border-radius:5px;border:1px solid #ccc}

function setCat(c,e){
  cat=c;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  e.classList.add("active");
  renderMenu();
}

function renderMenu(){
  let html="";
  for(let k in menuData){
    const m=menuData[k];
    if(getCategory(m.name)!=cat) continue;
    html+=`
      <div class="card">
        <img src="${m.img}">
        <div class="card-body">
          ${m.name} <br> ${m.price} บาท
          <br>
          <button onclick="add('${k}',${m.price})">+</button>
          จำนวน: ${cart[k]?.qty||0}
        </div>
      </div>
    `;
  }
  document.getElementById("menu").innerHTML=html;
}

function getCategory(name){
  if(name.includes("ชา")) return "tea";
  if(name.includes("กาแฟ")||name.includes("เอสเปรส")||name.includes("ลาเต้")) return "coffee";
  if(name.includes("นม")) return "milk";
  if(name.includes("โซดา")) return "soda";
  return "other";
}

// cart
function add(k,p){
  if(!cart[k]) cart[k]={qty:0,price:p};
  cart[k].qty++;
  renderCart();
}

function renderCart(){
  let html="",total=0;
  for(let k in cart){
    const c=cart[k];
    total+=c.price*c.qty;
    html+=`${menuData[k].name} x${c.qty}<br>`;
  }
  document.getElementById("cart").innerHTML=html;
  document.getElementById("total").innerText=total;
}

// order to firebase
function order(){
  const name=document.getElementById("name").value;
  const phone=document.getElementById("phone").value;
  if(!name||!phone){alert("กรุณาใส่ชื่อและเบอร์");return;}
  push(ref(db,"orders"),{
    name, phone, cart, total:document.getElementById("total").innerText,
    status:"new",
    time:new Date().toLocaleString()
  });
  cart={};
  renderCart();
  alert("สั่งเรียบร้อย!");
}

renderMenu();
