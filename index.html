<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hop Cafe & R'romdee Kitchen</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6f4e37">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6f4e37; --secondary: #fdfaf7; --accent: #e67e22;
            --success: #27ae60; --bg: #f4f7f6; --card-shadow: 0 15px 30px rgba(0,0,0,0.08);
        }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); margin: 0; padding-bottom: 160px; color: #333; }
        header { 
            background: linear-gradient(135deg, var(--primary), #8d6e63); 
            color: white; padding: 40px 20px; text-align: center; 
            border-radius: 0 0 45px 45px; box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .container { max-width: 600px; margin: auto; padding: 15px; }
        
        /* ปรับปรุงส่วนค้นหาและตระกร้าให้ติดหนึบ (Sticky) */
        .sticky-tools { position: sticky; top: 10px; z-index: 1000; margin: -30px 15px 25px; display: flex; flex-direction: column; gap: 10px; }
        .search-box input {
            border: none; box-shadow: var(--card-shadow); border-radius: 25px;
            padding: 18px 25px; width: 100%; box-sizing: border-box; font-size: 1.1em; outline: none;
        }
        .mini-cart { 
            background: var(--primary); color: white; border-radius: 20px; padding: 12px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.2); cursor: pointer; transition: 0.3s;
        }
        .mini-cart:active { transform: scale(0.95); }

        .tabs { display: flex; gap: 10px; margin-bottom: 25px; overflow-x: auto; padding: 5px; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            flex: 0 0 auto; padding: 12px 24px; background: white; border-radius: 35px;
            font-weight: 600; cursor: pointer; transition: 0.3s; border: 1px solid #eee; color: #7f8c8d;
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(111, 78, 55, 0.3); }
        
        #menu { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .card { background: #fff; border-radius: 25px; box-shadow: var(--card-shadow); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #f1f1f1; }
        .card-content { padding: 15px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; }
        .category-title { grid-column: 1 / -1; font-weight: bold; color: var(--primary); margin: 15px 0 5px; font-size: 1.1em; padding-left: 5px; border-left: 4px solid var(--accent); }
        .price { color: var(--accent); font-weight: bold; font-size: 1.2em; margin: 8px 0; }
        
        .option-group { background: #fdfaf7; padding: 10px; border-radius: 15px; margin-bottom: 10px; text-align: left; border: 1px solid #f1e9e2; }
        select { width: 100%; padding: 8px; border-radius: 10px; border: 1px solid #ddd; font-family: 'Kanit'; font-size: 0.85em; margin-bottom: 5px; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 15px; font-weight: 600; cursor: pointer; width: 100%; margin-top: auto; }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .order-form { background: white; padding: 25px; border-radius: 30px; box-shadow: var(--card-shadow); }
        input, textarea { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #eee; border-radius: 15px; box-sizing: border-box; font-family: 'Kanit'; background: #f9f9f9; }
        
        .btn-gps { background: #4285F4; color: white; border: none; padding: 12px; border-radius: 15px; width: 100%; font-weight: 600; margin-bottom: 15px; cursor: pointer; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.9em; }

        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 20px 30px; box-shadow: 0 -10px 30px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; z-index: 1000; border-radius: 30px 30px 0 0; }
        .btn-submit { background: var(--success); color: white; padding: 15px 35px; font-size: 1.1em; font-weight: bold; border-radius: 18px; border: none; cursor: pointer; }
        
        /* สไตล์ช่องบอกสถานะ */
        #statusDisplay { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 2000; width: 90%; max-width: 400px; display: none; }
        .status-card { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border-left: 8px solid var(--warning); display: flex; align-items: center; gap: 15px; }
    </style>
</head>
<body>

<div id="statusDisplay">
    <div class="status-card" id="statusCard">
        <div style="font-size: 2em;" id="statusIcon">⏳</div>
        <div>
            <div style="font-weight: bold;" id="statusTitle">กำลังรอรับออเดอร์</div>
            <small id="statusDesc">ร้านค้ากำลังตรวจสอบรายการของคุณ</small>
        </div>
    </div>
</div>

<header>
    <h1 style="margin:0;">☕ Hop Cafe & 🍛 ครัวอารมณ์ดี</h1>
</header>

<div class="container">
    <div id="page-menu" class="page active">
        <div class="sticky-tools">
            <div class="search-box"><input type="text" id="searchInput" placeholder="🔍 ค้นหาเมนู..." oninput="window.filterMenu()"></div>
            <div id="miniCartDisplay" class="mini-cart" style="display: none;" onclick="window.togglePage('checkout')">
                <span>🛒 เลือกไว้แล้ว <b id="cartCount">0</b> รายการ</span>
                <span style="font-weight: bold;">ไปตะกร้า ></span>
            </div>
        </div>

        <div class="tabs">
            <div class="tab-btn active" id="tab-food" onclick="window.switchTab('food')">🍛 อาหารตามสั่ง</div>
            <div class="tab-btn" id="tab-snack" onclick="window.switchTab('snack')">🍟 ทานเล่น</div>
            <div class="tab-btn" id="tab-coffee" onclick="window.switchTab('coffee')">☕ กาแฟสด</div>
            <div class="tab-btn" id="tab-hop-tea" onclick="window.switchTab('hop-tea')">🥤 Hop Tea</div>
            <div class="tab-btn" id="tab-strawberry" onclick="window.switchTab('strawberry')">🍓 สตรอว์เบอร์รี่</div>
            <div class="tab-btn" id="tab-hop-milk" onclick="window.switchTab('hop-milk')">🥛 Hop Milk</div>
            <div class="tab-btn" id="tab-hop-other" onclick="window.switchTab('hop-other')">✨ อื่นๆ/โซดา</div>
        </div>
        <div id="menu"></div>
    </div>

    <div id="page-checkout" class="page">
        <button onclick="window.togglePage('menu')" style="width:100%; padding:15px; border-radius:15px; border:1px solid var(--primary); background:white; color:var(--primary); font-weight:600; margin-bottom:15px;">← กลับไปเลือกเมนูเพิ่ม</button>
        <div class="order-form">
            <h3 style="margin-top:0">📍 ข้อมูลจัดส่ง</h3>
            <input id="userName" type="text" placeholder="ชื่อลูกค้า">
            <input id="userPhone" type="tel" placeholder="เบอร์โทรศัพท์">
            <button class="btn-gps" onclick="window.getLocation()">📍 กดเพื่อปักหมุดที่อยู่ปัจจุบัน</button>
            <textarea id="userAddress" rows="3" placeholder="ระบุบ้านเลขที่/ซอย/จุดสังเกต"></textarea>
            <input id="userGps" type="hidden">
            <div id="gpsStatus" style="font-size:0.8em; color:var(--success); text-align:center; margin-bottom:10px;"></div>
            <hr>
            <h3>🛒 สรุปรายการ</h3>
            <div id="cartSummary"></div>
        </div>
    </div>
</div>

<div class="bottom-bar">
    <div>
        <small>ราคารวม</small>
        <div id="totalDisplay" style="font-size: 1.4em; font-weight: bold; color: var(--primary);">0 บาท</div>
    </div>
    <button id="mainBtn" class="btn-submit" onclick="window.handleMainBtn()">สั่งเลย</button>
</div>

            { cat: "สลัดผัก", name: "สลัดผักทูน่า", price: 60 },

            { cat: "เพิ่มท็อปปิ้ง", name: "ไข่ดาว", price: 10 },
            { cat: "เพิ่มท็อปปิ้ง", name: "ไข่เจียว", price: 15 },
            { cat: "เพิ่มท็อปปิ้ง", name: "ไข่เจียวไก่/กุ้ง", price: 25 },
            { cat: "เพิ่มท็อปปิ้ง", name: "ข้าวเปล่า", price: 10 }
        ],

            { cat: "ของทานเล่น", name: "ชุดคู่สุขใจ (2 อย่าง)", price: 59, type: 'snack-opt' },

            { cat: "เบอร์เกอร์", name: "เบอร์เกอร์ไก่", price: 35, type: 'burger' },
            { cat: "เบอร์เกอร์", name: "เบอร์เกอร์เนื้อ", price: 40, type: 'burger' },
            { cat: "เบอร์เกอร์", name: "เบอร์เกอร์กุ้ง", price: 40, type: 'burger' }
        ],

            { cat: "กาแฟสด", name: "อเมริกาโน่ส้ม", price: 30, type: "coffee" }
        ],
        strawberry: [
            { cat: "🍓 นมสดสตรอว์เบอร์รี่", name: "โกโก้นมสดสตรอว์เบอร์รี่", price: 39 },
            { cat: "🍓 นมสดสตรอว์เบอร์รี่", name: "กาแฟนมสดสตรอว์เบอร์รี่", price: 39 },
            { cat: "🍓 นมสดสตรอว์เบอร์รี่", name: "นมสดสตรอว์เบอร์รี่", price: 39 },
            { cat: "🍓 นมสดสตรอว์เบอร์รี่", name: "ชาไทยนมสดสตรอว์เบอร์รี่", price: 39 },
            { cat: "🍓 นมสดสตรอว์เบอร์รี่", name: "ชาเขียวนมสดสตรอว์เบอร์รี่", price: 39 }
        ],
        'hop-tea': [
            { cat: "Hop Tea (25.-)", name: "ชาเขียวนม", price: 25 },
            { cat: "Hop Tea (25.-)", name: "โกโก้ชา", price: 25 },

            { cat: "Hop Tea (20.-)", name: "ชามะนาว", price: 20 },
            { cat: "Hop Tea (20.-)", name: "ชาดำ", price: 20 },
            { cat: "Hop Tea (20.-)", name: "ชาเขียวใส", price: 20 },

        ],
        'hop-milk': [

            { cat: "Hop Milk", name: "นมสด", price: 20 },
            { cat: "Hop Milk", name: "นมชมพู", price: 20 },
            { cat: "Hop Milk", name: "โอวัลติน", price: 20 },
            { cat: "Hop Milk", name: "นมเผือก", price: 20 },
            { cat: "Hop Milk", name: "นมแคนตาลูป", price: 20 }
        ],
        'hop-other': [
            { cat: "Hop Coffee (25.-)", name: "เอสเพรสโซ่ (Hop)", price: 25 },
            { cat: "Hop Coffee (25.-)", name: "คาปูชิโน่ (Hop)", price: 25 },
            { cat: "Soda (20.-)", name: "แดงโซดา", price: 20 },
            { cat: "Soda (20.-)", name: "น้ำผึ้งมะนาวโซดา", price: 20 },
            { cat: "Soda (20.-)", name: "บลูฮาวาย", price: 20 },
            { cat: "Signature", name: "ชานมบราวน์ซูการ์", price: 20 },
            { cat: "Signature", name: "นมสดบราวน์ซูการ์", price: 20 },
            { cat: "Signature", name: "ชาพีช", price: 20 }
        ]
    };

    window.togglePage = (p) => {
        document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
        document.getElementById(`page-${p}`).classList.add('active');
        document.getElementById('mainBtn').innerText = (p === 'checkout') ? "ยืนยันการสั่งซื้อ" : "สั่งเลย";
        window.scrollTo(0,0);
    };

    window.handleMainBtn = () => {
        if (document.getElementById('page-menu').classList.contains('active')) {
            if (cart.length === 0) return alert("กรุณาเลือกเมนูก่อนครับ");
            window.togglePage('checkout');
        } else {
            submitOrder();
        }
    };

    window.switchTab = (t) => {
        currentTab = t;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`tab-${t}`).classList.add('active');
        renderMenu();
    };

    window.filterMenu = () => {
        searchQuery = document.getElementById('searchInput').value.toLowerCase();
        renderMenu();
    };

    function renderMenu() {
        const menuDiv = document.getElementById("menu");
        menuDiv.innerHTML = "";
        let lastCat = "";
        const items = menuData[currentTab].filter(i => i.name.toLowerCase().includes(searchQuery));

        items.forEach((m, index) => {
            if (m.cat !== lastCat) {
                const catDiv = document.createElement('div');
                catDiv.className = "category-title";
                catDiv.innerText = m.cat;
                menuDiv.appendChild(catDiv);
                lastCat = m.cat;
            }
            
            let options = "";
            // ส่วนตัวเลือกเพิ่มเติมของแต่ละหมวด
            if (currentTab.includes('hop') || currentTab === 'strawberry') {
                options = `<div class="option-group">
                    <select id="opt-${index}"><option value="หวานปกติ">หวานปกติ</option><option value="หวานน้อย">หวานน้อย</option></select>
                    <label style="font-size:0.8em"><input type="checkbox" id="mook-${index}"> ไข่มุก (+5)</label>
                </div>`;
            } else if (m.type === 'coffee') {
                options = `<div class="option-group">
                    <select id="opt-${index}"><option value="ร้อน (30.-)">ร้อน</option><option value="เย็น (40.-)">เย็น</option><option value="ปั่น (50.-)">ปั่น</option></select>
                </div>`;
            } else if (m.type === 'spicy') {
                options = `<div class="option-group">
                    <select id="opt-${index}"><option value="เผ็ดปกติ">เผ็ดปกติ</option><option value="ไม่เผ็ด">ไม่เผ็ด</option><option value="เผ็ดมาก">เผ็ดมาก</option></select>
                </div>`;
            } else if (m.type === 'burger') {
                options = `<div class="option-group">
                    <label style="font-size:0.8em"><input type="checkbox" id="cheese-${index}"> เพิ่มชีส (+15)</label>
                    <label style="font-size:0.8em"><input type="checkbox" id="egg-${index}"> ไข่ดาว (+10)</label>
                </div>`;
            } else if (m.type === 'snack-opt') {
                options = `<div class="option-group">
                    <select id="opt-${index}"><option value="ฟรายส์+นักเก็ต">ฟรายส์+นักเก็ต</option><option value="ฟรายส์+ชีสบอล">ฟรายส์+ชีสบอล</option><option value="ชีสบอล+นักเก็ต">ชีสบอล+นักเก็ต</option></select>
                </div>`;
            }

            const card = document.createElement('div');
            card.className = "card";
            card.innerHTML = `<div class="card-content">
                <b>${m.name}</b><div class="price">${m.price}.-</div>
                ${options}<button class="btn-add" onclick="window.addToCart(${index})">เพิ่ม</button>
            </div>`;
            menuDiv.appendChild(card);
        });
    }

    window.addToCart = (idx) => {
        const item = menuData[currentTab][idx];
        let price = item.price, sweet = "", bubble = 0, note = "";
        const optEl = document.getElementById(`opt-${idx}`);
        
        if (currentTab.includes('hop') || currentTab === 'strawberry') {
            sweet = optEl.value;
            bubble = document.getElementById(`mook-${idx}`).checked ? 5 : 0;
        } else if (item.type === 'coffee') {
            price = optEl.value.includes('ร้อน') ? 30 : optEl.value.includes('เย็น') ? 40 : 50;
            note = optEl.value;
        } else if (item.type === 'burger') {
            const c = document.getElementById(`cheese-${idx}`).checked;
            const e = document.getElementById(`egg-${idx}`).checked;
            if(c) { price += 15; note += "เพิ่มชีส "; }
            if(e) { price += 10; note += "เพิ่มไข่ดาว "; }
        } else if (optEl) {
            note = optEl.value;
        }

        const cartId = `${item.name}-${sweet}-${bubble}-${note}-${price}`;
        const found = cart.find(x => x.cartId === cartId);
        if (found) found.qty++; else cart.push({ ...item, price, sweet, bubble, note, qty: 1, cartId });
        updateCartUI();
    };

    function updateCartUI() {
        const summary = document.getElementById("cartSummary");
        const totalDisp = document.getElementById("totalDisplay");
        const mini = document.getElementById("miniCartDisplay");
        const count = document.getElementById("cartCount");

        if (cart.length === 0) {
            summary.innerHTML = "<p style='text-align:center'>ยังไม่มีสินค้า</p>";
            totalDisp.innerText = "0 บาท";
            mini.style.display = "none";
            return;
        }

        mini.style.display = "flex";
        count.innerText = cart.reduce((a, b) => a + b.qty, 0);

        let total = 0; summary.innerHTML = "";
        cart.forEach((c, i) => {
            const sum = (c.price + (c.bubble || 0)) * c.qty;
            total += sum;
            summary.innerHTML += `<div class="cart-item">
                <div><b>${c.name}</b><br><small>${c.sweet} ${c.note}</small></div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <button onclick="window.changeQty(${i}, -1)">-</button>
                    <b>${c.qty}</b>
                    <button onclick="window.changeQty(${i}, 1)">+</button>
                </div>
                <div>${sum}.-</div>
            </div>`;
        });
        totalDisp.innerText = total.toLocaleString() + " บาท";
    }

    window.changeQty = (i, d) => {
        cart[i].qty += d;
        if (cart[i].qty <= 0) cart.splice(i, 1);
        updateCartUI();
    };

    window.getLocation = () => {
        const s = document.getElementById('gpsStatus');
        if (!navigator.geolocation) return alert("มือถือไม่รองรับ GPS");
        s.innerText = "กำลังหาพิกัด...";
        navigator.geolocation.getCurrentPosition(p => {
            const lat = p.coords.latitude, lng = p.coords.longitude;
            document.getElementById('userGps').value = `https://www.google.com/maps?q=${lat},${lng}`;
            s.innerText = "✅ ปักหมุดสำเร็จ";
        }, () => { s.innerText = "❌ ปักหมุดไม่สำเร็จ"; });
    };

    async function submitOrder() {
        const name = document.getElementById("userName").value;
        const phone = document.getElementById("userPhone").value;
        const addr = document.getElementById("userAddress").value;
        const gps = document.getElementById("userGps").value;

        if (!name || !phone || !addr) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");

        try {
            const ref = await addDoc(collection(db, "orders"), {
                name, phone, address: addr, gps, cart,
                status: "new", time: Date.now()
            });
            
            // เริ่มติดตามสถานะออเดอร์
            trackStatus(ref.id);
            
            alert("สั่งเรียบร้อยครับ! ติดตามสถานะได้ที่ด้านบนหน้าจอ");
            cart = []; updateCartUI(); window.togglePage('menu');
        } catch (e) { alert("เกิดข้อผิดพลาด: " + e.message); }
    }

    function trackStatus(orderId) {
        const display = document.getElementById("statusDisplay");
        const card = document.getElementById("statusCard");
        const icon = document.getElementById("statusIcon");
        const title = document.getElementById("statusTitle");
        const desc = document.getElementById("statusDesc");

        onSnapshot(doc(db, "orders", orderId), (snap) => {
            if(!snap.exists()) return;
            const s = snap.data().status;
            display.style.display = "block";

            if(s === "new") {
                card.style.borderLeftColor = "#f59e0b";
                icon.innerText = "⏳"; title.innerText = "รอรับออเดอร์"; desc.innerText = "ร้านค้ากำลังตรวจสอบรายการ...";
            } else if(s === "doing") {
                card.style.borderLeftColor = "#38bdf8";
                icon.innerText = "👨‍🍳"; title.innerText = "กำลังเตรียมอาหาร"; desc.innerText = "พ่อครัวกำลังปรุงเมนูสุดพิเศษให้คุณ";
            } else if(s === "done") {
                card.style.borderLeftColor = "#22c55e";
                icon.innerText = "✅"; title.innerText = "จัดส่งเรียบร้อย"; desc.innerText = "ทานให้อร่อยนะคะ/ครับ!";
                setTimeout(() => { display.style.display = "none"; }, 10000); // หายไปหลังจาก 10 วินาที
            }
        });
    }

    renderMenu();
</script>
</body>
</html>
