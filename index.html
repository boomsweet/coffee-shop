<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hop Cafe</title>

<style>
body{font-family:sans-serif;background:#f1f5f9;padding:10px}
.card{background:#fff;padding:10px;margin:10px;border-radius:10px}
.cart{background:#fff;padding:10px;margin:5px;border-radius:10px}
button{padding:8px;margin:3px}
img{width:100%;border-radius:10px}
.status{background:#fff;padding:10px;margin:10px;border-radius:10px}
</style>

</head>

<body>

<h1>☕ Hop Cafe</h1>
<div id="menu"></div>

<h2>🧾 รายการ</h2>
<input id="name" placeholder="ชื่อ">
<input id="phone" placeholder="เบอร์">
<div id="cart"></div>
<h3 id="total"></h3>

<button onclick="submitOrder()">ยืนยัน</button>

<h2>📡 สถานะออเดอร์</h2>
<div id="statusBox"></div>

<script type="module">
import { db, collection, addDoc, doc, onSnapshot } from "./firebase.js";

let cart=[];
let currentOrderId=null;

// 🔥 ใช้รูปจริง (ไม่พัง)
const img = "https://images.unsplash.com/photo-1509042239860-f550ce710b93";

const menuList = [
{name:"ชาเขียวนม",price:25,img},
{name:"โกโก้ชา",price:25,img},
{name:"ชาไทย",price:20,img},
{name:"ชานมไต้หวัน",price:20,img},
{name:"เนสที",price:20,img},
{name:"ชามะนาว",price:20,img},
{name:"ชาดำ",price:20,img},
{name:"ชาเขียวใส",price:20,img},
{name:"ชาเขียวมะนาว",price:20,img},
{name:"ชาเขียวน้ำผึ้งมะนาว",price:20,img},

{name:"โกโก้",price:25,img},
{name:"นมสด",price:20,img},
{name:"นมชมพู",price:20,img},

{name:"เอสเพรสโซ่",price:25,img},
{name:"ลาเต้",price:25,img},

{name:"แดงโซดา",price:20,img},
{name:"เขียวโซดา",price:20,img},

{name:"ชาพีช",price:20,img},
{name:"ชานมบราวน์ซูการ์",price:20,img}
];

const menuDiv=document.getElementById("menu");
const cartDiv=document.getElementById("cart");
const statusBox=document.getElementById("statusBox");

// แสดงเมนู
menuList.forEach((m,i)=>{
 menuDiv.innerHTML+=`
 <div class="card">
 <img src="${m.img}">
 <b>${m.name}</b> (${m.price} บาท)
 <br>
 <label><input type="checkbox" id="b${i}"> ไข่มุก +5</label>
 <br>
 <button onclick="add(${i})">เพิ่ม</button>
 </div>`;
});

// เพิ่มสินค้า
window.add=i=>{
 const bubble=document.getElementById("b"+i).checked?5:0;
 const e=cart.find(x=>x.id==i && x.bubble==bubble);
 if(e){e.qty++}
 else{cart.push({...menuList[i],id:i,qty:1,bubble})}
 render();
};

// render
function render(){
 let total=0;
 cartDiv.innerHTML="";
 cart.forEach((c,i)=>{
  total+=(c.price+c.bubble)*c.qty;
  cartDiv.innerHTML+=`
  <div class="cart">
  ${c.name} x ${c.qty}
  <button onclick="inc(${i})">+</button>
  <button onclick="dec(${i})">-</button>
  </div>`;
 });
 document.getElementById("total").innerText="รวม "+total+" บาท";
}

window.inc=i=>{cart[i].qty++;render()}
window.dec=i=>{cart[i].qty--;if(cart[i].qty<=0)cart.splice(i,1);render()}

// 🔥 สั่งสินค้า (แก้แล้ว)
window.submitOrder=async()=>{
 try{

  if(!name.value || !phone.value){
    alert("กรอกชื่อ/เบอร์ก่อน");
    return;
  }

  if(cart.length===0){
    alert("ยังไม่ได้เลือกสินค้า");
    return;
  }

  const ref = await addDoc(collection(db,"orders"),{
    name:name.value,
    phone:phone.value,
    cart,
    status:"new",
    time:Date.now()
  });

  console.log("ส่งสำเร็จ:", ref.id);

  currentOrderId = ref.id;

  // ฟังสถานะ
  onSnapshot(doc(db,"orders",currentOrderId),(snap)=>{
    if(!snap.exists()) return;

    const s = snap.data().status;

    let text="รับออเดอร์แล้ว";
    if(s==="doing") text="กำลังทำ";
    if(s==="done") text="เสร็จแล้ว";

    statusBox.innerHTML = `
    <div class="status">
    สถานะ: <b>${text}</b>
    </div>`;
  });

  alert("สั่งสำเร็จ");

  cart=[];
  render();

 }catch(e){
  console.error(e);
  alert("❌ สั่งไม่สำเร็จ: " + e.message);
 }
}
</script>

</body>
</html>
