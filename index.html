<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hop Cafe & R'romdee Kitchen</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6f4e37">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6f4e37; --secondary: #fdfaf7; --accent: #e67e22;
            --success: #27ae60; --bg: #f4f7f6; --card-shadow: 0 15px 30px rgba(0,0,0,0.08);
        }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); margin: 0; padding-bottom: 160px; color: #333; }
        header { 
            background: linear-gradient(135deg, var(--primary), #8d6e63); 
            color: white; padding: 40px 20px; text-align: center; 
            border-radius: 0 0 45px 45px; box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .container { max-width: 600px; margin: auto; padding: 15px; }
        .search-box { margin: -30px 15px 25px; position: sticky; top: 15px; z-index: 100; }
        .search-box input {
            border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.12); border-radius: 25px;
            padding: 20px 28px; width: 100%; box-sizing: border-box; font-size: 1.1em; outline: none; transition: 0.3s;
        }
        
        .mini-cart { background: white; border-radius: 20px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--card-shadow); border: 1px solid var(--primary); cursor: pointer; }

        .tabs { display: flex; gap: 10px; margin-bottom: 25px; overflow-x: auto; padding: 5px; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            flex: 0 0 auto; padding: 12px 24px; background: white; border-radius: 35px;
            font-weight: 600; cursor: pointer; transition: 0.3s; border: 1px solid #eee; color: #7f8c8d;
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(111, 78, 55, 0.3); }
        
        #menu { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .card { background: #fff; border-radius: 25px; box-shadow: var(--card-shadow); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #f1f1f1; }
        .card-content { padding: 15px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; }
        .category-title { grid-column: 1 / -1; font-weight: bold; color: var(--primary); margin: 15px 0 5px; font-size: 1.1em; padding-left: 5px; border-left: 4px solid var(--accent); }
        .price { color: var(--accent); font-weight: bold; font-size: 1.2em; margin: 8px 0; }
        
        .option-group { background: #fdfaf7; padding: 10px; border-radius: 15px; margin-bottom: 10px; text-align: left; border: 1px solid #f1e9e2; }
        select { width: 100%; padding: 8px; border-radius: 10px; border: 1px solid #ddd; font-family: 'Kanit'; font-size: 0.85em; margin-bottom: 5px; }
        
        .btn-add { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 15px; font-weight: 600; cursor: pointer; width: 100%; margin-top: auto; }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .order-form { background: white; padding: 25px; border-radius: 30px; box-shadow: var(--card-shadow); }
        input, textarea { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #eee; border-radius: 15px; box-sizing: border-box; font-family: 'Kanit'; background: #f9f9f9; }
        
        .btn-gps { background: #4285F4; color: white; border: none; padding: 12px; border-radius: 15px; width: 100%; font-weight: 600; margin-bottom: 15px; cursor: pointer; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.9em; }

        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 20px 30px; box-shadow: 0 -10px 30px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; z-index: 1000; border-radius: 30px 30px 0 0; }
        .btn-submit { background: var(--success); color: white; padding: 15px 35px; font-size: 1.1em; font-weight: bold; border-radius: 18px; border: none; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0;">☕ Hop Cafe & 🍛 ครัวอารมณ์ดี</h1>
</header>

<div class="container">
    <div id="page-menu" class="page active">
        <div class="search-box"><input type="text" id="searchInput" placeholder="🔍 ค้นหาเมนู..." oninput="window.filterMenu()"></div>
        
        <div id="miniCartDisplay" class="mini-cart" style="display: none;" onclick="window.togglePage('checkout')">
            <span>🛒 เลือกแล้ว <b id="cartCount">0</b> อย่าง</span>
            <span style="color: var(--primary); font-weight: bold;">ดูตะกร้า ></span>
        </div>

        <div class="tabs">
            <div class="tab-btn active" id="tab-drink" onclick="window.switchTab('drink')">🥤 เครื่องดื่ม</div>
            <div class="tab-btn" id="tab-coffee" onclick="window.switchTab('coffee')">☕ กาแฟสด</div>
            <div class="tab-btn" id="tab-snack" onclick="window.switchTab('snack')">🍟 ของทานเล่น</div>
            <div class="tab-btn" id="tab-food" onclick="window.switchTab('food')">🍛 อาหารตามสั่ง</div>
        </div>
        <div id="menu"></div>
    </div>

    <div id="page-checkout" class="page">
        <button onclick="window.togglePage('menu')" style="width:100%; padding:15px; border-radius:15px; border:1px solid var(--primary); background:white; color:var(--primary); font-weight:600; margin-bottom:15px;">← กลับไปเลือกเมนูเพิ่ม</button>
        <div class="order-form">
            <h3 style="margin-top:0">📍 ข้อมูลจัดส่ง</h3>
            <input id="userName" type="text" placeholder="ชื่อลูกค้า">
            <input id="userPhone" type="tel" placeholder="เบอร์โทรศัพท์">
            <button class="btn-gps" onclick="window.getLocation()">📍 กดเพื่อปักหมุดที่อยู่ปัจจุบัน</button>
            <textarea id="userAddress" rows="3" placeholder="ระบุบ้านเลขที่/ซอย/จุดสังเกต"></textarea>
            <input id="userGps" type="hidden">
            <div id="gpsStatus" style="font-size:0.8em; color:var(--success); text-align:center; margin-bottom:10px;"></div>
            <hr>
            <h3>🛒 สรุปรายการ</h3>
            <div id="cartSummary"></div>
        </div>
        <div id="statusBox"></div>
    </div>
</div>

<div class="bottom-bar">
    <div>
        <small>ราคารวม</small>
        <div id="totalDisplay" style="font-size: 1.4em; font-weight: bold; color: var(--primary);">0 บาท</div>
    </div>
    <button id="mainBtn" class="btn-submit" onclick="window.handleMainBtn()">สั่งเลย</button>
</div>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, addDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    let cart = [];
    let currentTab = 'drink';
    let searchQuery = '';

    const menuData = {
        drink: [
            { cat: "Hop Tea (ชา)", name: "ชาเขียวนม", price: 25 },
            { cat: "Hop Tea (ชา)", name: "โกโก้ชา", price: 25 },
            { cat: "Hop Tea (ชา)", name: "ชาไทย", price: 20 },
            { cat: "🍓 นมสดสตรอว์เบอร์รี่", name: "นมสดสตรอว์เบอร์รี่", price: 39 },
            { cat: "Hop Milk (นม)", name: "โกโก้", price: 25 },
            { cat: "Hop Milk (นม)", name: "นมสด", price: 20 }
        ],
        coffee: [
            { cat: "กาแฟสด", name: "เอสเพรสโซ่", price: 30, type: "coffee" },
            { cat: "กาแฟสด", name: "ลาเต้", price: 30, type: "coffee" },
            { cat: "กาแฟสด", name: "อเมริกาโน่", price: 30, type: "coffee" }
        ],
        snack: [
            { cat: "ของทานเล่น", name: "ชุดจัมโบ้ 3 สหาย", price: 79 },
            { cat: "เบอร์เกอร์", name: "เบอร์เกอร์ไก่", price: 35, type: "burger" }
        ],
        food: [
            { cat: "กะเพรา", name: "กะเพราไก่", price: 40, type: 'spicy' },
            { cat: "กะเพรา", name: "กะเพราทะเล", price: 50, type: 'spicy' },
            { cat: "ทั่วไป", name: "ข้าวผัดไก่", price: 50 },
            { cat: "ทั่วไป", name: "ผัดไทย", price: 50 }
        ]
    };

    window.togglePage = (p) => {
        document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
        document.getElementById(`page-${p}`).classList.add('active');
        document.getElementById('mainBtn').innerText = (p === 'checkout') ? "ยืนยันการสั่งซื้อ" : "สั่งเลย";
        window.scrollTo(0,0);
    };

    window.handleMainBtn = () => {
        if (document.getElementById('page-menu').classList.contains('active')) {
            if (cart.length === 0) return alert("กรุณาเลือกเมนูก่อนครับ");
            window.togglePage('checkout');
        } else {
            submitOrder();
        }
    };

    window.switchTab = (t) => {
        currentTab = t;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`tab-${t}`).classList.add('active');
        renderMenu();
    };

    window.filterMenu = () => {
        searchQuery = document.getElementById('searchInput').value.toLowerCase();
        renderMenu();
    };

    function renderMenu() {
        const menuDiv = document.getElementById("menu");
        menuDiv.innerHTML = "";
        let lastCat = "";
        const items = menuData[currentTab].filter(i => i.name.toLowerCase().includes(searchQuery));

        items.forEach((m, index) => {
            if (m.cat !== lastCat) {
                const catDiv = document.createElement('div');
                catDiv.className = "category-title";
                catDiv.innerText = m.cat;
                menuDiv.appendChild(catDiv);
                lastCat = m.cat;
            }
            
            let options = "";
            if (currentTab === 'drink') {
                options = `<div class="option-group">
                    <select id="opt-${index}"><option value="หวานปกติ">หวานปกติ</option><option value="หวานน้อย">หวานน้อย</option></select>
                    <label style="font-size:0.8em"><input type="checkbox" id="mook-${index}"> ไข่มุก (+5)</label>
                </div>`;
            } else if (m.type === 'coffee') {
                options = `<div class="option-group">
                    <select id="opt-${index}"><option value="ร้อน (30.-)">ร้อน</option><option value="เย็น (40.-)">เย็น</option><option value="ปั่น (50.-)">ปั่น</option></select>
                </div>`;
            } else if (m.type === 'spicy') {
                options = `<div class="option-group">
                    <select id="opt-${index}"><option value="เผ็ดปกติ">เผ็ดปกติ</option><option value="ไม่เผ็ด">ไม่เผ็ด</option><option value="เผ็ดมาก">เผ็ดมาก</option></select>
                </div>`;
            }

            const card = document.createElement('div');
            card.className = "card";
            card.innerHTML = `<div class="card-content">
                <b>${m.name}</b><div class="price">${m.price}.-</div>
                ${options}<button class="btn-add" onclick="window.addToCart(${index})">เพิ่ม</button>
            </div>`;
            menuDiv.appendChild(card);
        });
    }

    window.addToCart = (idx) => {
        const item = menuData[currentTab][idx];
        let price = item.price, sweet = "", bubble = 0, note = "";
        const optEl = document.getElementById(`opt-${idx}`);
        
        if (currentTab === 'drink') {
            sweet = optEl.value;
            bubble = document.getElementById(`mook-${idx}`).checked ? 5 : 0;
        } else if (item.type === 'coffee') {
            const v = optEl.value;
            price = v.includes('ร้อน') ? 30 : v.includes('เย็น') ? 40 : 50;
            note = v;
        } else if (optEl) {
            note = optEl.value;
        }

        const cartId = `${item.name}-${sweet}-${bubble}-${note}-${price}`;
        const found = cart.find(x => x.cartId === cartId);
        if (found) found.qty++; else cart.push({ ...item, price, sweet, bubble, note, qty: 1, cartId });
        updateCartUI();
    };

    function updateCartUI() {
        const summary = document.getElementById("cartSummary");
        const totalDisp = document.getElementById("totalDisplay");
        const mini = document.getElementById("miniCartDisplay");
        const count = document.getElementById("cartCount");

        if (cart.length === 0) {
            summary.innerHTML = "<p style='text-align:center'>ยังไม่มีสินค้า</p>";
            totalDisp.innerText = "0 บาท";
            mini.style.display = "none";
            return;
        }

        mini.style.display = "flex";
        count.innerText = cart.reduce((a, b) => a + b.qty, 0);

        let total = 0; summary.innerHTML = "";
        cart.forEach((c, i) => {
            const sum = (c.price + (c.bubble || 0)) * c.qty;
            total += sum;
            summary.innerHTML += `<div class="cart-item">
                <div><b>${c.name}</b><br><small>${c.sweet} ${c.note}</small></div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <button onclick="window.changeQty(${i}, -1)">-</button>
                    <b>${c.qty}</b>
                    <button onclick="window.changeQty(${i}, 1)">+</button>
                </div>
                <div>${sum}.-</div>
            </div>`;
        });
        totalDisp.innerText = total.toLocaleString() + " บาท";
    }

    window.changeQty = (i, d) => {
        cart[i].qty += d;
        if (cart[i].qty <= 0) cart.splice(i, 1);
        updateCartUI();
    };

    window.getLocation = () => {
        const s = document.getElementById('gpsStatus');
        if (!navigator
