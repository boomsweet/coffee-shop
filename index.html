<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hop Tea - ลูกค้า</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b00">
<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5}
.header{background:#ff6b00;color:#fff;padding:15px;text-align:center;font-size:20px}
.tabs{display:flex;background:#fff;margin-top:10px}
.tab{flex:1;text-align:center;padding:10px;cursor:pointer}
.active{border-bottom:3px solid #ff6b00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:10px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 4px 8px rgba(0,0,0,0.1)}
.card img{width:100%;height:120px;object-fit:cover}
.card-body{padding:10px}
.cart{position:fixed;bottom:0;width:100%;background:#fff;padding:10px;box-shadow:0 -2px 8px rgba(0,0,0,0.1)}
.cart input{width:calc(50% - 10px);margin:5px 5px 5px 0;padding:5px}
button{padding:8px;margin:5px;border:none;border-radius:6px;background:#ff6b00;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="header">☕ Hop Tea - ลูกค้า</div>

<div class="tabs">
<div class="tab active" onclick="setCat('tea',this)">ชา</div>
<div class="tab" onclick="setCat('jasmine',this)">ชามะลิ</div>
<div class="tab" onclick="setCat('berry',this)">ชาเบอร์รี่</div>
<div class="tab" onclick="setCat('milk',this)">นม</div>
<div class="tab" onclick="setCat('coffee',this)">กาแฟ</div>
<div class="tab" onclick="setCat('soda',this)">โซดา</div>
<div class="tab" onclick="setCat('other',this)">อื่นๆ</div>
</div>

<div id="menu" class="grid"></div>

<div class="cart">
<div id="cart"></div>
รวม: <span id="total">0</span> บาท
<h4>💳 ชำระเงิน</h4>
<input id="name" placeholder="ชื่อ">
<input id="phone" placeholder="เบอร์">
<button onclick="order()">สั่งเลย</button>
</div>

  "other4":{name:"นมสดบราวน์ชูก้า",price:25,img:"https://images.unsplash.com/photo-1527169402691-a4e7c08c1a2f"}

let cart={}, cat="tea";

function setCat(c,e){cat=c; document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active")); e.classList.add("active"); renderMenu();}
function renderMenu(){let html=""; for(let k in menuData){const m=menuData[k]; if(cat==="tea" && !k.startsWith("tea")) continue; if(cat==="jasmine" && !k.startsWith("jasmine")) continue; if(cat==="berry" && !k.startsWith("berry")) continue; if(cat==="milk" && !k.startsWith("milk")) continue; if(cat==="coffee" && !k.startsWith("coffee")) continue; if(cat==="soda" && !k.startsWith("soda")) continue; if(cat==="other" && !k.startsWith("other")) continue; html+=`<div class="card"><img src="${m.img}"><div class="card-body">${m.name} ${m.price} บาท<br><button onclick="add('${k}')">+</button><button onclick="removeItem('${k}')">-</button> จำนวน: ${cart[k]?.qty||0}</div></div>`;} document.getElementById("menu").innerHTML=html;}
function add(k){if(!cart[k]) cart[k]={qty:0,price:menuData[k].price}; cart[k].qty++; renderCart();}
function removeItem(k){if(cart[k]){cart[k].qty--; if(cart[k].qty<=0) delete cart[k];} renderCart();}
function renderCart(){let t=0,html=""; for(let k in cart){t+=cart[k].price*cart[k].qty; html+=`${menuData[k].name} x${cart[k].qty}<br>`;} document.getElementById("cart").innerHTML=html; document.getElementById("total").innerText=t;}
function order(){push(ref(db,"orders"),{name:document.getElementById("name").value,phone:document.getElementById("phone").value,cart:cart,total:Object.values(cart).reduce((a,c)=>a+c.price*c.qty,0),status:"new",time:new Date().toLocaleString()}); alert("สั่งสำเร็จ"); cart={}; renderMenu(); renderCart();}
renderMenu();
</script>

</html>
