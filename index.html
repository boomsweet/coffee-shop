<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hop Cafe & R'romdee Kitchen</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6f4e37">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6f4e37; --secondary: #fdfaf7; --accent: #e67e22;
            --success: #27ae60; --bg: #f8fafc; --card-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); margin: 0; padding-bottom: 160px; color: #334155; }
        header { 
            background: linear-gradient(135deg, var(--primary), #8d6e63); 
            color: white; padding: 45px 20px; text-align: center; 
            border-radius: 0 0 50px 50px; box-shadow: 0 10px 30px rgba(111, 78, 55, 0.2);
        }
        .container { max-width: 600px; margin: auto; padding: 15px; }
        
        .sticky-tools { position: sticky; top: 10px; z-index: 1000; margin: -35px 15px 25px; display: flex; flex-direction: column; gap: 12px; }
        .search-box input {
            border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-radius: 30px;
            padding: 20px 25px; width: 100%; box-sizing: border-box; font-size: 1.1em; outline: none; transition: 0.3s;
        }
        .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(230, 126, 34, 0.1); }
        
        .mini-cart { 
            background: linear-gradient(90deg, var(--primary), #a1887f); color: white; border-radius: 25px; padding: 14px 22px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 8px 20px rgba(111, 78, 55, 0.3); cursor: pointer; transition: 0.3s;
        }

        .tabs { display: flex; gap: 12px; margin-bottom: 25px; overflow-x: auto; padding: 8px 5px; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            flex: 0 0 auto; padding: 12px 26px; background: white; border-radius: 40px;
            font-weight: 600; cursor: pointer; transition: 0.3s; border: 1px solid #edf2f7; color: #64748b;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 8px 15px rgba(111, 78, 55, 0.25); }
        
        #menu { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .card { background: #fff; border-radius: 28px; box-shadow: var(--card-shadow); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #f1f5f9; transition: 0.3s; }
        .card:active { transform: scale(0.98); }
        .card-content { padding: 18px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; }
        .category-title { grid-column: 1 / -1; font-weight: 700; color: var(--primary); margin: 20px 0 10px; font-size: 1.2em; display: flex; align-items: center; gap: 8px; }
        .category-title::after { content: ""; flex-grow: 1; height: 2px; background: #e2e8f0; border-radius: 2px; }
        .price { color: var(--accent); font-weight: 700; font-size: 1.3em; margin: 10px 0; }
        
        .option-group { background: #f8fafc; padding: 12px; border-radius: 18px; margin-bottom: 12px; text-align: left; border: 1px solid #f1f5f9; }
        .option-group label { font-size: 0.85em; font-weight: 600; color: #64748b; display: block; margin-bottom: 5px; }
        select { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid #cbd5e1; font-family: 'Kanit'; font-size: 0.9em; margin-bottom: 8px; outline: none; background: white; }
        
        .btn-add { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 18px; font-weight: 600; cursor: pointer; width: 100%; margin-top: auto; transition: 0.2s; }
        .btn-add:active { background: #553c2a; }

        .btn-back { width: 100%; padding: 18px; border-radius: 20px; border: none; background: linear-gradient(135deg, var(--accent), #d35400); color: white; font-weight: 700; font-size: 1.1em; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(230, 126, 34, 0.3); cursor: pointer; }

        .page { display: none; }
        .page.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .order-form { background: white; padding: 30px; border-radius: 35px; box-shadow: var(--card-shadow); border: 1px solid #f1f5f9; }
        input, textarea { width: 100%; padding: 16px; margin: 12px 0; border: 1px solid #e2e8f0; border-radius: 18px; box-sizing: border-box; font-family: 'Kanit'; background: #f8fafc; transition: 0.3s; }
        input:focus, textarea:focus { border-color: var(--primary); background: white; outline: none; }
        
        .btn-gps { background: #3b82f6; color: white; border: none; padding: 14px; border-radius: 18px; width: 100%; font-weight: 600; margin-bottom: 15px; cursor: pointer; }

        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 25px 30px; box-shadow: 0 -10px 40px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center; z-index: 1000; border-radius: 40px 40px 0 0; }
        .btn-submit { background: var(--success); color: white; padding: 16px 45px; font-size: 1.15em; font-weight: 700; border-radius: 22px; border: none; cursor: pointer; box-shadow: 0 8px 15px rgba(39, 174, 96, 0.2); }
        
        #statusDisplay { position: fixed; top: 25px; left: 50%; transform: translateX(-50%); z-index: 2000; width: 92%; max-width: 450px; display: none; }
        .status-card { background: white; padding: 18px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); border-left: 10px solid var(--accent); display: flex; align-items: center; gap: 18px; border: 1px solid #f1f5f9; }
    </style>
</head>
<body>

<div id="statusDisplay">
    <div class="status-card" id="statusCard">
        <div style="font-size: 2.2em;" id="statusIcon">⏳</div>
        <div>
            <div style="font-weight: 700; font-size: 1.1em;" id="statusTitle">กำลังรอรับออเดอร์</div>
            <small id="statusDesc" style="color: #64748b;">ร้านค้ากำลังตรวจสอบรายการของคุณ</small>
        </div>
    </div>
</div>

<header>
    <h1 style="margin:0; font-size: 1.8em; letter-spacing: 1px;">☕ Hop Cafe <br><span style="font-size: 0.8em; font-weight: 300;">& 🍛 ครัวอารมณ์ดี</span></h1>
</header>

<div class="container">
    <div id="page-menu" class="page active">
        <div class="sticky-tools">
            <div class="search-box"><input type="text" id="searchInput" placeholder="🔍 ค้นหาเมนูที่คุณชอบ..." oninput="window.filterMenu()"></div>
            <div id="miniCartDisplay" class="mini-cart" style="display: none;" onclick="window.togglePage('checkout')">
                <span>🛒 <b><span id="cartCount">0</span></b> รายการในตะกร้า</span>
                <span style="font-weight: 700;">ดูตะกร้า ></span>
            </div>
        </div>

        <div class="tabs">
            <div class="tab-btn active" id="tab-hop-tea" onclick="window.switchTab('hop-tea')">🥤 ชา Hop</div>
            <div class="tab-btn" id="tab-coffee" onclick="window.switchTab('coffee')">☕ กาแฟสด</div>
            <div class="tab-btn" id="tab-strawberry" onclick="window.switchTab('strawberry')">🍓 สตรอว์เบอร์รี่</div>
            <div class="tab-btn" id="tab-hop-milk" onclick="window.switchTab('hop-milk')">🥛 นม Hop</div>
            <div class="tab-btn" id="tab-food" onclick="window.switchTab('food')">🍛 อาหารตามสั่ง</div>
            <div class="tab-btn" id="tab-snack" onclick="window.switchTab('snack')">🍟 ทานเล่น</div>
            <div class="tab-btn" id="tab-hop-other" onclick="window.switchTab('hop-other')">✨ อื่นๆ/โซดา</div>
        </div>
        <div id="menu"></div>
    </div>

    <div id="page-checkout" class="page">
        <button class="btn-back" onclick="window.togglePage('menu')">✨ กลับไปเลือกเมนูเพิ่ม</button>
        <div class="order-form">
            <h3 style="margin-top:0; color:var(--primary);">📍 ข้อมูลจัดส่ง</h3>
            <input id="userName" type="text" placeholder="ชื่อลูกค้า">
            <input id="userPhone" type="tel" placeholder="เบอร์โทรศัพท์">
            <button class="btn-gps" onclick="window.getLocation()">📍 กดเพื่อปักหมุดที่อยู่ปัจจุบัน</button>
            <textarea id="userAddress" rows="3" placeholder="ระบุบ้านเลขที่/ซอย/จุดสังเกต"></textarea>
            <input id="userGps" type="hidden">
            <div id="gpsStatus" style="font-size:0.9em; color:var(--success); text-align:center; margin-bottom:10px; font-weight:600;"></div>
            <hr style="border:0; border-top:1px solid #edf2f7; margin:20px 0;">
            <h3 style="color:var(--primary);">🛒 สรุปรายการสั่งซื้อ</h3>
            <div id="cartSummary"></div>
        </div>
    </div>
</div>

<div class="bottom-bar">
    <div>
        <small style="color:#64748b; font-weight:600;">ราคารวมทั้งหมด</small>
        <div id="totalDisplay" style="font-size: 1.6em; font-weight: 800; color: var(--primary);">0 บาท</div>
    </div>
    <button id="mainBtn" class="btn-submit" onclick="window.handleMainBtn()">สั่งเลย</button>
</div>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, addDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    let cart = [];
    let currentTab = 'hop-tea';
    let searchQuery = '';

    const menuData = {
        'hop-tea': [
            { cat: "Hop Tea (25.-)", name: "ชาเขียวนม", price: 25 },
            { cat: "Hop Tea (25.-)", name: "โกโก้ชา", price: 25 },
            { cat: "Hop Tea (20.-)", name: "ชาไทย", price: 20 },
            { cat: "Hop Tea (20.-)", name: "ชานมไต้หวัน", price: 20 },
            { cat: "Hop Tea (20.-)", name: "เนสที", price: 20 },
            { cat: "Hop Tea (20.-)", name: "ชามะนาว", price: 20 },
            { cat: "Hop Tea (20.-)", name: "ชาดำ", price: 20 },
            { cat: "Hop Jasmine", name: "ชามะลิ", price: 20 },
            { cat: "Hop Jasmine", name: "มะลิสตรอว์เบอร์รี", price: 20 },
            { cat: "Hop Berry", name: "โกโก้เบอร์รี", price: 25 },
            { cat: "Hop Berry", name: "ชาเบอร์รี", price: 20 }
        ],
        coffee: [
            { cat: "กาแฟสด", name: "เอสเพรสโซ่", price: 30, type: "coffee" },
            { cat: "กาแฟสด", name: "มอคค่า", price: 30, type: "coffee" },
            { cat: "กาแฟสด", name: "ลาเต้", price: 30, type: "coffee" },
            { cat: "กาแฟสด", name: "คาปูชิโน่", price: 30, type: "coffee" },
            { cat: "กาแฟสด", name: "อเมริกาโน่", price: 30, type: "coffee" },
            { cat: "กาแฟสด", name: "อเมริกาโน่ส้ม", price: 30, type: "coffee" }
        ],
        strawberry: [
            { cat: "🍓 นมสดสตรอว์เบอร์รี่", name: "โกโก้นมสดสตรอว์เบอร์รี่", price: 39 },
            { cat: "🍓 นมสดสตรอว์เบอร์รี่", name: "นมสดสตรอว์เบอร์รี่", price: 39 },
            { cat: "🍓 นมสดสตรอว์เบอร์รี่", name: "กาแฟนมสดสตรอว์เบอร์รี่", price: 39 }
        ],
        'hop-milk': [
            { cat: "Hop Milk", name: "โกโก้", price: 25 },
            { cat: "Hop Milk", name: "นมสด", price: 20 },
            { cat: "Hop Milk", name: "นมชมพู", price: 20 },
            { cat: "Hop Milk", name: "โอวัลติน", price: 20 }
        ],
        food: [
            { cat: "กะเพรา", name: "กะเพราไก่", price: 40, type: 'spicy' },
            { cat: "กะเพรา", name: "กะเพราทะเล", price: 50, type: 'spicy' },
            { cat: "กะเพรา", name: "กะเพราเนื้อ", price: 60, type: 'spicy' },
            { cat: "ข้าวผัด", name: "ข้าวผัดไก่", price: 50 },
            { cat: "ข้าวผัด", name: "ข้าวผัดทะเล", price: 50 },
            { cat: "ข้าวผัด", name: "ข้าวผัดต้มยำ", price: 50, type: 'tomyum-rice' },
            { cat: "ต้มยำ/ผัดไทย", name: "ต้มยำกุ้ง", price: 70, type: 'tomyum' },
            { cat: "ต้มยำ/ผัดไทย", name: "มาม่าต้มยำกุ้ง", price: 50, type: 'tomyum' },
            { cat: "ต้มยำ/ผัดไทย", name: "ผัดไทย", price: 50 },
            { cat: "ข้าวกระเทียม", name: "ข้าวไก่กระเทียม", price: 40 },
            { cat: "เพิ่มท็อปปิ้ง", name: "ไข่ดาว", price: 10 },
            { cat: "เพิ่มท็อปปิ้ง", name: "ไข่เจียว", price: 15 }
        ],
        snack: [
            { cat: "ของทานเล่น", name: "ชุดจัมโบ้ 3 สหาย", price: 79 },
            { cat: "ของทานเล่น", name: "ชุดคู่สุขใจ (2 อย่าง)", price: 59, type: 'snack-opt' },
            { cat: "ของทานเล่น", name: "เฟรนช์ฟรายส์ธรรมดา", price: 20 },
            { cat: "ของทานเล่น", name: "เฟรนช์ฟรายส์เขย่า", price: 29, type: 'shake' },
            { cat: "เบอร์เกอร์", name: "เบอร์เกอร์ไก่", price: 35, type: 'burger' }
        ],
        'hop-other': [
            { cat: "Soda (20.-)", name: "แดงโซดา", price: 20 },
            { cat: "Soda (20.-)", name: "น้ำผึ้งมะนาวโซดา", price: 20 },
            { cat: "Signature", name: "ชานมบราวน์ซูการ์", price: 20 },
            { cat: "Signature", name: "ชาพีช", price: 20 }
        ]
    };

    window.togglePage = (p) => {
        document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
        document.getElementById(`page-${p}`).classList.add('active');
        document.getElementById('mainBtn').innerText = (p === 'checkout') ? "ยืนยันออเดอร์" : "สั่งเลย";
        window.scrollTo(0,0);
    };

    window.handleMainBtn = () => {
        if (document.getElementById('page-menu').classList.contains('active')) {
            if (cart.length === 0) return alert("เลือกเมนูก่อนนะครับ Bird!");
            window.togglePage('checkout');
        } else {
            submitOrder();
        }
    };

    window.switchTab = (t) => {
        currentTab = t;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`tab-${t}`).classList.add('active');
        renderMenu();
    };

    window.filterMenu = () => {
        searchQuery = document.getElementById('searchInput').value.toLowerCase();
        renderMenu();
    };

    function renderMenu() {
        const menuDiv = document.getElementById("menu");
        menuDiv.innerHTML = "";
        let lastCat = "";
        const items = menuData[currentTab].filter(i => i.name.toLowerCase().includes(searchQuery));

        items.forEach((m, index) => {
            if (m.cat !== lastCat) {
                const catDiv = document.createElement('div');
                catDiv.className = "category-title";
                catDiv.innerText = m.cat;
                menuDiv.appendChild(catDiv);
                lastCat = m.cat;
            }
            
            let options = "";
            if (currentTab.includes('hop') || currentTab === 'strawberry') {
                options = `<div class="option-group">
                    <label>ระดับความหวาน</label>
                    <select id="opt-${index}"><option value="หวานปกติ">หวานปกติ</option><option value="หวานน้อย">หวานน้อย</option></select>
                    <label style="font-size:0.85em; display:flex; align-items:center; gap:5px;"><input type="checkbox" id="mook-${index}"> 🧋 เพิ่มไข่มุก (+5)</label>
                </div>`;
            } else if (m.type === 'coffee') {
                options = `<div class="option-group">
                    <label>รูปแบบการชง</label>
                    <select id="opt-${index}"><option value="ร้อน (30.-)">☕ ร้อน</option><option value="เย็น (40.-)">🧊 เย็น</option><option value="ปั่น (50.-)">🌪️ ปั่น</option></select>
                </div>`;
            } else if (m.type === 'spicy' || m.type === 'tomyum') {
                options = `<div class="option-group">
                    <label>ระดับความเผ็ด</label>
                    <select id="spicy-${index}"><option value="เผ็ดปกติ">เผ็ดปกติ</option><option value="ไม่เผ็ด">ไม่เผ็ด</option><option value="เผ็ดมาก">เผ็ดมาก 🔥</option></select>
                </div>`;
            } else if (m.type === 'tomyum-rice') {
                options = `<div class="option-group">
                    <label>เลือกเนื้อสัตว์</label>
                    <select id="meat-${index}"><option value="ไก่">ไก่</option><option value="กุ้ง">กุ้ง</option><option value="หมึก">หมึก</option><option value="ทะเล">ทะเล</option></select>
                    <label>ระดับความเผ็ด</label>
                    <select id="spicy-${index}"><option value="เผ็ดปกติ">เผ็ดปกติ</option><option value="ไม่เผ็ด">ไม่เผ็ด</option><option value="เผ็ดมาก">เผ็ดมาก 🔥</option></select>
                </div>`;
            } else if (m.type === 'burger') {
                options = `<div class="option-group">
                    <label><input type="checkbox" id="cheese-${index}"> 🧀 เพิ่มชีส (+15)</label>
                    <label><input type="checkbox" id="egg-${index}"> 🍳 เพิ่มไข่ดาว (+10)</label>
                </div>`;
            }

            const card = document.createElement('div');
            card.className = "card";
            card.innerHTML = `<div class="card-content">
                <b style="font-size:1.05em">${m.name}</b><div class="price">${m.price}.-</div>
                ${options}<button class="btn-add" onclick="window.addToCart(${index})">เพิ่มลงตะกร้า</button>
            </div>`;
            menuDiv.appendChild(card);
        });
    }

    window.addToCart = (idx) => {
        const item = menuData[currentTab][idx];
        let price = item.price, sweet = "", bubble = 0, note = "";
        
        if (currentTab.includes('hop') || currentTab === 'strawberry') {
            sweet = document.getElementById(`opt-${idx}`).value;
            bubble = document.getElementById(`mook-${idx}`).checked ? 5 : 0;
        } else if (item.type === 'coffee') {
            const val = document.getElementById(`opt-${idx}`).value;
            price = val.includes('ร้อน') ? 30 : val.includes('เย็น') ? 40 : 50;
            note = val;
        } else if (item.type === 'tomyum' || item.type === 'spicy') {
            note = document.getElementById(`spicy-${idx}`).value;
        } else if (item.type === 'tomyum-rice') {
            note = `${document.getElementById(`meat-${idx}`).value} / ${document.getElementById(`spicy-${idx}`).value}`;
        } else if (item.type === 'burger') {
            if(document.getElementById(`cheese-${idx}`).checked) { price += 15; note += "ชีส "; }
            if(document.getElementById(`egg-${idx}`).checked) { price += 10; note += "ไข่ดาว "; }
        }

        const cartId = `${item.name}-${sweet}-${bubble}-${note}-${price}`;
        const found = cart.find(x => x.cartId === cartId);
        if (found) found.qty++; else cart.push({ ...item, price, sweet, bubble, note, qty: 1, cartId });
        updateCartUI();
    };

    function updateCartUI() {
        const summary = document.getElementById("cartSummary");
        const totalDisp = document.getElementById("totalDisplay");
        const mini = document.getElementById("miniCartDisplay");
        const count = document.getElementById("cartCount");

        if (cart.length === 0) {
            summary.innerHTML = "<p style='text-align:center; color:#94a3b8; padding:20px;'>ไม่มีรายการในตะกร้า</p>";
            totalDisp.innerText = "0 บาท";
            mini.style.display = "none";
            return;
        }

        mini.style.display = "flex";
        count.innerText = cart.reduce((a, b) => a + b.qty, 0);

        let total = 0; summary.innerHTML = "";
        cart.forEach((c, i) => {
            const sum = (c.price + (c.bubble || 0)) * c.qty;
            total += sum;
            summary.innerHTML += `<div class="cart-item">
                <div><b style="color:var(--primary)">${c.name}</b><br><small style="color:#64748b">${c.sweet} ${c.note}</small></div>
                <div style="display:flex; gap:10px; align-items:center;">
                    <button onclick="window.changeQty(${i}, -1)" style="width:25px; height:25px; border-radius:50%; border:1px solid #cbd5e1; background:white;">-</button>
                    <b>${c.qty}</b>
                    <button onclick="window.changeQty(${i}, 1)" style="width:25px; height:25px; border-radius:50%; border:1px solid #cbd5e1; background:white;">+</button>
                </div>
                <div style="font-weight:700; color:var(--accent)">${sum}.-</div>
            </div>`;
        });
        totalDisp.innerText = total.toLocaleString() + " บาท";
    }

    window.changeQty = (i, d) => {
        cart[i].qty += d;
        if (cart[i].qty <= 0) cart.splice(i, 1);
        updateCartUI();
    };

    window.getLocation = () => {
        const s = document.getElementById('gpsStatus');
        if (!navigator.geolocation) return alert("มือถือไม่รองรับ GPS");
        s.innerText = "กำลังค้นหาพิกัด... 📍";
        navigator.geolocation.getCurrentPosition(p => {
            const lat = p.coords.latitude, lng = p.coords.longitude;
            document.getElementById('userGps').value = `https://www.google.com/maps?q=${lat},${lng}`;
            s.innerText = "✅ ปักหมุดสำเร็จ!";
        }, () => { s.innerText = "❌ ปักหมุดไม่สำเร็จ"; });
    };

    async function submitOrder() {
        const name = document.getElementById("userName").value;
        const phone = document.getElementById("userPhone").value;
        const addr = document.getElementById("userAddress").value;
        const gps = document.getElementById("userGps").value;

        if (!name || !phone || !addr) return alert("กรอกข้อมูลให้ครบก่อนนะครับ");

        try {
            const ref = await addDoc(collection(db, "orders"), {
                name, phone, address: addr, gps, cart,
                status: "new", time: Date.now()
            });
            trackStatus(ref.id);
            alert("สั่งเรียบร้อยแล้วครับ Bird!");
            cart = []; updateCartUI(); window.togglePage('menu');
        } catch (e) { alert("เกิดข้อผิดพลาด: " + e.message); }
    }

    function trackStatus(orderId) {
        const display = document.getElementById("statusDisplay");
        const card = document.getElementById("statusCard");
        const icon = document.getElementById("statusIcon");
        const title = document.getElementById("statusTitle");
        const desc = document.getElementById("statusDesc");

        onSnapshot(doc(db, "orders", orderId), (snap) => {
            if(!snap.exists()) return;
            const s = snap.data().status;
            display.style.display = "block";

            if(s === "new") {
                card.style.borderLeftColor = "#f59e0b";
                icon.innerText = "⏳"; title.innerText = "รอรับออเดอร์"; desc.innerText = "ร้านค้าได้รับรายการของคุณแล้ว";
            } else if(s === "doing") {
                card.style.borderLeftColor = "#3b82f6";
                icon.innerText = "👨‍🍳"; title.innerText = "กำลังปรุงอาหาร"; desc.innerText = "ออเดอร์ของคุณกำลังลงกระทะ!";
            } else if(s === "done") {
                card.style.borderLeftColor = "#22c55e";
                icon.innerText = "✅"; title.innerText = "จัดส่งเรียบร้อย"; desc.innerText = "อิ่มอร่อยกับมื้อนี้นะครับ!";
                setTimeout(() => { display.style.display = "none"; }, 15000);
            }
        });
    }

    renderMenu();
</script>
</body>
</html>
