<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hop Cafe</title>

<style>
body{font-family:sans-serif;background:#f1f5f9;padding:10px}
.card{background:#fff;padding:10px;margin:10px 0;border-radius:12px}
button{padding:10px;margin:5px;border:none;border-radius:10px;background:#0ea5e9;color:#fff}
input{padding:10px;width:100%;margin:5px 0;border-radius:10px}
.cart{background:#fff;padding:10px;margin:5px 0;border-radius:10px}
</style>
</head>

<body>

<h1>☕ Hop Cafe</h1>

<div id="menu"></div>

<h2>🧾 รายการที่สั่ง</h2>
<input id="name" placeholder="ชื่อ">
<input id="phone" placeholder="เบอร์">
<div id="cart"></div>

<button onclick="submitOrder()">ยืนยัน</button>

<script type="module">
import { db, collection, addDoc } from "./firebase.js";

let cart=[];

const menu=[
{name:"เอสเพรสโซ่",price:25},{name:"ลาเต้",price:25},{name:"มอคค่า",price:25},{name:"คาปูชิโน่",price:25},
{name:"โกโก้",price:25},{name:"นมสด",price:20},{name:"นมชมพู",price:20},
{name:"ชาเขียวนม",price:25},{name:"ชาไทย",price:20},{name:"เนสที",price:20},
{name:"แดงโซดา",price:20},{name:"มะนาวโซดา",price:20},
{name:"ชานมบราวน์ซูการ์",price:20}
];

const menuDiv=document.getElementById("menu");
const cartDiv=document.getElementById("cart");

menu.forEach((m,i)=>{
 menuDiv.innerHTML+=`
 <div class="card">
  ${m.name} - ${m.price} บาท
  <br><button onclick="add(${i})">เพิ่ม</button>
 </div>`;
});

window.add=(i)=>{
 const e=cart.find(x=>x.id==i);
 if(e){e.qty++}else{cart.push({...menu[i],id:i,qty:1})}
 render();
}

function render(){
 cartDiv.innerHTML="";
 cart.forEach((c,i)=>{
  cartDiv.innerHTML+=`
  <div class="cart">
   ${c.name} x ${c.qty}
   <br>
   <button onclick="inc(${i})">+</button>
   <button onclick="dec(${i})">-</button>
   <button onclick="del(${i})">ลบ</button>
  </div>`;
 });
}

window.inc=i=>{cart[i].qty++;render()}
window.dec=i=>{cart[i].qty--;if(cart[i].qty<=0)cart.splice(i,1);render()}
window.del=i=>{cart.splice(i,1);render()}

window.submitOrder=async()=>{
 if(cart.length==0)return alert("ยังไม่ได้สั่ง");

 await addDoc(collection(db,"orders"),{
  name:document.getElementById("name").value,
  phone:document.getElementById("phone").value,
  cart,
  status:"new",
  time:Date.now()
 });

 alert("สั่งสำเร็จ");
 cart=[];
 render();
}
</script>

</body>
</html>
