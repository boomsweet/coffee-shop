<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Hop Tea PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b00">
<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5}
.header{background:#ff6b00;color:#fff;padding:15px;font-size:20px;text-align:center}
.install{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999}
.tabs{display:flex;background:#fff}
.tab{flex:1;text-align:center;padding:10px;cursor:pointer}
.active{border-bottom:3px solid #ff6b00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:10px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 4px 8px rgba(0,0,0,0.1)}
.card img{width:100%;height:120px;object-fit:cover}
.card-body{padding:10px}
.cart{position:fixed;bottom:0;width:100%;background:#fff;padding:10px;box-shadow:0 -2px 8px rgba(0,0,0,0.1)}
.cart input{width:calc(50% - 10px);margin:5px 5px 5px 0;padding:5px}
.admin{margin-top:10px;padding:10px;background:#e5e7eb}
.admin-card{background:#fff;border-radius:12px;box-shadow:0 4px 8px rgba(0,0,0,0.1);padding:10px;margin-bottom:10px}
.admin-card h4{margin:0 0 5px;color:#0ea5e9}
.admin-card p{margin:2px 0;font-size:14px}
.admin-card button{margin-top:5px;padding:5px;border:none;border-radius:6px;cursor:pointer}
.done-btn{background:#22c55e;color:white}
.delete-btn{background:#ef4444;color:white}
</style>
</head>
<body>

<div id="installBox" class="install">
<h2>📱 ติดตั้งแอปก่อนใช้งาน</h2>
<p>เพื่อใช้งานเหมือนแอปจริง</p>
<button onclick="installApp()">ติดตั้งแอป</button>
</div>

<div id="app" style="display:none">

<div class="header">☕ Hop Tea PRO</div>

<div class="tabs">
<div class="tab active" onclick="setCat('tea',this)">ชา</div>
<div class="tab" onclick="setCat('coffee',this)">กาแฟ</div>
<div class="tab" onclick="setCat('milk',this)">นม</div>
<div class="tab" onclick="setCat('soda',this)">โซดา</div>
</div>

<div id="menu" class="grid"></div>

<div class="cart">
<div id="cart"></div>
รวม: <span id="total">0</span> บาท
<h4>💳 ชำระเงิน</h4>
<img id="qr" width="180"><br>
<button onclick="genQR()">สร้าง QR</button><br>
<input id="name" placeholder="ชื่อ">
<input id="phone" placeholder="เบอร์">
<button onclick="order()">สั่งเลย</button>
</div>

<div class="admin">
<h3>หลังบ้าน (เจ้าของร้าน)</h3>
<div id="orders"></div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
 apiKey:"AIzaSyCW-ztNX8EAio66VN8ODKo6_z9R8-B99mU",
 databaseURL:"https://coffee-shop-2042e-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db=getDatabase(app);

let cart={},menuData={},cat="tea";

// --- เมนูทั้งหมดพร้อมราคาจริงและรูปตัวอย่างสวย ---
menuData={
 "1":{name:"ชาเขียวนม",price:25,img:"https://source.unsplash.com/300x200/?milk-green-tea"},

 "4":{name:"ชานมไต้หวัน",price:20,img:"https://source.unsplash.com/300x200/?taiwan-milk-tea"},

 "7":{name:"ชาดำ",price:20,img:"https://source.unsplash.com/300x200/?black-tea"},
 "8":{name:"ชาเขียวใส",price:20,img:"https://source.unsplash.com/300x200/?green-tea"},

 "11":{name:"ชามะลิ",price:20,img:"https://source.unsplash.com/300x200/?jasmine-tea"},
 "12":{name:"ชามะลิลิ้นจี่",price:20,img:"https://source.unsplash.com/300x200/?lychee-jasmine-tea"},
 "13":{name:"ชามะลิแอปเปิ้ล",price:20,img:"https://source.unsplash.com/300x200/?apple-jasmine-tea"},
 "14":{name:"ชามะลิสตรอว์เบอร์รี่",price:20,img:"https://source.unsplash.com/300x200/?strawberry-jasmine-tea"},
 "15":{name:"ชามะลิเก๊กฮวย",price:20,img:"https://source.unsplash.com/300x200/?honey-jasmine-tea"},
 "16":{name:"ชามะลินม",price:20,img:"https://source.unsplash.com/300x200/?milk-jasmine-tea"},
 "17":{name:"ชาเบอร์รี่",price:20,img:"https://source.unsplash.com/300x200/?berry-tea"},
 "18":{name:"ชาเบอร์รี่มะนาว",price:20,img:"https://source.unsplash.com/300x200/?lemon-berry-tea"},
 "19":{name:"ชาเบอร์รี่น้ำผึ้ง",price:20,img:"https://source.unsplash.com/300x200/?honey-berry-tea"},
 "20":{name:"ชาเบอร์รี่โกโก้",price:25,img:"https://source.unsplash.com/300x200/?cocoa-berry-tea"},
 "21":{name:"นมสด",price:20,img:"https://source.unsplash.com/300x200/?milk"},
 "22":{name:"นมชมพู",price:20,img:"https://source.unsplash.com/300x200/?pink-milk"},
 "23":{name:"โกโก้",price:25,img:"https://source.unsplash.com/300x200/?cocoa"},
 "24":{name:"โอวัลติน",price:20,img:"https://source.unsplash.com/300x200/?ovaltine"},
 "25":{name:"นมเผือก",price:20,img:"https://source.unsplash.com/300x200/?taro-milk"},
 "26":{name:"นมแคนตาลูป",price:20,img:"https://source.unsplash.com/300x200/?cantaloupe-milk"},
 "27":{name:"สตรอว์เบอร์รี่นมสด",price:20,img:"https://source.unsplash.com/300x200/?strawberry-milk"},
 "28":{name:"เอสเปรสโซ่",price:25,img:"https://source.unsplash.com/300x200/?espresso"},

 "31":{name:"คาปูชิโน่",price:25,img:"https://source.unsplash.com/300x200/?cappuccino"},
 "32":{name:"แดงโซดา",price:20,img:"https://source.unsplash.com/300x200/?red-soda"},

 "36":{name:"เสาวรสโซดา",price:20,img:"https://source.unsplash.com/300x200/?passion-soda"},
 "37":{name:"บลูฮาวายโซดา",price:20,img:"https://source.unsplash.com/300x200/?bluehawaii-soda"},
 "38":{name:"องุ่นโซดา",price:20,img:"https://source.unsplash.com/300x200/?grape-soda"},
 "39":{name:"ลิ้นจี่โซดา",price:20,img:"https://source.unsplash.com/300x200/?lychee-soda"},
 "40":{name:"แคนตาลูปโซดา",price:20,img:"https://source.unsplash.com/300x200/?cantaloupe-soda"},
 "41":{name:"สตรอว์เบอร์รี่โซดา",price:20,img:"https://source.unsplash.com/300x200/?strawberry-soda"},
 "42":{name:"มะม่วงโซดา",price:20,img:"https://source.unsplash.com/300x200/?mango-soda"},
 "43":{name:"กีวี่โซดา",price:20,img:"https://source.unsplash.com/300x200/?kiwi-soda"},
 "44":{name:"แอปเปิ้ลโซดา",price:20,img:"https://source.unsplash.com/300x200/?apple-soda"},
 "45":{name:"Hop Peach Tea",price:20,img:"https://source.unsplash.com/300x200/?peach-tea"},
 "46":{name:"ชานมไต้หวัน บราวน์ชูก้า",price:20,img:"https://source.unsplash.com/300x200/?milk-tea-brown-sugar"},
 "47":{name:"ชาเขียว บราวน์ชูก้า",price:20,img:"https://source.unsplash.com/300x200/?green-tea-brown-sugar"},
 "48":{name:"นมสด บราวน์ชูก้า",price:20,img:"https://source.unsplash.com/300x200/?milk-brown-sugar"}
};

function getCat(n){
 if(n.includes("ชา")||n.includes("Tea")) return "tea";
 if(n.includes("เอสเปรสโซ่")||n.includes("ลาเต้")||n.includes("มอคค่า")||n.includes("คาปูชิโน่")) return "coffee";
 if(n.includes("นม")||n.includes("Milk")) return "milk";
 if(n.includes("โซดา")||n.includes("Soda")) return "soda";
 return "tea";
}

window.setCat=(c,e)=>{
 cat=c;
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 e.classList.add("active");
 renderMenu();
}

function renderMenu(){
 let html="";
 for(let k in menuData){
  let m=menuData[k];
  if(getCat(m.name)!=cat) continue;
  html+=`
  <div class="card">
  <img src="${m.img}">
  <div class="card-body">
    ${m.name}<br>${m.price} บาท<br>
    <select onchange="sweet('${k}',this.value)">
      <option>ปกติ</option><option>หวานน้อย</option><option>ไม่หวาน</option>
    </select>
    <br>
    <label><input type="checkbox" onchange="pearl('${k}',this.checked)"> ไข่มุก +5</label>
    <br>
    <button onclick="add('${k}',${m.price})">+</button>
    <button onclick="removeItem('${k}')">-</button>
    จำนวน: ${cart[k]?.qty||0}
  </div></div>`;
 }
 menu.innerHTML=html;
}

window.sweet=(k,v)=>{ if(!cart[k]) cart[k]={qty:0,price:0}; cart[k].sweet=v; }
window.pearl=(k,v)=>{ if(!cart[k]) cart[k]={qty:0,price:0}; cart[k].pearl=v; }

window.add=(k,p)=>{
 if(!cart[k]) cart[k]={qty:0,price:p};
 cart[k].qty++;
 renderCart();
}

window.removeItem=(k)=>{
 if(cart[k]){
  cart[k].qty--;
  if(cart[k].qty<=0) delete cart[k];
 }
 renderCart();
}

const cartDiv=document.getElementById("cart");
const totalDiv=document.getElementById("total");

function renderCart(){
 let t=0,html="";
 for(let k in cart){
  const c=cart[k];
  let price=c.price+(c.pearl?5:0);
  t+=price*c.qty;
  html+=`${menuData[k].name} x${c.qty}<br>`;
 }
 cartDiv.innerHTML=html;
 totalDiv.innerText=t;
}

window.genQR=()=>{
 let phone="0812345678";
 document.getElementById("qr").src=`https://promptpay.io/${phone}/${totalDiv.innerText}`;
}

window.order=()=>{
 push(ref(db,"orders"),{
  name:document.getElementById("name").value,
  phone:document.getElementById("phone").value,
  cart:cart,
  total:totalDiv.innerText,
  status:"new",
  time:new Date().toLocaleString()
 });
 alert("สั่งสำเร็จ");
 cart={}; renderCart();
}

// หลังบ้าน
const ordersDiv=document.getElementById("orders");
onValue(ref(db,"orders"),snapshot=>{
 let data=snapshot.val()||{};
 let html="";
 for(let k in data){
  const o=data[k];
  html+=`
  <div class="admin-card">
    <h4>${o.name} (${o.phone})</h4>
    <p>${Object.keys(o.cart).map(i=>menuData[i].name+' x'+o.cart[i].qty).join(", ")}</p>
    <p><small>${o.time} | สถานะ: ${o.status}</small></p>
    <div>
      <button class="done-btn" onclick="markDone('${k}')">เสร็จแล้ว</button>
      <button class="delete-btn" onclick="deleteOrder('${k}')">ลบ</button>
    </div>
  </div>`;
 }
 ordersDiv.innerHTML=html;
});

window.markDone=(k)=>{ update(ref(db,"orders/"+k),{status:"เสร็จแล้ว"}); }
window.deleteOrder=(k)=>{ remove(ref(db,"orders/"+k)); }

// PWA
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
window.installApp=async ()=>{
 if(deferredPrompt){ deferredPrompt.prompt(); const { outcome }=await deferredPrompt.userChoice; if(outcome==='accepted'){installBox.style.display="none";app.style.display="block";}}
 else{alert("กรุณากด เพิ่มไปหน้าจอหลัก จากเมนูมือถือ");}
}
if(window.matchMedia('(display-mode: standalone)').matches){ installBox.style.display="none"; app.style.display="block"; }
</script>

<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>

</body>
</html>
