<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hop Tea</title>

<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#f5f5f5; }
.menu-card { border-radius:15px; overflow:hidden; }
.cart-bar { position:fixed; bottom:10px; left:10px; right:10px; background:#000; color:#fff; padding:10px; border-radius:20px; display:flex; justify-content:space-between;}
</style>
</head>

<body>
<h1 class="text-center text-2xl font-bold p-4">Hop Tea</h1>

<div id="menu-grid" class="grid grid-cols-2 gap-4 p-4"></div>

<!-- 🛒 ตะกร้า -->
<div id="cart-bar" class="cart-bar hidden" onclick="openCart()">
  <span>🛒 <span id="cart-count">0</span></span>
  <span>฿<span id="cart-total">0</span></span>
</div>

<!-- 📦 Modal ตะกร้า -->
<div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-end">
  <div class="bg-white w-full p-4 rounded-t-2xl max-h-[80%] overflow-auto">
    <h2 class="text-xl font-bold mb-2">ตะกร้าของคุณ</h2>
    <div id="cart-items"></div>

    <div class="mt-4 font-bold">
      รวม: ฿<span id="modal-total">0</span>
    </div>

    <button onclick="confirmOrder()" class="bg-green-500 text-white w-full p-2 mt-2 rounded">
      ยืนยันออเดอร์
    </button>
    <button onclick="closeCart()" class="w-full mt-2">
      ปิด
    </button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
 apiKey: "AIzaSyCW-ztNX8EAio66VN8ODKo6_z9R8-B99mU",
 databaseURL:"https://coffee-shop-2042e-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ===== MENU =====
let menu = JSON.parse(localStorage.getItem("menu") || "[]");

onValue(ref(db,"menu"), snap=>{
  if(snap.val()){
    menu = Object.values(snap.val());
    localStorage.setItem("menu", JSON.stringify(menu));
    renderMenu();
  }
});

function renderMenu(){
  const grid = document.getElementById("menu-grid");
  grid.innerHTML = menu.map(m=>`
  <div class="menu-card bg-white p-2 shadow">
    <img src="${m.img}" class="w-full h-24 object-cover">
    <div>${m.name}</div>
    <div class="text-yellow-600">฿${m.price}</div>
    <div class="flex gap-2 mt-2">
      <button onclick="add(${m.id})" class="bg-green-500 text-white px-2">+</button>
      <button onclick="remove(${m.id})" class="bg-red-500 text-white px-2">-</button>
    </div>
  </div>
  `).join("");
}

let cart = [];

window.add = (id)=>{
  const item = menu.find(x=>x.id===id);
  const ex = cart.find(c=>c.id===id);
  if(ex) ex.qty++; else cart.push({...item, qty:1});
  updateCart();
}

window.remove = (id)=>{
  const ex = cart.find(c=>c.id===id);
  if(!ex) return;
  ex.qty--;
  if(ex.qty<=0) cart = cart.filter(c=>c.id!==id);
  updateCart();
}

function updateCart(){
  const count = cart.reduce((s,i)=>s+i.qty,0);
  const total = cart.reduce((s,i)=>s+i.qty*i.price,0);
  document.getElementById("cart-count").innerText = count;
  document.getElementById("cart-total").innerText = total;
  document.getElementById("cart-bar").classList.toggle("hidden", count===0);
}

// ===== เปิดตะกร้า =====
window.openCart = ()=>{
  document.getElementById("cart-modal").classList.remove("hidden");
  renderCart();
}

window.closeCart = ()=>{
  document.getElementById("cart-modal").classList.add("hidden");
}

function renderCart(){
  const div = document.getElementById("cart-items");
  div.innerHTML = cart.map(i=>`
    <div class="flex justify-between mb-2">
      <div>${i.name} x${i.qty}</div>
      <div>
        <button onclick="add(${i.id})">+</button>
        <button onclick="remove(${i.id})">-</button>
      </div>
    </div>
  `).join("");

  document.getElementById("modal-total").innerText =
    cart.reduce((s,i)=>s+i.qty*i.price,0);
}

// ===== ส่งออเดอร์ =====
window.confirmOrder = ()=>{
  push(ref(db,"orders"),{
    items: cart,
    total: cart.reduce((s,i)=>s+i.qty*i.price,0),
    status:"pending",
    time:new Date().toLocaleString()
  });
  alert("สั่งสำเร็จ!");
  cart=[];
  updateCart();
  closeCart();
}

// 📱 PWA
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}

// 🔥 ปุ่มติดตั้ง
let deferredPrompt;
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredPrompt = e;

  const btn = document.createElement("button");
  btn.innerText="ติดตั้งแอป";
  btn.className="fixed top-2 right-2 bg-green-500 text-white px-3 py-1 rounded";

  btn.onclick=()=>deferredPrompt.prompt();
  document.body.appendChild(btn);
});

renderMenu();
</script>
</body>
</html>
