<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HOP Chafe - เลือกโหมดการใช้งาน</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
        body { font-family: 'Kanit', sans-serif; }
        .card-shadow { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-6 text-center">
    
    <div class="mb-10 scale-110">
        <div class="bg-black text-white w-20 h-20 rounded-[25px] flex items-center justify-center mx-auto mb-4 shadow-2xl">
            <i class="fas fa-mug-hot text-3xl"></i>
        </div>
        <h1 class="text-3xl font-bold tracking-tight text-gray-900">HOP CHAFE</h1>
        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-[0.3em] mt-1">Digital Coffee Solutions</p>
    </div>

    <div class="grid grid-cols-1 gap-6 w-full max-w-sm">
        
        <!-- ฝั่งลูกค้า -->
        <a href="home.html" class="bg-white p-8 rounded-[35px] card-shadow border border-gray-100 flex flex-col items-center group active:scale-95 transition-all">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-2xl mb-4 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                <i class="fas fa-user-tag"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800">สำหรับลูกค้า</h2>
            <p class="text-xs text-gray-400 mt-1">สแกนดูเมนูและสั่งเครื่องดื่ม</p>
            <div class="mt-4 bg-black text-white text-[10px] font-bold px-4 py-1.5 rounded-full uppercase">เข้าหน้าสั่งอาหาร</div>
        </a>

        <!-- ฝั่งเจ้าของร้าน -->
        <a href="pos.html" class="bg-yellow-400 p-8 rounded-[35px] card-shadow border border-yellow-500 flex flex-col items-center group active:scale-95 transition-all">
            <div class="w-16 h-16 bg-black text-white rounded-2xl flex items-center justify-center text-2xl mb-4">
                <i class="fas fa-store-alt"></i>
            </div>
            <h2 class="text-xl font-bold text-black">สำหรับเจ้าของร้าน</h2>
            <p class="text-xs text-black/60 mt-1 font-medium">จัดการออเดอร์และแก้ไขเมนู</p>
            <div class="mt-4 bg-white text-black text-[10px] font-bold px-4 py-1.5 rounded-full uppercase shadow-sm">เข้าระบบ POS</div>
        </a>

    </div>

    <p class="mt-12 text-[10px] text-gray-300 font-bold tracking-widest uppercase">Version 3.0 • Offline Ready</p>

    <script>
        // ลงทะเบียน Service Worker เพื่อให้ติดตั้งเป็นแอปได้
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Registered'))
                    .catch(err => console.log('Service Worker Failed', err));
            });
        }
    </script>
</body>
</html>
