<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Hop Tea PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b00">
<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5}
.header{background:#ff6b00;color:#fff;padding:15px;font-size:20px;text-align:center}
button{padding:8px;margin:5px;border:none;border-radius:6px;background:#ff6b00;color:#fff;cursor:pointer}
.tabs{display:flex;background:#fff;margin-top:10px}
.tab{flex:1;text-align:center;padding:10px;cursor:pointer}
.active{border-bottom:3px solid #ff6b00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:10px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 4px 8px rgba(0,0,0,0.1)}
.card img{width:100%;height:120px;object-fit:cover}
.card-body{padding:10px}
.cart{position:fixed;bottom:0;width:100%;background:#fff;padding:10px;box-shadow:0 -2px 8px rgba(0,0,0,0.1)}
.cart input{width:calc(50% - 10px);margin:5px 5px 5px 0;padding:5px}
.admin{margin-top:10px;padding:10px;background:#e5e7eb}
.admin-card{background:#fff;border-radius:12px;box-shadow:0 4px 8px rgba(0,0,0,0.1);padding:10px;margin-bottom:10px}
.admin-card h4{margin:0 0 5px;color:#0ea5e9}
.admin-card p{margin:2px 0;font-size:14px}
.admin-card button{margin-top:5px;padding:5px;border:none;border-radius:6px;cursor:pointer}
.done-btn{background:#22c55e;color:white}
.delete-btn{background:#ef4444;color:white}
</style>
</head>
<body>

<div id="home">
<h1 style="text-align:center;">☕ Hop Tea PRO</h1>
<div style="text-align:center;margin-top:20px">
<button onclick="showCustomer()">สั่งเครื่องดื่ม</button>
<button onclick="showAdmin()">เจ้าของร้าน</button>
</div>
</div>

<div id="customer" style="display:none">
<div class="header">☕ เมนูเครื่องดื่ม</div>
<div class="tabs">
<div class="tab active" onclick="setCat('tea',this)">ชา</div>
<div class="tab" onclick="setCat('coffee',this)">กาแฟ</div>
<div class="tab" onclick="setCat('milk',this)">นม</div>
<div class="tab" onclick="setCat('soda',this)">โซดา</div>
</div>
<div id="menu" class="grid"></div>
<div class="cart">
<div id="cart"></div>
รวม: <span id="total">0</span> บาท
<h4>💳 ชำระเงิน</h4>
<img id="qr" width="180"><br>
<input id="name" placeholder="ชื่อ">
<input id="phone" placeholder="เบอร์">
<button onclick="order()">สั่งเลย</button>
<button onclick="backHome()">กลับ</button>
</div>
</div>

<div id="admin" style="display:none">
<h3>📺 ออเดอร์</h3>
<div id="orders"></div>
<h3>📊 ยอดขาย: <span id="sum">0</span></h3>
<button onclick="backHome()">กลับ</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
 apiKey:"AIzaSyCW-ztNX8EAio66VN8ODKo6_z9R8-B99mU",
 databaseURL:"https://coffee-shop-2042e-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db=getDatabase(app);

// --- เมนู PRO ---
const menuData={
 "1":{name:"ชาเขียวนม",price:25,img:"https://source.unsplash.com/300x200/?milk-green-tea"},
 "2":{name:"ชานมโกโก้",price:25,img:"https://source.unsplash.com/300x200/?cocoa-tea"},
 "3":{name:"ชาไทย",price:20,img:"https://source.unsplash.com/300x200/?thai-tea"},
 "4":{name:"ชานมไต้หวัน",price:20,img:"https://source.unsplash.com/300x200/?taiwan-milk-tea"},
 "5":{name:"ชานมเนสที",price:20,img:"https://source.unsplash.com/300x200/?nestea"},
 "6":{name:"ชามะนาว",price:20,img:"https://source.unsplash.com/300x200/?lemon-tea"},
 "7":{name:"ชาดำ",price:20,img:"https://source.unsplash.com/300x200/?black-tea"},
 "8":{name:"ชาเขียวใส",price:20,img:"https://source.unsplash.com/300x200/?green-tea"},
 "9":{name:"ชาเขียวมะนาว",price:20,img:"https://source.unsplash.com/300x200/?lemon-green-tea"},
 "10":{name:"ชาเขียวน้ำผึ้งมะนาว",price:20,img:"https://source.unsplash.com/300x200/?honey-lemon-green-tea"},
 "28":{name:"เอสเปรสโซ่",price:25,img:"https://source.unsplash.com/300x200/?espresso"},
 "29":{name:"ลาเต้",price:25,img:"https://source.unsplash.com/300x200/?latte"},
 "30":{name:"มอคค่า",price:25,img:"https://source.unsplash.com/300x200/?mocha"},
 "31":{name:"คาปูชิโน่",price:25,img:"https://source.unsplash.com/300x200/?cappuccino"},
 "21":{name:"นมสด",price:20,img:"https://source.unsplash.com/300x200/?milk"},
 "22":{name:"นมชมพู",price:20,img:"https://source.unsplash.com/300x200/?pink-milk"},
 "23":{name:"โกโก้",price:25,img:"https://source.unsplash.com/300x200/?cocoa"},
 "24":{name:"โอวัลติน",price:20,img:"https://source.unsplash.com/300x200/?ovaltine"},
 "32":{name:"แดงโซดา",price:20,img:"https://source.unsplash.com/300x200/?red-soda"},
 "33":{name:"เขียวโซดา",price:20,img:"https://source.unsplash.com/300x200/?green-soda"}
};

let cart={},cat="tea";

function setCat(c,e){cat=c;document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active")); e.classList.add("active"); renderMenu();}
function renderMenu(){let html="";for(let k in menuData){let m=menuData[k];if((m.name.includes("ชา")||m.name.includes("Tea"))&&cat!="tea")continue;if((m.name.includes("เอสเปรสโซ่")||m.name.includes("ลาเต้")||m.name.includes("มอคค่า")||m.name.includes("คาปูชิโน่"))&&cat!="coffee")continue;if((m.name.includes("นม")||m.name.includes("Milk"))&&cat!="milk")continue;if((m.name.includes("โซดา")||m.name.includes("Soda"))&&cat!="soda")continue;html+=`<div class="card"><img src="${m.img}"><div class="card-body">${m.name}<br>${m.price} บาท<br><button onclick="add('${k}',${m.price})">+</button> <button onclick="removeItem('${k}')">-</button> จำนวน: ${cart[k]?.qty||0}</div></div>`;}menu.innerHTML=html;}
function add(k,p){if(!cart[k])cart[k]={qty:0,price:p}; cart[k].qty++; renderCart();}
function removeItem(k){if(cart[k]){cart[k].qty--; if(cart[k].qty<=0)delete cart[k];} renderCart();}
const cartDiv=document.getElementById("cart");
const totalDiv=document.getElementById("total");
function renderCart(){let t=0,html="";for(let k in cart){const c=cart[k];t+=c.price*c.qty;html+=`${menuData[k].name} x${c.qty}<br>`;}cartDiv.innerHTML=html; totalDiv.innerText=t;}
function order(){push(ref(db,"orders"),{name:name.value,phone:phone.value,cart:cart,total:totalDiv.innerText,status:"new",time:new Date().toLocaleString()});alert("สั่งสำเร็จ"); cart={}; renderCart();}

const ordersDiv=document.getElementById("orders");
onValue(ref(db,"orders"),s=>{let data=s.val()||{},html="",sum=0; for(let k in data){const o=data[k];let list=""; for(let i in o.cart){let c=o.cart[i]; list+=`${menuData[i].name} x${c.qty}<br>`;} if(o.status==="paid")sum+=parseInt(o.total||0); html+=`<div class="admin-card"><h4>${o.name} (${o.phone})</h4><p>${list}</p><p><small>${o.time} | สถานะ: ${o.status}</small></p><div><button class="done-btn" onclick="markDone('${k}')">เสร็จแล้ว</button> <button class="delete-btn" onclick="deleteOrder('${k}')">ลบ</button></div></div>`;} ordersDiv.innerHTML=html; document.getElementById("sum").innerText=sum;});
function markDone(k){update(ref(db,"orders/"+k),{status:"เสร็จแล้ว"});}
function deleteOrder(k){remove(ref(db,"orders/"+k));}

function showCustomer(){home.style.display="none"; customer.style.display="block"; renderMenu();}
function showAdmin(){let p=prompt("รหัสเจ้าของร้าน:"); if(p==="0000"){home.style.display="none"; admin.style.display="block";} else alert("รหัสไม่ถูกต้อง");}
function backHome(){customer.style.display="none"; admin.style.display="none"; home.style.display="block";}
</script>
</body>
</html>
