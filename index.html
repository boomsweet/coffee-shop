<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ลูกค้า</title>
<style>
body{background:#111;color:#fff;font-family:sans-serif;padding:10px}
.menu{background:#222;padding:10px;margin:5px;border-radius:10px}
button{margin:2px}
</style>
</head>

<body>

<h2>👥 ลูกค้า</h2>

<div id="menu"></div>

<h3>🧾 รายการที่สั่ง</h3>
<div id="cart"></div>
รวม: <span id="total">0</span> บาท

<br><br>
<input id="name" placeholder="ชื่อ">
<input id="phone" placeholder="เบอร์">

<button onclick="order()">สั่งเลย</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCW-ztNX8EAio66VN8ODKo6_z9R8-B99mU",
  authDomain: "coffee-shop-2042e.firebaseapp.com",
  databaseURL: "https://coffee-shop-2042e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "coffee-shop-2042e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let cart = {};

onValue(ref(db,"menu"), snap=>{
  let data = snap.val()||{};
  let html="";
  for(let k in data){
    html+=`
    <div class="menu">
      ${data[k].name} (${data[k].price})
      <br>
      <button onclick="add('${k}',${data[k].price})">+</button>
      <button onclick="removeItem('${k}')">-</button>
    </div>`;
  }
  menu.innerHTML=html;
});

window.add=(k,p)=>{
  if(!cart[k]) cart[k]={qty:0,price:p};
  cart[k].qty++;
  render();
}

window.removeItem=(k)=>{
  if(cart[k]){
    cart[k].qty--;
    if(cart[k].qty<=0) delete cart[k];
  }
  render();
}

function render(){
  let html="",total=0;
  for(let k in cart){
    html+=`${k} x ${cart[k].qty}<br>`;
    total+=cart[k].qty*cart[k].price;
  }
  cartDiv.innerHTML=html;
  totalDiv.innerText=total;
}

const cartDiv=document.getElementById("cart");
const totalDiv=document.getElementById("total");

window.order=()=>{
  push(ref(db,"orders"),{
    name:name.value,
    phone:phone.value,
    cart:cart,
    total:totalDiv.innerText,
    time:new Date().toLocaleString()
  });
  alert("สั่งสำเร็จ");
}
</script>

</body>
</html>
