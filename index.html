<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HOP CHAFE - Digital Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
        body { font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .category-btn.active { background: #000; color: #fff; border-color: #000; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .menu-item-card { transition: all 0.2s ease; cursor: pointer; }
        .menu-item-card:active { transform: scale(0.95); }
        .logo-box { background: #000; color: #fff; border-radius: 22px; padding: 12px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- 1. หน้าเข้าแอป (Welcome) -->
    <div id="view-home" class="view min-h-screen flex flex-col items-center justify-center p-6 bg-white">
        <div class="mb-12 text-center">
            <!-- LOGO SECTION -->
            <div class="logo-box inline-block mb-4 shadow-2xl">
                <i class="fas fa-mug-hot text-4xl"></i>
            </div>
            <h1 class="text-4xl font-bold italic tracking-tighter">HOP <span class="text-yellow-500">CHAFE</span></h1>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-[0.3em] mt-2">Good morning starts with hop</p>
        </div>

        <div class="w-full max-w-xs space-y-4">
            <button onclick="switchView('customer')" class="w-full bg-gray-50 p-6 rounded-[30px] border border-gray-100 shadow-sm flex flex-col items-center active:bg-gray-100">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl mb-3">
                    <i class="fas fa-shopping-cart"></i>
                </div>
                <span class="font-bold text-lg">สำหรับลูกค้า</span>
                <span class="text-xs text-gray-400">สั่งเครื่องดื่มฟรีไข่มุก</span>
            </button>

            <button onclick="openLogin()" class="w-full bg-yellow-400 p-6 rounded-[30px] shadow-lg flex flex-col items-center active:scale-95 transition-all">
                <div class="w-12 h-12 bg-black text-white rounded-2xl flex items-center justify-center text-xl mb-3">
                    <i class="fas fa-user-shield"></i>
                </div>
                <span class="font-bold text-lg">สำหรับเจ้าของร้าน</span>
                <span class="text-xs text-black/60 font-bold">จัดการออเดอร์ (รหัส: 0000)</span>
            </button>
        </div>
    </div>

    <!-- 2. หน้าลูกค้า (Customer) -->
    <div id="view-customer" class="view hidden min-h-screen flex flex-col">
        <header class="bg-white p-5 flex justify-between items-center sticky top-0 z-50 shadow-sm">
            <button onclick="switchView('home')" class="text-gray-400 p-2"><i class="fas fa-arrow-left"></i></button>
            <div class="flex items-center gap-2">
                <div class="bg-black text-white p-1.5 rounded-lg text-xs"><i class="fas fa-mug-hot"></i></div>
                <h2 class="font-bold italic text-xl tracking-tighter">HOP CHAFE</h2>
            </div>
            <div class="bg-black text-white px-3 py-1 rounded-full text-[10px] font-bold">20.- ทุกเมนู</div>
        </header>

        <!-- หมวดหมู่เมนู -->
        <div class="flex overflow-x-auto gap-2 p-4 bg-white sticky top-[68px] z-40 hide-scroll border-b">
            <button onclick="filterMenu('All', this)" class="category-btn active px-5 py-2 rounded-full border border-gray-200 text-sm font-bold whitespace-nowrap">ทั้งหมด</button>
            <button onclick="filterMenu('Hop Tea', this)" class="category-btn px-5 py-2 rounded-full border border-gray-200 text-sm font-bold whitespace-nowrap text-gray-400">Hop Tea</button>
            <button onclick="filterMenu('Hop Jasmine', this)" class="category-btn px-5 py-2 rounded-full border border-gray-200 text-sm font-bold whitespace-nowrap text-gray-400">Jasmine</button>
            <button onclick="filterMenu('Hop Milk', this)" class="category-btn px-5 py-2 rounded-full border border-gray-200 text-sm font-bold whitespace-nowrap text-gray-400">Milk</button>
            <button onclick="filterMenu('Hop Coffee', this)" class="category-btn px-5 py-2 rounded-full border border-gray-200 text-sm font-bold whitespace-nowrap text-gray-400">Coffee</button>
            <button onclick="filterMenu('Hop Soda', this)" class="category-btn px-5 py-2 rounded-full border border-gray-200 text-sm font-bold whitespace-nowrap text-gray-400">Soda</button>
        </div>

        <main class="p-4 grid grid-cols-2 gap-4 flex-grow pb-32" id="customer-grid">
            <!-- เมนูจะโหลดตรงนี้ -->
        </main>

        <!-- แถบตะกร้าลอย -->
        <div id="cart-bar" class="fixed bottom-6 left-6 right-6 bg-black text-white p-5 rounded-[28px] shadow-2xl flex justify-between items-center hidden z-50 transition-all" onclick="showCart()">
            <div class="flex items-center gap-4">
                <div id="cart-count" class="bg-yellow-400 text-black w-8 h-8 rounded-xl flex items-center justify-center font-bold">0</div>
                <span class="font-bold text-lg">รายการสั่งซื้อของคุณ</span>
            </div>
            <span id="cart-total" class="text-2xl font-bold text-yellow-400">฿0</span>
        </div>
    </div>

    <!-- 3. หน้าเจ้าของร้าน (Owner) -->
    <div id="view-owner" class="view hidden min-h-screen bg-gray-100">
        <nav class="bg-black text-white p-5 flex justify-between items-center sticky top-0 z-50">
            <button onclick="switchView('home')" class="text-red-400"><i class="fas fa-power-off"></i> ออก</button>
            <h2 class="font-bold text-sm tracking-widest uppercase">ระบบจัดการออเดอร์</h2>
            <div class="w-8"></div>
        </nav>
        <div class="p-4 space-y-4" id="order-container">
            <!-- รายการออเดอร์ -->
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-center justify-center p-6 backdrop-blur-md">
        <div class="bg-white w-full max-w-xs rounded-[40px] p-10 text-center shadow-2xl">
            <h3 class="text-xl font-bold mb-6">รหัสเจ้าของร้าน</h3>
            <input type="password" id="pin-input" maxlength="4" placeholder="••••" class="w-full text-center text-5xl tracking-[0.4em] bg-gray-50 p-5 rounded-3xl outline-none mb-8 focus:ring-2 ring-yellow-400">
            <div class="flex gap-4">
                <button onclick="closeModal('login-modal')" class="flex-1 font-bold text-gray-400">ยกเลิก</button>
                <button onclick="doLogin()" class="flex-1 bg-black text-white py-4 rounded-2xl font-bold shadow-lg">ยืนยัน</button>
            </div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black/60 z-[90] hidden flex items-end">
        <div class="bg-white w-full rounded-t-[45px] p-8 max-h-[80vh] flex flex-col shadow-2xl">
            <div class="w-12 h-1 bg-gray-200 rounded-full mx-auto mb-6"></div>
            <h3 class="text-2xl font-bold mb-6 italic tracking-tighter">สรุปรายการสั่งซื้อ</h3>
            <div id="cart-list" class="flex-grow overflow-y-auto space-y-4 mb-6"></div>
            <div class="border-t pt-6">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-gray-400 font-bold uppercase text-xs tracking-widest">ยอดรวมทั้งหมด</span>
                    <span id="modal-total" class="text-4xl font-bold tracking-tighter">฿0</span>
                </div>
                <button onclick="submitOrder()" class="w-full bg-black text-white py-5 rounded-[25px] font-bold text-xl shadow-xl active:scale-95 transition">ส่งคำสั่งซื้อ</button>
                <button onclick="closeModal('cart-modal')" class="w-full mt-4 text-gray-400 text-sm font-bold">เพิ่มรายการอื่นอีก</button>
            </div>
        </div>
    </div>

    <script>
        // ข้อมูลเมนูตามใบปลิว
        const menu = [
            { id: 1, name: 'ชาเขียว (Milk Green Tea)', price: 20, cat: 'Hop Tea', img: 'https://images.unsplash.com/photo-1571935445874-6629d16886aa?w=300' },
            { id: 2, name: 'โกโก้ (Cocoa Tea)', price: 25, cat: 'Hop Tea', img: 'https://images.unsplash.com/photo-1541167760496-162955ed8a9f?w=300' },
            { id: 3, name: 'ชาไทย (Thai Tea)', price: 20, cat: 'Hop Tea', img: 'https://images.unsplash.com/photo-1594631252845-29fc4586d51c?w=300' },
            { id: 4, name: 'นมชมพู (Pink Milk)', price: 20, cat: 'Hop Milk', img: 'https://images.unsplash.com/photo-1497034825429-c343d7c6a68f?w=300' },
            { id: 5, name: 'เอสเพรสโซ่ (Espresso)', price: 25, cat: 'Hop Coffee', img: 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=300' },
            { id: 6, name: 'บลูฮาวายโซดา', price: 20, cat: 'Hop Soda', img: 'https://images.unsplash.com/photo-1536935338218-d4133eba883b?w=300' },
            { id: 7, name: 'ชานมไต้หวัน', price: 20, cat: 'Hop Tea', img: 'https://images.unsplash.com/photo-1525193612562-0ec53b0e5d7c?w=300' },
            { id: 8, name: 'ชามะลิ', price: 20, cat: 'Hop Jasmine', img: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=300' }
        ];

        let cart = [];
        let orders = JSON.parse(localStorage.getItem('hop_orders')) || [];

        function switchView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById('view-' + id).classList.remove('hidden');
            if(id === 'customer') renderMenu('All');
            if(id === 'owner') renderOrders();
        }

        function filterMenu(cat, btn) {
            document.querySelectorAll('.category-btn').forEach(b => {
                b.classList.remove('active');
                b.classList.add('text-gray-400');
            });
            btn.classList.add('active');
            btn.classList.remove('text-gray-400');
            renderMenu(cat);
        }

        function renderMenu(cat) {
            const grid = document.getElementById('customer-grid');
            const items = cat === 'All' ? menu : menu.filter(m => m.cat === cat);
            grid.innerHTML = items.map(m => `
                <div class="bg-white p-3 rounded-[35px] shadow-sm border border-slate-100 menu-item-card flex flex-col" onclick="addItem(${m.id})">
                    <img src="${m.img}" class="w-full aspect-square object-cover rounded-[28px] mb-3">
                    <div class="px-2">
                        <h3 class="font-bold text-xs truncate mb-1">${m.name}</h3>
                        <div class="flex justify-between items-center">
                            <span class="text-yellow-600 font-bold text-sm">฿${m.price}</span>
                            <div class="bg-black text-white w-7 h-7 rounded-xl flex items-center justify-center text-[10px]">
                                <i class="fas fa-plus"></i>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addItem(id) {
            const product = menu.find(m => m.id === id);
            const inCart = cart.find(c => c.id === id);
            if(inCart) inCart.qty++; else cart.push({...product, qty: 1});
            updateCartUI();
        }

        function updateCartUI() {
            const qty = cart.reduce((s, i) => s + i.qty, 0);
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const bar = document.getElementById('cart-bar');
            bar.classList.toggle('hidden', qty === 0);
            document.getElementById('cart-count').innerText = qty;
            document.getElementById('cart-total').innerText = `฿${total}`;
        }

        function showCart() {
            const list = document.getElementById('cart-list');
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            document.getElementById('modal-total').innerText = `฿${total}`;
            list.innerHTML = cart.map(i => `
                <div class="flex items-center gap-4 bg-gray-50 p-4 rounded-3xl">
                    <img src="${i.img}" class="w-12 h-12 rounded-xl object-cover">
                    <div class="flex-grow font-bold text-sm leading-tight">${i.name}</div>
                    <div class="flex items-center gap-3">
                        <button onclick="changeQty(${i.id}, -1)" class="w-8 h-8 bg-white rounded-xl shadow-sm border border-gray-100">-</button>
                        <span class="font-bold text-lg w-5 text-center">${i.qty}</span>
                        <button onclick="changeQty(${i.id}, 1)" class="w-8 h-8 bg-white rounded-xl shadow-sm border border-gray-100">+</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function changeQty(id, delta) {
            const i = cart.find(c => c.id === id);
            if(i) {
                i.qty += delta;
                if(i.qty <= 0) cart = cart.filter(c => c.id !== id);
                showCart();
                updateCartUI();
                if(cart.length === 0) closeModal('cart-modal');
            }
        }

        function submitOrder() {
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const newOrder = {
                id: Math.floor(1000 + Math.random() * 9000),
                items: [...cart],
                total: total,
                status: 'pending',
                time: new Date().toLocaleTimeString('th-TH')
            };
            orders.push(newOrder);
            localStorage.setItem('hop_orders', JSON.stringify(orders));
            cart = [];
            updateCartUI();
            closeModal('cart-modal');
            alert('ส่งออเดอร์ไปยังร้านค้าแล้ว ขอบคุณครับ!');
        }

        // ระบบเจ้าของร้าน
        function openLogin() { document.getElementById('login-modal').classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function doLogin() {
            if(document.getElementById('pin-input').value === '0000') {
                document.getElementById('pin-input').value = '';
                closeModal('login-modal');
                switchView('owner');
            } else {
                alert('รหัสผ่านไม่ถูกต้อง!');
                document.getElementById('pin-input').value = '';
            }
        }

        function renderOrders() {
            const container = document.getElementById('order-container');
            if(orders.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-gray-300 font-bold">ยังไม่มีออเดอร์ในระบบ</div>`;
                return;
            }
            container.innerHTML = orders.slice().reverse().map(o => `
                <div class="bg-white p-6 rounded-[35px] shadow-sm border-l-8 ${o.status==='pending' ? 'border-yellow-400' : 'border-green-400'}">
                    <div class="flex justify-between items-center mb-4 border-b pb-3">
                        <span class="text-[10px] font-bold text-gray-300">#${o.id}</span>
                        <span class="text-xs font-bold text-gray-400">${o.time}</span>
                    </div>
                    <div class="space-y-1 mb-6">
                        ${o.items.map(i => `<div class="font-bold text-slate-800 flex justify-between"><span>${i.name}</span> <span>x${i.qty}</span></div>`).join('')}
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="text-2xl font-bold tracking-tighter">฿${o.total}</div>
                        ${o.status === 'pending' ? 
                            `<button onclick="setDone(${o.id})" class="bg-black text-white px-6 py-2 rounded-2xl text-[10px] font-bold shadow-lg">ยืนยันทำเสร็จ</button>` : 
                            `<i class="fas fa-check-circle text-green-500 text-2xl"></i>`
                        }
                    </div>
                </div>
            `).join('');
        }

        window.setDone = (id) => {
            const o = orders.find(x => x.id === id);
            if(o) o.status = 'completed';
            localStorage.setItem('hop_orders', JSON.stringify(orders));
            renderOrders();
        };

        switchView('home');
    </script>
</body>
</html>
