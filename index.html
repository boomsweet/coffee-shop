<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ลูกค้า - กาแฟอารมณ์ดี</title>

<style>
body { font-family:sans-serif; background:#111; color:#fff; padding:10px;}
.menu { background:#1e293b; padding:10px; margin:8px 0; border-radius:10px;}
button { padding:5px 10px; margin:3px;}
.cart { background:#020617; padding:10px; margin-top:15px;}
</style>
</head>

<body>

<h2>👥 ลูกค้า (สั่งน้ำ)</h2>

<div id="menuList"></div>

<h3>🧾 รายการที่สั่ง</h3>
<div id="cart"></div>
<h2>รวม: <span id="total">0</span> บาท</h2>

<input id="name" placeholder="ชื่อ">
<input id="phone" placeholder="เบอร์">

<button onclick="sendOrder()">สั่งเลย</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "coffee-shop-2042e.firebaseapp.com",
  databaseURL: "https://coffee-shop-2042e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "coffee-shop-2042e",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let cart = {};

onValue(ref(db, "menu"), (snap)=>{
  const data = snap.val();
  let html = "";
  for(let key in data){
    html += `
    <div class="menu">
      ${data[key].name} (${data[key].price} บาท)
      <br>
      <button onclick="add('${key}', ${data[key].price})">+</button>
      <button onclick="remove('${key}', ${data[key].price})">-</button>
    </div>`;
  }
  document.getElementById("menuList").innerHTML = html;
});

window.add = (id, price)=>{
  if(!cart[id]) cart[id] = {qty:0, price};
  cart[id].qty++;
  renderCart();
}

window.remove = (id)=>{
  if(cart[id]){
    cart[id].qty--;
    if(cart[id].qty<=0) delete cart[id];
  }
  renderCart();
}

function renderCart(){
  let html="", total=0;
  for(let i in cart){
    let item = cart[i];
    html += `${i} x ${item.qty}<br>`;
    total += item.qty * item.price;
  }
  document.getElementById("cart").innerHTML = html;
  document.getElementById("total").innerText = total;
}

window.sendOrder = ()=>{
  push(ref(db,"orders"), {
    name: name.value,
    phone: phone.value,
    cart: cart,
    total: total.innerText,
    time: new Date().toLocaleString()
  });
  alert("สั่งสำเร็จ");
}
</script>

</body>
</html>
