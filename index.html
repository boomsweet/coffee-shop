<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hop Cafe</title>

<style>
body{font-family:sans-serif;background:#f1f5f9;padding:10px}
.card{background:#fff;padding:10px;margin:10px;border-radius:10px}
.cart{background:#fff;padding:10px;margin:5px;border-radius:10px}
button{padding:8px;margin:3px}
img{width:100%;border-radius:10px}
.status{background:#fff;padding:10px;margin:10px;border-radius:10px}
</style>

</head>

<body>

<h1>☕ Hop Cafe</h1>
<div id="menu"></div>

<h2>🧾 รายการ</h2>
<input id="name" placeholder="ชื่อ">
<input id="phone" placeholder="เบอร์">
<div id="cart"></div>
<h3 id="total"></h3>

<button onclick="submitOrder()">ยืนยัน</button>

<!-- 🔥 สถานะ -->
<h2>📡 สถานะออเดอร์</h2>
<div id="statusBox"></div>

<script type="module">
import { db, collection, addDoc, doc, onSnapshot } from "./firebase.js";

let cart=[];
let currentOrderId=null;

// 🔥 เมนู + รูป (ใช้รูป placeholder ก่อน)
const menuList = [
{name:"ชาเขียวนม",price:25,img:"https://via.placeholder.com/150"},
{name:"โกโก้ชา",price:25,img:"https://via.placeholder.com/150"},
{name:"ชาไทย",price:20,img:"https://via.placeholder.com/150"},
{name:"ชานมไต้หวัน",price:20,img:"https://via.placeholder.com/150"},
{name:"เนสที",price:20,img:"https://via.placeholder.com/150"},
{name:"ชามะนาว",price:20,img:"https://via.placeholder.com/150"},
{name:"ชาดำ",price:20,img:"https://via.placeholder.com/150"},
{name:"ชาเขียวใส",price:20,img:"https://via.placeholder.com/150"},
{name:"ชาเขียวมะนาว",price:20,img:"https://via.placeholder.com/150"},
{name:"ชาเขียวน้ำผึ้งมะนาว",price:20,img:"https://via.placeholder.com/150"},

{name:"โกโก้",price:25,img:"https://via.placeholder.com/150"},
{name:"นมสด",price:20,img:"https://via.placeholder.com/150"},
{name:"นมชมพู",price:20,img:"https://via.placeholder.com/150"},

{name:"เอสเพรสโซ่",price:25,img:"https://via.placeholder.com/150"},
{name:"ลาเต้",price:25,img:"https://via.placeholder.com/150"},

{name:"แดงโซดา",price:20,img:"https://via.placeholder.com/150"},
{name:"เขียวโซดา",price:20,img:"https://via.placeholder.com/150"},

{name:"ชาพีช",price:20,img:"https://via.placeholder.com/150"},
{name:"ชานมบราวน์ซูการ์",price:20,img:"https://via.placeholder.com/150"}
];

const menuDiv=document.getElementById("menu");
const cartDiv=document.getElementById("cart");
const statusBox=document.getElementById("statusBox");

// แสดงเมนู
menuList.forEach((m,i)=>{
 menuDiv.innerHTML+=`
 <div class="card">
 <img src="${m.img}">
 <b>${m.name}</b> (${m.price} บาท)
 <br>
 <label><input type="checkbox" id="b${i}"> ไข่มุก +5</label>
 <br>
 <button onclick="add(${i})">เพิ่ม</button>
 </div>`;
});

// เพิ่มสินค้า
window.add=i=>{
 const bubble=document.getElementById("b"+i).checked?5:0;
 const e=cart.find(x=>x.id==i && x.bubble==bubble);
 if(e){e.qty++}
 else{cart.push({...menuList[i],id:i,qty:1,bubble})}
 render();
};

// render ตะกร้า
function render(){
 let total=0;
 cartDiv.innerHTML="";
 cart.forEach((c,i)=>{
  total+=(c.price+c.bubble)*c.qty;
  cartDiv.innerHTML+=`
  <div class="cart">
  ${c.name} x ${c.qty}
  <button onclick="inc(${i})">+</button>
  <button onclick="dec(${i})">-</button>
  </div>`;
 });
 document.getElementById("total").innerText="รวม "+total+" บาท";
}

window.inc=i=>{cart[i].qty++;render()}
window.dec=i=>{cart[i].qty--;if(cart[i].qty<=0)cart.splice(i,1);render()}

// 🔥 สั่งสินค้า + realtime
window.submitOrder=async()=>{
 const ref = await addDoc(collection(db,"orders"),{
  name:name.value,
  phone:phone.value,
  cart,
  status:"new",
  time:Date.now()
 });

 currentOrderId = ref.id;

 // 🔥 ฟังสถานะจากร้าน
 onSnapshot(doc(db,"orders",currentOrderId),(snap)=>{
  const s = snap.data().status;

  let text="รับออเดอร์แล้ว";
  if(s==="doing") text="กำลังทำ";
  if(s==="done") text="เสร็จแล้ว";

  statusBox.innerHTML = `
  <div class="status">
  สถานะ: <b>${text}</b>
  </div>`;
 });

 alert("สั่งสำเร็จ");

 cart=[];
 render();
}
</script>

</body>
</html>
