<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>กาแฟอารมณ์ดี</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b00">

<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5}
.header{background:#ff6b00;color:#fff;padding:15px;font-size:20px}

.install{
position:fixed;top:0;left:0;right:0;bottom:0;
background:#000;color:#fff;display:flex;
flex-direction:column;justify-content:center;align-items:center;
z-index:9999;
}

.tabs{display:flex;background:#fff}
.tab{flex:1;text-align:center;padding:10px}
.active{border-bottom:3px solid #ff6b00}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.card{background:#fff;border-radius:15px;overflow:hidden}
.card img{width:100%;height:120px;object-fit:cover}
.card-body{padding:10px}

.cart{position:fixed;bottom:0;width:100%;background:#fff;padding:10px}
button{background:#ff6b00;color:#fff;border:none;padding:5px;border-radius:5px}
</style>
</head>

<body>

<!-- 🔒 บังคับติดตั้ง -->
<div id="installBox" class="install">
<h2>📱 ติดตั้งแอปก่อนใช้งาน</h2>
<p>เพื่อใช้งานเหมือนแอปจริง</p>
<button onclick="installApp()">ติดตั้งแอป</button>
</div>

<div id="app" style="display:none">

<div class="header">☕ กาแฟอารมณ์ดี</div>

<div class="tabs">
<div class="tab active" onclick="setCat('tea',this)">ชา</div>
<div class="tab" onclick="setCat('coffee',this)">กาแฟ</div>
<div class="tab" onclick="setCat('milk',this)">นม</div>
<div class="tab" onclick="setCat('soda',this)">โซดา</div>
</div>

<div id="menu" class="grid"></div>

<div class="cart">
<div id="cart"></div>
รวม: <span id="total">0</span> บาท

<h4>💳 ชำระเงิน</h4>
<img id="qr" width="180"><br>
<button onclick="genQR()">สร้าง QR</button>

<br>
<input id="name" placeholder="ชื่อ">
<input id="phone" placeholder="เบอร์">
<button onclick="order()">สั่งเลย</button>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
 apiKey:"AIzaSyCW-ztNX8EAio66VN8ODKo6_z9R8-B99mU",
 databaseURL:"https://coffee-shop-2042e-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db=getDatabase(app);

let cart={},menuData={},cat="tea";

function getCat(n){
 if(n.includes("☕")) return "coffee";
 if(n.includes("นม")) return "milk";
 if(n.includes("โซดา")) return "soda";
 return "tea";
}

function getImg(n){
 if(n.includes("ชา")) return "https://images.unsplash.com/photo-1556679343-c7306c1976bc";
 if(n.includes("☕")) return "https://images.unsplash.com/photo-1509042239860-f550ce710b93";
 if(n.includes("นม")) return "https://images.unsplash.com/photo-1582719478250-c89cae4dc85b";
 return "https://images.unsplash.com/photo-1527169402691-a4e7c08c1a2f";
}

window.setCat=(c,e)=>{
 cat=c;
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 e.classList.add("active");
 renderMenu();
}

onValue(ref(db,"menu"),s=>{
 menuData=s.val()||{};
 renderMenu();
});

function renderMenu(){
 let html="";
 for(let k in menuData){
  let m=menuData[k];
  if(getCat(m.name)!=cat) continue;

  html+=`
  <div class="card">
  <img src="${getImg(m.name)}">
  <div class="card-body">
  ${m.name}<br>${m.price} บาท<br>

  <select onchange="sweet('${k}',this.value)">
  <option>ปกติ</option><option>หวานน้อย</option><option>ไม่หวาน</option>
  </select>

  <br>
  <label><input type="checkbox" onchange="pearl('${k}',this.checked)"> ไข่มุก +5</label>

  <br>
  <button onclick="add('${k}',${m.price})">+</button>
  <button onclick="removeItem('${k}')">-</button>
  จำนวน: ${cart[k]?.qty||0}
  </div></div>`;
 }
 menu.innerHTML=html;
}

window.sweet=(k,v)=>{ if(!cart[k]) cart[k]={qty:0,price:0}; cart[k].sweet=v; }
window.pearl=(k,v)=>{ if(!cart[k]) cart[k]={qty:0,price:0}; cart[k].pearl=v; }

window.add=(k,p)=>{
 if(!cart[k]) cart[k]={qty:0,price:p};
 cart[k].qty++;
 render();
}

window.removeItem=(k)=>{
 if(cart[k]){
  cart[k].qty--;
  if(cart[k].qty<=0) delete cart[k];
 }
 render();
}

function render(){
 let t=0,html="";
 for(let k in cart){
  let c=cart[k];
  let price=c.price+(c.pearl?5:0);
  t+=price*c.qty;
  html+=`${menuData[k].name} x${c.qty}<br>`;
 }
 cartDiv.innerHTML=html;
 total.innerText=t;
}

window.genQR=()=>{
 let phone="0812345678";
 qr.src=`https://promptpay.io/${phone}/${total.innerText}`;
}

window.order=()=>{
 push(ref(db,"orders"),{
  name:name.value,
  phone:phone.value,
  cart:cart,
  total:total.innerText,
  status:"new",
  time:new Date().toLocaleString()
 });
 alert("สั่งสำเร็จ");
 cart={}; render();
}
</script>

<!-- 🔥 INSTALL APP SCRIPT -->
<script>
let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});

// กดติดตั้ง
window.installApp = async ()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;

    if(outcome === 'accepted'){
      installBox.style.display="none";
      app.style.display="block";
    }
  }else{
    alert("กรุณากด เพิ่มไปหน้าจอหลัก จากเมนูมือถือ");
  }
};

// ถ้าเปิดจากแอปแล้ว
if(window.matchMedia('(display-mode: standalone)').matches){
  installBox.style.display="none";
  app.style.display="block";
}
</script>

<!-- PWA -->
<script>
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
