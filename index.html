<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HOP Chafe - Entry</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
        body { font-family: 'Kanit', sans-serif; background: #fafafa; }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-8">
    <div class="bg-black text-white w-24 h-24 rounded-[30px] flex items-center justify-center mb-6 shadow-2xl animate-bounce">
        <i class="fas fa-coffee text-4xl"></i>
    </div>
    <h1 class="text-4xl font-bold mb-2">HOP Chafe</h1>
    <p class="text-gray-400 uppercase tracking-[0.2em] text-[10px] mb-12 font-bold">Be Fresh And Cool</p>
    
    <div class="grid grid-cols-1 gap-5 w-full max-w-xs">
        <a href="home.html" class="bg-black text-white py-5 rounded-[22px] font-bold text-xl shadow-xl hover:scale-105 active:scale-95 transition flex items-center justify-center gap-3">
            <i class="fas fa-utensils"></i> สำหรับลูกค้า
        </a>
        <a href="pos.html" class="bg-yellow-400 text-black py-5 rounded-[22px] font-bold text-xl shadow-xl hover:scale-105 active:scale-95 transition flex items-center justify-center gap-3 border-2 border-black">

        </a>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>

</html>
