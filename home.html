<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HOP Chafe - Order Now</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-white h-screen flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="p-6 flex justify-between items-center shrink-0">
        <div>
            <h2 class="text-2xl font-bold tracking-tighter">HOP <span class="text-yellow-500">Chafe</span></h2>
            <p class="text-[9px] text-gray-400 uppercase tracking-widest font-bold">Good morning starts with hop</p>
        </div>
        <div class="bg-black text-white px-5 py-2 rounded-full text-xs font-bold shadow-lg">20.- <span class="font-normal opacity-70">Free Pearls</span></div>
    </header>

    <!-- Menu List -->
    <main class="flex-grow overflow-y-auto px-6 pb-32">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">เลือกเมนูโปรด 👋</h1>
        <div id="menu-grid" class="grid grid-cols-2 gap-4">
            <!-- ข้อมูลจาก Firestore จะมาโผล่ตรงนี้ -->
        </div>
    </main>

    <!-- Floating Cart Bar -->
    <div id="cart-bar" class="fixed bottom-6 left-6 right-6 bg-black text-white p-5 rounded-[25px] shadow-2xl flex justify-between items-center hidden cursor-pointer transform transition hover:scale-[1.02] active:scale-95 z-40" onclick="toggleModal(true)">
        <div class="flex items-center gap-4">
            <div id="cart-qty" class="bg-yellow-400 text-black w-8 h-8 rounded-xl flex items-center justify-center font-bold text-sm">0</div>
            <span class="font-bold tracking-tight text-lg">รายการในตะกร้า</span>
        </div>
        <div id="cart-total" class="text-2xl font-bold text-yellow-400">฿0</div>
    </div>

    <!-- Checkout Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end">
        <div class="bg-white w-full rounded-t-[45px] p-8 max-h-[85vh] flex flex-col" id="modal-panel">
            <div class="w-16 h-1.5 bg-gray-200 rounded-full mx-auto mb-8"></div>
            <h3 class="text-2xl font-bold mb-6">ตรวจสอบรายการ</h3>
            <div id="cart-items" class="flex-grow overflow-y-auto space-y-4 mb-6"></div>
            <div class="border-t pt-8 space-y-6">
                <div class="flex justify-between items-center">
                    <span class="text-gray-400 font-medium">รวมยอดชำระ</span>
                    <span id="modal-total" class="text-4xl font-bold text-black tracking-tight">฿0</span>
                </div>
                <button onclick="sendOrder()" id="order-btn" class="w-full bg-black text-white py-5 rounded-[22px] font-bold text-xl flex items-center justify-center gap-3 shadow-xl active:scale-95 transition">
                    <i class="fas fa-paper-plane"></i> สั่งเลยตอนนี้
                </button>
                <button onclick="toggleModal(false)" class="w-full text-gray-400 font-bold pb-4">กลับไปเลือกเพิ่ม</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hop-chafe-pwa';

        let menu = [];
        let cart = [];

        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'menu'), (snap) => {
            menu = snap.docs.map(doc => ({id: doc.id, ...doc.data()}));
            render();
        });

        window.render = () => {
            document.getElementById('menu-grid').innerHTML = menu.map(item => `
                <div class="bg-white rounded-[35px] p-3 shadow-sm border border-gray-100 flex flex-col">
                    <div class="aspect-square bg-gray-50 rounded-[28px] overflow-hidden mb-3">
                        <img src="${item.image || 'https://via.placeholder.com/200'}" class="w-full h-full object-cover">
                    </div>
                    <div class="px-2 pb-1">
                        <div class="font-bold text-sm text-gray-800 truncate mb-1">${item.name}</div>
                        <div class="flex justify-between items-center">
                            <span class="text-yellow-600 font-bold text-lg italic">฿${item.price}</span>
                            <button onclick="addToCart('${item.id}')" class="bg-black text-white w-9 h-9 rounded-xl flex items-center justify-center active:scale-75 transition shadow-lg">
                                <i class="fas fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        };

        window.addToCart = (id) => {
            const prod = menu.find(m => m.id === id);
            const inCart = cart.find(c => c.id === id);
            if(inCart) inCart.qty++; else cart.push({...prod, qty: 1});
            updateUI();
        };

        window.updateQty = (id, delta) => {
            const item = cart.find(c => c.id === id);
            if(item) {
                item.qty += delta;
                if(item.qty <= 0) cart = cart.filter(c => c.id !== id);
                updateUI();
            }
        };

        function updateUI() {
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const qty = cart.reduce((s, i) => s + i.qty, 0);
            document.getElementById('cart-bar').classList.toggle('hidden', cart.length === 0);
            document.getElementById('cart-qty').innerText = qty;
            document.getElementById('cart-total').innerText = `฿${total}`;
            document.getElementById('modal-total').innerText = `฿${total}`;
            document.getElementById('cart-items').innerHTML = cart.map(i => `
                <div class="flex items-center gap-5 bg-gray-50 p-4 rounded-3xl">
                    <img src="${i.image}" class="w-16 h-16 rounded-2xl object-cover">
                    <div class="flex-grow font-bold text-gray-800">${i.name}</div>
                    <div class="flex items-center gap-3">
                        <button onclick="updateQty('${i.id}', -1)" class="w-8 h-8 bg-white rounded-lg shadow-sm">-</button>
                        <span class="font-bold w-4 text-center">${i.qty}</span>
                        <button onclick="updateQty('${i.id}', 1)" class="w-8 h-8 bg-white rounded-lg shadow-sm">+</button>
                    </div>
                </div>
            `).join('');
        }

        window.toggleModal = (show) => document.getElementById('cart-modal').classList.toggle('hidden', !show);

        window.sendOrder = async () => {
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'orders'), {
                items: cart, total, status: 'pending', createdAt: Date.now()
            });
            cart = []; updateUI(); toggleModal(false);
            alert('ส่งออเดอร์สำเร็จ!');
        };
    </script>
</body>
</html>
