const menuEl=document.getElementById("menu");
function renderMenu(){
  menuEl.innerHTML="";
  menuData.filter(m=>m.cat===cat).forEach(m=>{
    menuEl.innerHTML+=`
      <div class="card">
        <img src="${m.img}">
        <div class="card-body">
          ${m.name}<br>${m.price} บาท<br>
          <button onclick="addToCart('${m.name}',${m.price})">+</button>
        </div>
      </div>`;
  });
}
function setCat(c,e){
  cat=c;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  e.classList.add("active");
  renderMenu();
}

let cartItems={};
function addToCart(name,price){
  if(!cartItems[name]) cartItems[name]={qty:0,price:price};
  cartItems[name].qty++;
  renderCart();
}

function renderCart(){
  const cartDiv=document.getElementById("cartDiv");
  let total=0,html="";
  for(let k in cartItems){
    html+=`${k} x${cartItems[k].qty}<br>`;
    total+=cartItems[k].price*cartItems[k].qty;
  }
  cartDiv.innerHTML=html;
  document.getElementById("total").innerText=total;
}

// สร้าง QR
function genQR(){
  const phone="0812345678"; // ใส่หมายเลขบัญชี PromptPay ของร้าน
  const total=document.getElementById("total").innerText;
  document.getElementById("qr").src=`https://promptpay.io/${phone}/${total}`;
}

// สั่งสินค้า
function order(){
  const name=document.getElementById("name").value;
  const phone=document.getElementById("phone").value;
  if(!name || !phone){
    alert("กรุณาใส่ชื่อและเบอร์โทร");
    return;
  }
  push(ref(db,"orders"),{name:name,phone:phone,cart:cartItems,total:document.getElementById("total").innerText,status:"new",time:new Date().toLocaleString()});
  alert("สั่งสำเร็จ!");
  cartItems={}; renderCart();
}

renderMenu();

// Service Worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
}
