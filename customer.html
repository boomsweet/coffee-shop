<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hop Tea - ลูกค้า</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b00">
<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5}
.header{background:#ff6b00;color:#fff;padding:15px;font-size:20px;text-align:center}
.tabs{display:flex;background:#fff}
.tab{flex:1;text-align:center;padding:10px;cursor:pointer}
.active{border-bottom:3px solid #ff6b00}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 4px 6px rgba(0,0,0,0.1)}
.card img{width:100%;height:120px;object-fit:cover}
.card-body{padding:10px}
.cart{position:fixed;bottom:0;width:100%;background:#fff;padding:10px;box-shadow:0 -2px 6px rgba(0,0,0,0.2)}
button{background:#ff6b00;color:#fff;border:none;padding:5px;border-radius:5px;cursor:pointer}
input{padding:5px;margin:3px;border-radius:5px;border:1px solid #ccc;width:48%}
</style>
</head>
<body>

<div class="header">☕ Hop Tea</div>

<div class="tabs">
<div class="tab active" onclick="setCat('tea',this)">ชา</div>
<div class="tab" onclick="setCat('jasmine',this)">ชามะลิ</div>
<div class="tab" onclick="setCat('berry',this)">ชาเบอร์รี่</div>
<div class="tab" onclick="setCat('milk',this)">นม</div>
<div class="tab" onclick="setCat('coffee',this)">กาแฟ</div>
<div class="tab" onclick="setCat('soda',this)">โซดา</div>
<div class="tab" onclick="setCat('other',this)">อื่นๆ</div>
</div>

<div id="menu" class="grid"></div>

<div class="cart">
<div id="cart"></div>
รวม: <span id="total">0</span> บาท
<br>
<input id="name" placeholder="ชื่อ">
<input id="phone" placeholder="เบอร์">
<br>
<button onclick="order()">สั่งเลย</button>
</div>

const app = initializeApp({

  databaseURL:"YOUR_DB_URL"

const db=getDatabase(app);

let cart={}, cat="tea";

function setCat(c,e){cat=c;document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));e.classList.add("active");renderMenu();}
function renderMenu(){let html="";for(let k in menuData){const m=menuData[k];if(m.cat!=cat) continue;html+=`<div class="card"><img src="${m.img}"><div class="card-body">${k}<br>${m.price} บาท<br><button onclick="add('${k}',${m.price})">+</button> จำนวน: ${cart[k]?.qty||0}</div></div>`;}document.getElementById("menu").innerHTML=html;}
function add(k,p){if(!cart[k]) cart[k]={qty:0,price:p};cart[k].qty++;renderCart();}
function renderCart(){let html="",total=0;for(let k in cart){const c=cart[k];total+=c.price*c.qty;html+=`${k} x${c.qty}<br>`;}document.getElementById("cart").innerHTML=html;document.getElementById("total").innerText=total;}
function order(){const name=document.getElementById("name").value;const phone=document.getElementById("phone").value;if(!name||!phone){alert("กรุณาใส่ชื่อและเบอร์");return;}push(ref(db,"orders"),{name,phone,cart,total:document.getElementById("total").innerText,status:"new",time:new Date().toLocaleString()});cart={}; renderCart(); alert("สั่งเรียบร้อย!");}
renderMenu();
</script>
