<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hop Tea - ลูกค้า</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b00">
<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5}
.header{background:#ff6b00;color:#fff;padding:15px;font-size:20px;text-align:center}
.tabs{display:flex;background:#fff}
.tab{flex:1;text-align:center;padding:10px;cursor:pointer}
.active{border-bottom:3px solid #ff6b00}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,0.2);}
.card img{width:100%;height:120px;object-fit:cover;}
.card-body{padding:10px;font-size:14px;color:#333;}
.cart{position:fixed;bottom:0;width:100%;background:#fff;padding:10px;box-shadow:0 -2px 6px rgba(0,0,0,0.2);}
button{background:#ff6b00;color:#fff;border:none;padding:5px;border-radius:5px;cursor:pointer;margin-top:3px}
input{padding:5px;margin:3px;width:calc(50% - 12px);}
</style>
</head>
<body>

<div class="header">☕ Hop Tea</div>

<div class="tabs">
<div class="tab active" onclick="setCat('tea',this)">ชา</div>
<div class="tab" onclick="setCat('coffee',this)">กาแฟ</div>
<div class="tab" onclick="setCat('milk',this)">นม</div>
<div class="tab" onclick="setCat('soda',this)">โซดา</div>
<div class="tab" onclick="setCat('other',this)">อื่นๆ</div>
</div>

<div id="menu" class="grid"></div>

<div class="cart">
<div id="cartDiv"></div>
รวม: <span id="total">0</span> บาท
<br>
<input id="name" placeholder="ชื่อ">
<input id="phone" placeholder="เบอร์">
<button onclick="order()">สั่งเลย</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
 apiKey:"AIzaSyCW-ztNX8EAio66VN8ODKo6_z9R8-B99mU",
 databaseURL:"https://coffee-shop-2042e-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db=getDatabase(app);

let cart={},cat="tea";

const menuData = {
"ชาเขียวนม":["25","https://images.unsplash.com/photo-1556679343-c7306c1976bc"],
"ชานมโกโก้":["25","https://images.unsplash.com/photo-1600491624410-cd0f97d9c430"],
"ชาไทย":["20","https://images.unsplash.com/photo-1572557345907-1d21b1daea29"],
"ชานมไต้หวัน":["20","https://images.unsplash.com/photo-1597293285655-df9b0c46aa63"],
"ชาเนสที":["20","https://images.unsplash.com/photo-1572557345907-1d21b1daea29"],
"ชามะนาว":["20","https://images.unsplash.com/photo-1556911073-52527ac43794"],
"ชาดำ":["20","https://images.unsplash.com/photo-1572557345907-1d21b1daea29"],
"ชาเขียวใส":["20","https://images.unsplash.com/photo-1556679343-c7306c1976bc"],

"ชามะลิ":["20","https://images.unsplash.com/photo-1565299624946-b28f40a0ae38"],

"ชามะลิสตรอว์เบอร์รี่":["20","https://images.unsplash.com/photo-1565299624946-b28f40a0ae38"],
"ชามะลิเก๊กฮวย":["20","https://images.unsplash.com/photo-1565299624946-b28f40a0ae38"],
"ชามะลินม":["20","https://images.unsplash.com/photo-1565299624946-b28f40a0ae38"],
"ชาเบอร์รี่":["20","https://images.unsplash.com/photo-1590080871213-f43f2637b69b"],
"ชาเบอร์รี่มะนาว":["20","https://images.unsplash.com/photo-1590080871213-f43f2637b69b"],

"นมสด":["20","https://images.unsplash.com/photo-1582719478250-c89cae4dc85b"],
"นมชมพู":["20","https://images.unsplash.com/photo-1582719478250-c89cae4dc85b"],
"โกโก้":["25","https://images.unsplash.com/photo-1582719478250-c89cae4dc85b"],
"โอวัลติน":["20","https://images.unsplash.com/photo-1582719478250-c89cae4dc85b"],
"นมเผือก":["20","https://images.unsplash.com/photo-1582719478250-c89cae4dc85b"],
"นมแคนตาลูป":["20","https://images.unsplash.com/photo-1582719478250-c89cae4dc85b"],
"สตรอว์เบอร์รี่นมสด":["20","https://images.unsplash.com/photo-1582719478250-c89cae4dc85b"],
"เอสเปรสโซ่":["25","https://images.unsplash.com/photo-1509042239860-f550ce710b93"],
"ลาเต้":["25","https://images.unsplash.com/photo-1509042239860-f550ce710b93"],
"มอคค่า":["25","https://images.unsplash.com/photo-1509042239860-f550ce710b93"],
"คาปูชิโน่":["25","https://images.unsplash.com/photo-1509042239860-f550ce710b93"],
"แดงโซดา":["20","https://images.unsplash.com/photo-1527169402691-a4e7c08c1a2f"],

"แคนตาลูปโซดา":["20","https://images.unsplash.com/photo-1527169402691-a4e7c08c1a2f"],
"สตรอว์เบอร์รี่โซดา":["20","https://images.unsplash.com/photo-1527169402691-a4e7c08c1a2f"],
"มะม่วงโซดา":["20","https://images.unsplash.com/photo-1527169402691-a4e7c08c1a2f"],
"กีวี่โซดา":["20","https://images.unsplash.com/photo-1527169402691-a4e7c08c1a2f"],
"แอปเปิ้ลโซดา":["20","https://images.unsplash.com/photo-1527169402691-a4e7c08c1a2f"],
"ชาพีช":["20","https://images.unsplash.com/photo-1576564726205-0f2b430a2a07"],
"ชานมไต้หวัน บราวน์ชูก้า":["25","https://images.unsplash.com/photo-1576564726205-0f2b430a2a07"],
"ชาเขียว บราวน์ชูก้า":["25","https://images.unsplash.com/photo-1576564726205-0f2b430a2a07"],
"นมสด บราวน์ชูก้า":["25","https://images.unsplash.com/photo-1576564726205-0f2b430a2a07"]
};

function getCategory(name){
 if(["เอสเปรสโซ่","ลาเต้","มอคค่า","คาปูชิโน่"].includes(name)) return "coffee";
 if(["นมสด","นมชมพู","โกโก้","โอวัลติน","นมเผือก","นมแคนตาลูป","สตรอว์เบอร์รี่นมสด"].includes(name)) return "milk";
 if(["แดงโซดา","เขียวโซดา","มะนาวโซดา","น้ำผึ้งมะนาวโซดา","เสาวรสโซดา","บลูฮาวายโซดา","องุ่นโซดา","ลิ้นจี่โซดา","แคนตาลูปโซดา","สตรอว์เบอร์รี่โซดา","มะม่วงโซดา","กีวี่โซดา","แอปเปิ้ลโซดา"].includes(name)) return "soda";
 if(["ชาพีช","ชานมไต้หวัน บราวน์ชูก้า","ชาเขียว บราวน์ชูก้า","นมสด บราวน์ชูก้า"].includes(name)) return "other";
 return "tea";
}

window.setCat=(c,e)=>{
 cat=c;
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 e.classList.add("active");
 renderMenu();
}

function renderMenu(){
 let html="";
 for(let k in menuData){
   if(getCategory(k)!=cat) continue;
   html+=`<div class="card">
   <img src="${menuData[k][1]}">
   <div class="card-body">${k}<br>${menuData[k][0]} บาท<br>
   <button onclick="add('${k}')">+</button> จำนวน: ${cart[k]||0} </div></div>`;
 }
 document.getElementById("menu").innerHTML=html;
}

window.add=(k)=>{
 cart[k] = (cart[k]||0)+1;
 renderCart();
 renderMenu();
}

function renderCart(){
 let html="",total=0;
 for(let k in cart){
   html+=`${k} x${cart[k]}<br>`;
   total+=parseInt(menuData[k][0])*cart[k];
 }
 document.getElementById("cartDiv").innerHTML=html;
 document.getElementById("total").innerText=total;
}

window.order=()=>{
 push(ref(db,"orders"),{
   name:document.getElementById("name").value,
   phone:document.getElementById("phone").value,
   cart:cart,
   total:document.getElementById("total").innerText,
   status:"new",
   time:new Date().toLocaleString()
 });
 alert("สั่งสำเร็จ");
 cart={}; renderCart(); renderMenu();
}

onValue(ref(db,"menu"),()=>{ renderMenu(); });
</script>
</body>
</html>
