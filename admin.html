<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ร้าน</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif}
.menu{background:#222;padding:10px;margin:5px}
</style>
</head>

<body>

<script>
let pass = prompt("ใส่รหัส");
if(pass!="0000"){
  alert("เข้าไม่ได้");
  location.href="index.html";
}
</script>

<h2>🧑‍🍳 จัดการเมนู</h2>

<input id="mname" placeholder="ชื่อเมนู">
<input id="mprice" placeholder="ราคา">
<button onclick="addMenu()">เพิ่มเมนู</button>

<div id="menu"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSy...",
  databaseURL: "https://coffee-shop-2042e-default-rtdb.asia-southeast1.firebasedatabase.app"
});

const db = getDatabase(app);

window.addMenu = ()=>{
  push(ref(db,"menu"), {
    name: mname.value,
    price: mprice.value
  });
}

onValue(ref(db,"menu"), (snap)=>{
  let data = snap.val();
  let html="";
  for(let k in data){
    html+=`
    <div class="menu">
      ${data[k].name} (${data[k].price})
      <button onclick="del('${k}')">ลบ</button>
    </div>`;
  }
  document.getElementById("menu").innerHTML=html;
});

window.del = (k)=>{
  remove(ref(db,"menu/"+k));
}
</script>

</body>
</html>
