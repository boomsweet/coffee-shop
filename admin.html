<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hop Tea - เจ้าของร้าน</title>
<link rel="manifest" href="manifest-admin.json">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:sans-serif;background:#111;color:#fff;padding:10px}
.order-card{background:#222;margin:5px;padding:10px;border-radius:10px}
button{margin:3px}
</style>
</head>
<body>
<h1 class="text-xl font-bold mb-4">ระบบเจ้าของร้าน</h1>
<div id="orders-container"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
 apiKey: "AIzaSyCW-ztNX8EAio66VN8ODKo6_z9R8-B99mU",
 databaseURL:"https://coffee-shop-2042e-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db = getDatabase(app);

onValue(ref(db,"orders"), snapshot => {
 const data = snapshot.val() || {};
 const container = document.getElementById('orders-container');
 container.innerHTML = Object.entries(data).reverse().map(([id,o]) => `
 <div class="order-card border-l-4 ${o.status==='done'?'border-green-500':'border-yellow-400'}">
 <div>เวลา: ${o.time}</div>
 <div>รวม: ฿${o.total}</div>
 <div>${o.items.map(i=>`${i.name} x${i.qty}`).join('<br>')}</div>
 <button onclick="markDone('${id}')">เสร็จแล้ว</button>
 </div>
 `).join('');
});

window.markDone = (id) => {
 update(ref(db,"orders/"+id), {status:'done'});
};
</script>
</body>
</html>
