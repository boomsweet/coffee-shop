<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hop Tea - เจ้าของร้าน</title>
<style>
body{background:#111;color:#fff;font-family:sans-serif;padding:10px}
.card{background:#222;margin:5px;padding:10px;border-radius:10px;box-shadow:0 4px 8px rgba(0,0,0,0.2);}
.new{border-left:5px solid red}
.cook{border-left:5px solid orange}
.done{border-left:5px solid green}
.paid{border-left:5px solid blue}
button{margin:3px;padding:5px;border:none;border-radius:5px;background:#ff6b00;color:#fff;cursor:pointer}
</style>
</head>
<body>

<h2>🔐 Hop Tea - เจ้าของร้าน</h2>

<input id="pass" type="password" placeholder="รหัสเข้า">
<button onclick="login()">เข้าใช้งาน</button>

<div id="admin" style="display:none">
<h3>📺 ออเดอร์เรียลไทม์</h3>
<div id="orders"></div>
<h3>📊 ยอดขายรวม: <span id="sum">0</span> บาท</h3>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// ตั้งค่า Firebase
const app = initializeApp({
  apiKey:"YOUR_API_KEY",
  databaseURL:"YOUR_DB_URL"
});
const db = getDatabase(app);

window.login=()=>{
  if(pass.value==="0000") admin.style.display="block";
}

// ดึงออเดอร์แบบ real-time
onValue(ref(db,"orders"),snap=>{
  const data=snap.val()||{};
  let html="",sum=0;
  for(let k in data){
    const o=data[k];
    let list="";
    for(let i in o.cart){
      const c=o.cart[i];
      list+=`${i} x${c.qty}<br>`;
    }
    html+=`<div class="card ${o.status}">
      👤 ${o.name}<br>
      📞 ${o.phone}<br>
      🧾 ${list}
      💰 ${o.total} บาท<br>
      <button onclick="setStatus('${k}','cook')">ทำ</button>
      <button onclick="setStatus('${k}','done')">เสร็จ</button>
      <button onclick="setStatus('${k}','paid')">จ่ายแล้ว</button>
    </div>`;
    if(o.status==="paid") sum+=parseInt(o.total||0);
  }
  orders.innerHTML=html;
  sumEl.innerText=sum;
});

window.setStatus=(k,s)=>{
  update(ref(db,"orders/"+k),{status:s});
}
</script>
</body>
</html>
