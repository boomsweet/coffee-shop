<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เจ้าของร้าน</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;padding:10px}
.box{background:#222;padding:10px;margin:5px;border-radius:10px}
button{margin:3px}
input{margin:3px}
</style>
</head>

<body>

<h2>🧑‍🍳 เจ้าของร้าน</h2>

<div id="loginBox">
  <input id="passInput" placeholder="ใส่รหัส 0000">
  <button onclick="login()">เข้าใช้งาน</button>
</div>

<div id="adminBox" style="display:none">

<h3>➕ เพิ่มเมนู</h3>
<input id="mname" placeholder="ชื่อเมนู">
<input id="mprice" placeholder="ราคา">
<button onclick="addMenu()">เพิ่ม</button>

<button onclick="loadDefaultMenu()">ใส่เมนูทั้งหมด</button>

<h3>📋 รายการเมนู</h3>
<div id="menu"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCW-ztNX8EAio66VN8ODKo6_z9R8-B99mU",
  authDomain: "coffee-shop-2042e.firebaseapp.com",
  databaseURL: "https://coffee-shop-2042e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "coffee-shop-2042e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 🔒 LOGIN
window.login = ()=>{
  const pass = document.getElementById("passInput").value;
  if(pass === "0000"){
    loginBox.style.display="none";
    adminBox.style.display="block";
  }else{
    alert("รหัสผิด");
  }
};

// ➕ เพิ่มเมนู
window.addMenu=()=>{
  push(ref(db,"menu"),{
    name:mname.value,
    price:mprice.value
  });
};

// 📋 โหลดเมนู
onValue(ref(db,"menu"),snap=>{
  let data=snap.val()||{};
  let html="";
  for(let k in data){
    html+=`
    <div class="box">
      ${data[k].name} (${data[k].price})
      <button onclick="del('${k}')">ลบ</button>
    </div>`;
  }
  menu.innerHTML=html;
});

// ❌ ลบ
window.del=(k)=>{
  remove(ref(db,"menu/"+k));
};
