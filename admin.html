<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hop Cafe | Admin Dashboard</title>
    <link rel="manifest" href="manifest-admin.json">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --primary: #38bdf8;
            --success: #22c55e; --warning: #f59e0b; --danger: #ef4444; --text: #f1f5f9;
        }
        body { background-color: var(--bg); color: var(--text); font-family: 'Kanit', sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 1000px; margin: auto; }
        #login { max-width: 350px; margin: 100px auto; text-align: center; background: var(--card); padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        .sales-overview { background: linear-gradient(135deg, #1e293b, #334155); padding: 25px; border-radius: 25px; margin-bottom: 25px; border: 1px solid #475569; }
        .sales-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: center; }
        .sales-item h4 { margin: 0; font-size: 0.9em; color: var(--primary); letter-spacing: 1px; }
        .sales-item p { margin: 8px 0 0; font-size: 1.8em; font-weight: bold; color: var(--success); }

        .admin-nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-btn { flex: 1; padding: 12px; border-radius: 15px; border: none; background: #334155; color: white; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .nav-btn.active { background: var(--primary); color: #000; }

        .section-title { padding: 10px 0; font-size: 1.2em; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.7em; min-width: 20px; text-align: center; }
        
        .grid-orders { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        .order-card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #334155; position: relative; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .cust-header { border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 12px; }
        .address-box { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; font-size: 0.9em; margin: 10px 0; color: #cbd5e1; border-left: 3px solid var(--warning); }
        
        .btn-gps { background: #4285F4; color: white; display: inline-block; padding: 5px 12px; border-radius: 8px; text-decoration: none; font-size: 0.8em; margin-top: 5px; }
        .item-list { margin: 15px 0; }
        .item-row { display: flex; justify-content: space-between; font-size: 0.95em; }
        
        .summary-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 15px; overflow: hidden; margin-top: 20px; border: 1px solid #334155; }
        .summary-table th, .summary-table td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        .summary-table th { background: #334155; color: var(--primary); font-size: 0.9em; }

        button { cursor: pointer; border: none; font-family: 'Kanit'; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        .btn-status { padding: 12px; border-radius: 12px; font-weight: bold; width: 100%; margin-top: 10px; }
        
        .page { display: none; }
        .page.active { display: block; }
        
        input { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; outline: none; margin-bottom: 10px;}
        #audio-banner { background: var(--warning); color: #000; padding: 12px; text-align: center; border-radius: 12px; margin-bottom: 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="login">
    <h2 style="margin-top:0">🔒 Admin Access</h2>
    <input id="pass" type="password" placeholder="ใส่รหัสผ่าน">
    <button id="loginBtn" style="width:100%; padding:12px; border-radius:10px; background:var(--primary); font-weight:bold; color:#000;">เข้าสู่ระบบ</button>
</div>

<div id="panel" style="display:none;" class="container">
    <div id="audio-banner">🔔 แตะที่นี่เพื่อ "เปิดเสียงพูด" และรับการแจ้งเตือน</div>

    <div class="sales-overview">
        <div class="sales-grid">
            <div class="sales-item">
                <h4>💰 ยอดขายที่สำเร็จวันนี้</h4>
                <p id="daily">0 บาท</p>
            </div>
            <div class="sales-item">
                <h4>📅 ยอดขายรวมเดือนนี้</h4>
                <p id="monthTotal">0 บาท</p>
            </div>
        </div>
    </div>

    <div class="admin-nav">
        <button id="nav-live" class="nav-btn active">📝 ออเดอร์ปัจจุบัน</button>
        <button id="nav-history" class="nav-btn">✅ สรุปยอด/ประวัติ</button>
    </div>

    <div id="page-live" class="page active">
        <div class="section-title">🆕 มาใหม่ <span id="count-new" class="badge" style="background:var(--primary); color:#000">0</span></div>
        <div id="new-orders" class="grid-orders"></div>
        <div class="section-title" style="margin-top:30px;">👨‍🍳 กำลังทำ <span id="count-doing" class="badge" style="background:var(--warning); color:#000">0</span></div>
        <div id="doing-orders" class="grid-orders"></div>
    </div>

    <div id="page-history" class="page">
        <div class="section-title">📊 สรุปยอดรายวัน (เดือนนี้)</div>
        <table class="summary-table">
            <thead>
                <tr>
                    <th>วันที่</th>
                    <th>จำนวนออเดอร์</th>
                    <th>ยอดขาย</th>
                </tr>
            </thead>
            <tbody id="summary-body"></tbody>
        </table>
        <div class="section-title" style="margin-top:30px;">✅ ประวัติออเดอร์ที่ส่งแล้ว</div>
        <div id="done-orders" class="grid-orders"></div>
    </div>
</div>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const ordersRef = collection(db, "orders");

    // --- แจ้งเตือน และ Service Worker ---
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then((reg) => {
            console.log('Admin SW Active');
            if (Notification.permission !== 'granted') {
                Notification.requestPermission();
            }
        });
    }

    window.updateStat = async (id, s) => {
        try { await updateDoc(doc(db, "orders", id), { status: s }); } 
        catch (err) { alert("Error: " + err.message); }
    };

    window.delOrder = async (id) => {
        if(confirm("ยืนยันลบถาวร?")) {
            try { await deleteDoc(doc(db, "orders", id)); } 
            catch (err) { alert("ลบไม่ได้: " + err.message); }
        }
    };

    window.showTab = (tab) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`page-${tab}`).classList.add('active');
        document.getElementById(`nav-${tab}`).classList.add('active');
    };

    const passInput = document.getElementById("pass");
    const loginBtn = document.getElementById("loginBtn");

    const doLogin = () => {
        if(passInput.value === "0000") {
            localStorage.setItem("admin_active", "true");
            document.getElementById("login").style.display = "none";
            document.getElementById("panel").style.display = "block";
            startDashboard();
        } else { alert("รหัสผ่านไม่ถูกต้อง!"); }
    };

    loginBtn.onclick = doLogin;
    passInput.onkeypress = (e) => { if(e.key === "Enter") doLogin(); };

    if(localStorage.getItem("admin_active") === "true") {
        document.getElementById("login").style.display = "none";
        document.getElementById("panel").style.display = "block";
        startDashboard();
    }

    let lastCount = -1;
    let audioOn = false;

    document.getElementById("audio-banner").onclick = () => {
        audioOn = true;
        document.getElementById("audio-banner").style.display = "none";
        if (Notification.permission !== 'granted') Notification.requestPermission();
        speak("ระบบแจ้งเตือนพร้อมทำงานค่ะ");
    };

    document.getElementById("nav-live").onclick = () => window.showTab('live');
    document.getElementById("nav-history").onclick = () => window.showTab('history');

    function speak(txt) {
        if (!audioOn) return;
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(txt);
        msg.lang = 'th-TH';
        window.speechSynthesis.speak(msg);
    }

    function startDashboard() {
        onSnapshot(ordersRef, (snap) => {
            const list = { new: [], doing: [], done: [] };
            const dailyStats = {};
            let dSum = 0, mSum = 0;
            const now = new Date();
            const todayStr = now.toLocaleDateString('th-TH');
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();

            let currentNewCount = 0;
            let latestCustomer = "";

            snap.forEach(d => {
                const o = d.data();
                const id = d.id;
                let orderTotal = 0;
                if(o.cart) o.cart.forEach(i => orderTotal += (i.price + (i.bubble||0)) * i.qty);

                const oDate = new Date(o.time);
                const oDateStr = oDate.toLocaleDateString('th-TH');

                if(o.status === 'done') {
                    if(oDateStr === todayStr) dSum += orderTotal;
                    if(oDate.getMonth() === currentMonth && oDate.getFullYear() === currentYear) {
                        mSum += orderTotal;
                        if(!dailyStats[oDateStr]) dailyStats[oDateStr] = { total: 0, count: 0 };
                        dailyStats[oDateStr].total += orderTotal;
                        dailyStats[oDateStr].count += 1;
                    }
                }

                const card = createCard(id, o, orderTotal);
                if(o.status === 'new') { 
                    list.new.push(card); 
                    currentNewCount++; 
                    latestCustomer = o.name || "ลูกค้า";
                }
                else if(o.status === 'doing') list.doing.push(card);
                else list.done.push(card);
            });

            // แจ้งเตือนเมื่อมีออเดอร์ใหม่
            if(lastCount !== -1 && currentNewCount > lastCount) {
                speak("มีออเดอร์ใหม่เข้ามาค่ะ");
                if (Notification.permission === 'granted' && navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage({
                        type: "NEW_ORDER",
                        name: latestCustomer
                    });
                }
            }
            lastCount = currentNewCount;

            render('new-orders', list.new, 'count-new');
            render('doing-orders', list.doing, 'count-doing');
            render('done-orders', list.done, null);
            renderSummaryTable(dailyStats);

            document.getElementById("daily").innerText = dSum.toLocaleString() + " บาท";
            document.getElementById("monthTotal").innerText = mSum.toLocaleString() + " บาท";
        });
    }

    function renderSummaryTable(stats) {
        const tbody = document.getElementById("summary-body");
        tbody.innerHTML = "";
        const sortedDates = Object.keys(stats).sort((a,b) => b.localeCompare(a));
        sortedDates.forEach(date => {
            tbody.innerHTML += `<tr><td>${date}</td><td>${stats[date].count} ออเดอร์</td><td style="color:var(--success); font-weight:bold;">${stats[date].total.toLocaleString()}.-</td></tr>`;
        });
    }

    function createCard(id, o, total) {
        const div = document.createElement('div');
        div.className = "order-card";
        const t = new Date(o.time).toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
        const items = (o.cart || []).map(i => `
            <div class="item-row"><span><b>${i.name}</b> x${i.qty}</span><span>${(i.price + (i.bubble||0)) * i.qty}.-</span></div>
            <div style="font-size:0.85em; color:#94a3b8; margin-bottom:5px;">${i.sweet||''} ${i.note||''}</div>
        `).join('');

        div.innerHTML = `
            <div class="cust-header"><div style="display:flex; justify-content:space-between"><strong>👤 ${o.name || 'ลูกค้า'}</strong><small>${t}</small></div>
            <a href="tel:${o.phone}" style="color:var(--primary); text-decoration:none;">📞 ${o.phone || '-'}</a></div>
            <div class="address-box">🏠 ${o.address || 'รับที่ร้าน'}${o.gps ? `<br><a href="${o.gps}" target="_blank" class="btn-gps">📍 แผนที่</a>` : ''}</div>
            <div class="item-list">${items}</div>
            <div style="text-align:right; font-weight:bold; color:var(--primary); font-size:1.1em; border-top:1px dashed #475569; padding-top:10px;">รวม ${total.toLocaleString()}.-</div>
            <div class="btn-group">
                ${o.status === 'new' ? `<button onclick="updateStat('${id}','doing')" class="btn-status" style="background:var(--warning);">รับออเดอร์</button>` : ''}
                ${o.status === 'doing' ? `<button onclick="updateStat('${id}','done')" class="btn-status" style="background:var(--success); color:#fff;">ส่งแล้ว</button>` : ''}
                ${o.status === 'done' ? `<button onclick="delOrder('${id}')" class="btn-status" style="background:var(--danger); color:#fff;">ลบ</button>` : ''}
            </div>
        `;
        return div;
    }

    function render(id, items, cId) {
        const target = document.getElementById(id);
        if(!target) return;
        target.innerHTML = "";
        items.reverse().forEach(el => target.appendChild(el));
        if(cId) document.getElementById(cId).innerText = items.length;
    }
</script>
</body>
</html>
