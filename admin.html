<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin</title>
<link rel="manifest" href="manifest.json">
</head>

<body>

<div id="login">
<input id="pass" type="password">
<button onclick="login()">เข้า</button>
</div>

<div id="panel" style="display:none;">
<h1>ออเดอร์</h1>
<div id="orders"></div>

<h2>เพิ่มเมนู</h2>
<input id="mname">
<input id="mprice">
<button onclick="addMenu()">เพิ่ม</button>
</div>

<script type="module">
import { db, collection, onSnapshot, doc, updateDoc, addDoc } from "./firebase.js";

window.login=()=>{
 if(pass.value==="0000"){
  login.style.display="none";
  panel.style.display="block";
  load();
 }else alert("ผิด");
}

function load(){
 onSnapshot(collection(db,"orders"),snap=>{
  orders.innerHTML="";
  snap.forEach(d=>{
   const o=d.data();
   orders.innerHTML+=`${o.name}<br>`;
  });
 });
}

window.addMenu=async()=>{
 await addDoc(collection(db,"menu"),{
  name:mname.value,
  price:Number(mprice.value)
 });
 alert("เพิ่มแล้ว");
}
</script>

</body>
</html>
