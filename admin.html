<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin</title>
</head>

<body>

<div id="login">
<input id="pass" type="password" placeholder="รหัส">
<button onclick="login()">เข้า</button>
</div>

<div id="panel" style="display:none;">
<h1>📦 ออเดอร์</h1>
<div id="orders"></div>
</div>

<script type="module">
import { db, collection, onSnapshot } from "./firebase.js";

window.login=()=>{
 if(document.getElementById("pass").value==="0000"){
  document.getElementById("login").style.display="none";
  document.getElementById("panel").style.display="block";
  load();
 }else{
  alert("รหัสผิด");
 }
}

function load(){
 onSnapshot(collection(db,"orders"),snap=>{
  const div=document.getElementById("orders");
  div.innerHTML="";
  snap.forEach(d=>{
   const o=d.data();
   div.innerHTML+=`
   <div>
   ${o.name} (${o.phone})<br>
   ${o.cart.map(i=>i.name+" x "+i.qty).join("<br>")}
   </div><hr>`;
  });
 });
}
</script>

</body>
</html>
