<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOP Chafe - Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap'); body { font-family: 'Kanit', sans-serif; }</style>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-md mx-auto">
        <header class="flex items-center gap-4 mb-8">
            <a href="pos.html" class="bg-white w-10 h-10 rounded-full flex items-center justify-center shadow-sm text-gray-400"><i class="fas fa-arrow-left"></i></a>
            <h1 class="text-xl font-bold tracking-tight">สรุปยอดขาย</h1>
        </header>

        <div class="bg-black text-white p-10 rounded-[45px] shadow-2xl mb-12 relative overflow-hidden">
            <div class="relative z-10">
                <div class="text-[10px] font-bold opacity-50 uppercase tracking-widest mb-2 font-bold">Total Revenue Today</div>
                <div id="total-val" class="text-5xl font-bold text-yellow-400 tracking-tighter">฿0</div>
            </div>
            <i class="fas fa-chart-line absolute -bottom-4 -right-4 text-8xl opacity-10"></i>
        </div>

        <h3 class="font-bold text-gray-400 uppercase text-[10px] tracking-widest mb-6 ml-2">Recent Success Orders</h3>
        <div id="history" class="space-y-4">
            <!-- Order history will load here -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hop-chafe-pwa';

        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'orders'), (snap) => {
            const orders = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(o => o.status === 'completed');
            const total = orders.reduce((s, o) => s + o.total, 0);
            document.getElementById('total-val').innerText = `฿${total.toLocaleString()}`;
            document.getElementById('history').innerHTML = orders.reverse().map(o => `
                <div class="bg-white p-5 rounded-[25px] flex justify-between items-center shadow-sm border border-gray-100">
                    <div>
                        <div class="font-bold text-lg text-black">฿${o.total}</div>
                        <div class="text-[10px] text-gray-400 font-bold uppercase">${new Date(o.createdAt).toLocaleTimeString()}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-[9px] text-gray-300 font-bold uppercase tracking-tighter">${o.items.length} Items Ordered</div>
                        <div class="text-xs font-bold text-green-500 italic">Success</div>
                    </div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
