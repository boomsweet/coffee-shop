<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Hop Tea - เจ้าของร้าน</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b00">
<style>
body{margin:10px;font-family:sans-serif;background:#111;color:#fff}
.admin-card{background:#222;margin:5px;padding:10px;border-radius:10px}
button{margin:3px;padding:5px;border:none;border-radius:6px;cursor:pointer}
.done-btn{background:#22c55e;color:white}
.delete-btn{background:#ef4444;color:white}
</style>
</head>
<body>
<h2>☕ Hop Tea - เจ้าของร้าน</h2>
<div id="orders"></div>
<h3>ยอดขาย: <span id="sum">0</span></h3>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
 apiKey:"YOUR_API_KEY",
 databaseURL:"YOUR_DB_URL"
});
const db=getDatabase(app);

onValue(ref(db,"orders"), snap => {
  const data = snap.val()||{};
  let html="", sum=0;
  for(let k in data){
    const o = data[k];
    let list = "";
    for(let i in o.cart){ list += `${o.cart[i].qty} x ${i}<br>`;}
    html+=`<div class="admin-card">
      <h4>${o.name} (${o.phone})</h4>
      <p>${list}</p>
      <p><small>${o.time} | สถานะ: ${o.status}</small></p>
      <button class="done-btn" onclick="updateStatus('${k}','เสร็จแล้ว')">เสร็จแล้ว</button>
      <button class="delete-btn" onclick="deleteOrder('${k}')">ลบ</button>
    </div>`;
    if(o.status==="เสร็จแล้ว") sum+=parseInt(o.total||0);
  }
  document.getElementById("orders").innerHTML=html;
  document.getElementById("sum").innerText=sum;
});

function updateStatus(k,s){update(ref(db,"orders/"+k),{status:s});}
function deleteOrder(k){remove(ref(db,"orders/"+k));}
</script>
</body>
</html>
