<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ร้าน</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;padding:10px}
.box{background:#222;padding:10px;margin:5px;border-radius:10px}
</style>
</head>

<body>

<script>
let pass = prompt("รหัสร้าน");
if(pass!="0000"){
  alert("เข้าไม่ได้");
  location.href="index.html";
}
</script>

<h2>🧑‍🍳 เจ้าของร้าน</h2>

<h3>➕ เพิ่มเมนู</h3>
<input id="mname" placeholder="ชื่อ">
<input id="mprice" placeholder="ราคา">
<button onclick="addMenu()">เพิ่ม</button>

<h3>📋 รายการเมนู</h3>
<div id="menu"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCW-ztNX8EAio66VN8ODKo6_z9R8-B99mU",
  authDomain: "coffee-shop-2042e.firebaseapp.com",
  databaseURL: "https://coffee-shop-2042e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "coffee-shop-2042e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.addMenu=()=>{
  push(ref(db,"menu"),{
    name:mname.value,
    price:mprice.value
  });
}

onValue(ref(db,"menu"),snap=>{
  let data=snap.val()||{};
  let html="";
  for(let k in data){
    html+=`
    <div class="box">
      ${data[k].name} (${data[k].price})
      <button onclick="del('${k}')">ลบ</button>
    </div>`;
  }
  menu.innerHTML=html;
});

window.del=(k)=>{
  remove(ref(db,"menu/"+k));
}
</script>

</body>
</html>
