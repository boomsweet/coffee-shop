<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin</title>
<style>
body{background:#020617;color:#fff;font-family:sans-serif;padding:10px}
.box{background:#1e293b;padding:10px;margin:10px;border-radius:10px}
button{margin:3px;padding:5px}
</style>
</head>

<body>

<div id="login">
<input id="pass" type="password">
<button onclick="login()">เข้า</button>
</div>

<div id="panel" style="display:none;">

<h2>🆕 ออเดอร์ใหม่</h2>
<div id="new"></div>

<h2>👨‍🍳 กำลังทำ</h2>
<div id="doing"></div>

<h2>✅ เสร็จแล้ว</h2>
<div id="done"></div>

</div>

<script type="module">
import { db, collection, onSnapshot, doc, updateDoc } from "./firebase.js";

if(localStorage.getItem("login")) show();

window.login=()=>{
 if(pass.value==="0000"){
  localStorage.setItem("login","1");
  show();
 }else alert("ผิด");
}

function show(){
 login.style.display="none";
 panel.style.display="block";
 load();
}

function load(){
 onSnapshot(collection(db,"orders"),snap=>{
  new.innerHTML="";
  doing.innerHTML="";
  done.innerHTML="";

  snap.forEach(d=>{
   const o=d.data();
   const id=d.id;

   const html=`
   <div class="box">
   ${o.name}<br>
   ${o.cart.map(i=>i.name+" x "+i.qty).join("<br>")}
   <br>
   <button onclick="set('${id}','new')">ใหม่</button>
   <button onclick="set('${id}','doing')">ทำ</button>
   <button onclick="set('${id}','done')">เสร็จ</button>
   </div>`;

   if(o.status==="doing"){
     doing.innerHTML+=html;
   }else if(o.status==="done"){
     done.innerHTML+=html;
   }else{
     new.innerHTML+=html;
   }
  });
 });
}

window.set=(id,status)=>{
 updateDoc(doc(db,"orders",id),{status});
}
</script>

</body>
</html>
