.card img{width:100%;height:100px;object-fit:cover;border-radius:10px;}

.done{border-left:5px solid green}

const db=getDatabase(app);

onValue(ref(db,"orders"),snapshot=>{
 const ordersEl = document.getElementById("orders");
 let data = snapshot.val()||{};
 let html="",sum=0;
 for(let k in data){
   let o=data[k];
   let list="";
   for(let i in o.cart){
     list+=`${i} x${o.cart[i]}<br>`;
   }
   html+=`<div class="card ${o.status}">
   <img src="${getMenuImage(Object.keys(o.cart)[0])}">
   👤 ${o.name}<br>
   📞 ${o.phone}<br>
   🧾 ${list}💰 ${o.total} บาท<br>
   <button onclick="updateStatus('${k}','cook')">ทำ</button>
   <button onclick="updateStatus('${k}','done')">เสร็จ</button>
   <button onclick="updateStatus('${k}','paid')">จ่ายแล้ว</button>
   </div>`;
   if(o.status=="paid") sum+=parseInt(o.total||0);
 }
 ordersEl.innerHTML=html;
 document.getElementById("sum").innerText=sum;
});

window.updateStatus=(k,s)=>{
 update(ref(db,"orders/"+k),{status:s});
}

</script>
