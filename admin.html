<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>POS ร้าน</title>

<style>
body{background:#111;color:#fff;font-family:sans-serif;padding:10px}
.card{background:#222;margin:5px;padding:10px;border-radius:10px}
.new{border-left:5px solid red}
.cook{border-left:5px solid orange}
.done{border-left:5px solid green}
.paid{border-left:5px solid blue}
button{margin:3px}
</style>
</head>

<body>

<h2>🔐 ระบบร้าน</h2>

<input id="pass" type="password" placeholder="รหัส">
<button onclick="login()">เข้า</button>

<div id="admin" style="display:none">

<h3>📺 ออเดอร์</h3>
<div id="orders"></div>

<h3>📊 ยอดขาย: <span id="sum">0</span></h3>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
 apiKey:"AIzaSy...",
 databaseURL:"https://coffee-shop-2042e-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db=getDatabase(app);

window.login=()=>{
 if(pass.value=="0000") admin.style.display="block";
}

onValue(ref(db,"orders"),s=>{
 let data=s.val()||{},html="",sum=0;

 for(let k in data){
  let o=data[k],list="";
  for(let i in o.cart){
   let c=o.cart[i];
   list+=`${i} x${c.qty} ${c.pearl?"ไข่มุก":""}<br>`;
  }

  html+=`
  <div class="card ${o.status}">
  👤 ${o.name}<br>
  📞 ${o.phone}<br>
  🧾 ${list}
  💰 ${o.total} บาท<br>

  <button onclick="set('${k}','cook')">ทำ</button>
  <button onclick="set('${k}','done')">เสร็จ</button>
  <button onclick="set('${k}','paid')">จ่ายแล้ว</button>
  </div>`;

  if(o.status=="paid") sum+=parseInt(o.total||0);
 }

 orders.innerHTML=html;
 sumEl.innerText=sum;
});

window.set=(k,s)=>{
 update(ref(db,"orders/"+k),{status:s});
}
</script>

</body>
</html>
