<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin</title>
<style>
body{background:#020617;color:#fff;font-family:sans-serif;padding:10px}
.box{background:#1e293b;padding:10px;margin:10px;border-radius:10px}
button{margin:3px;padding:5px}
</style>
</head>

<body>

<div id="login">
<input id="pass" type="password">
<button id="btnLogin">เข้า</button>
</div>

<div id="panel" style="display:none;">

<h2>🆕 ออเดอร์ใหม่</h2>
<div id="new"></div>

<h2>👨‍🍳 กำลังทำ</h2>
<div id="doing"></div>

<h2>✅ เสร็จแล้ว</h2>
<div id="done"></div>

</div>

<script type="module">
import { db, collection, onSnapshot, doc, updateDoc } from "./firebase.js";

// ✅ ดึง element ให้ถูกต้อง
const loginDiv = document.getElementById("login");
const panelDiv = document.getElementById("panel");
const passInput = document.getElementById("pass");
const btnLogin = document.getElementById("btnLogin");

const newDiv = document.getElementById("new");
const doingDiv = document.getElementById("doing");
const doneDiv = document.getElementById("done");

// ✅ auto login
if(localStorage.getItem("login")){
 showPanel();
}

// ✅ ปุ่ม login
btnLogin.onclick = () => {
 if(passInput.value === "0000"){
   localStorage.setItem("login","1");
   showPanel();
 }else{
   alert("รหัสผิด");
 }
};

// ✅ แสดง panel
function showPanel(){
 loginDiv.style.display="none";
 panelDiv.style.display="block";
 loadOrders();
}

// ✅ โหลดออเดอร์
function loadOrders(){
 onSnapshot(collection(db,"orders"),snap=>{
  newDiv.innerHTML="";
  doingDiv.innerHTML="";
  doneDiv.innerHTML="";

  snap.forEach(d=>{
   const o = d.data();
   const id = d.id;

   const html = document.createElement("div");
   html.className = "box";

   html.innerHTML = `
   ${o.name || "-"}<br>
   ${(o.cart||[]).map(i=>i.name+" x "+i.qty).join("<br>")}
   <br>
   <button data-id="${id}" data-status="new">ใหม่</button>
   <button data-id="${id}" data-status="doing">ทำ</button>
   <button data-id="${id}" data-status="done">เสร็จ</button>
   `;

   // ✅ ผูก event ปุ่ม (สำคัญ)
   html.querySelectorAll("button").forEach(btn=>{
     btn.onclick = () => {
       const status = btn.getAttribute("data-status");
       const docId = btn.getAttribute("data-id");
       updateDoc(doc(db,"orders",docId),{status});
     };
   });

   // ✅ แยกสถานะ
   if(o.status === "doing"){
     doingDiv.appendChild(html);
   }else if(o.status === "done"){
     doneDiv.appendChild(html);
   }else{
     newDiv.appendChild(html);
   }
  });
 });
}
</script>

</body>
</html>
