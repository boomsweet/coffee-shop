<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin PRO</title>

<style>
body{background:#020617;color:#fff;font-family:sans-serif;padding:10px}
.box{background:#1e293b;padding:10px;margin:10px;border-radius:10px}
button{margin:3px;padding:6px;border-radius:6px}
input{margin:5px;padding:6px}
h2{margin-top:20px}
</style>

</head>

<body>

<!-- 🔐 LOGIN -->
<div id="login">
<h2>เข้าสู่ระบบ</h2>
<input id="pass" type="password" placeholder="รหัสผ่าน">
<button id="btnLogin">เข้า</button>
</div>

<!-- 🔥 PANEL -->
<div id="panel" style="display:none;">

<h1>📦 ระบบร้าน</h1>

<h2 id="totalAll"></h2>

<h2>🆕 รับออเดอร์</h2>
<div id="new"></div>

<h2>👨‍🍳 กำลังทำ</h2>
<div id="doing"></div>

<h2>✅ เสร็จสิ้น</h2>
<div id="done"></div>

<h2>📊 สรุปรายวัน</h2>
<div id="daily"></div>

<h2>➕ จัดการเมนู</h2>
<input id="mname" placeholder="ชื่อเมนู">
<input id="mprice" placeholder="ราคา">
<button id="addMenu">เพิ่มเมนู</button>

<div id="menuList"></div>

</div>

<script type="module">
import { 
  db, collection, onSnapshot, doc, updateDoc, addDoc 
} from "./firebase.js";

// ✅ FIX: import deleteDoc แยก
import { deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ELEMENT
const loginDiv = document.getElementById("login");
const panelDiv = document.getElementById("panel");
const passInput = document.getElementById("pass");
const btnLogin = document.getElementById("btnLogin");

const newDiv = document.getElementById("new");
const doingDiv = document.getElementById("doing");
const doneDiv = document.getElementById("done");

const totalAll = document.getElementById("totalAll");
const dailyDiv = document.getElementById("daily");
const menuListDiv = document.getElementById("menuList");

// LOGIN
if(localStorage.getItem("login")) showPanel();

btnLogin.onclick = () => {
 if(passInput.value === "0000"){
   localStorage.setItem("login","1");
   showPanel();
 }else{
   alert("รหัสผิด");
 }
};

function showPanel(){
 loginDiv.style.display="none";
 panelDiv.style.display="block";
 loadOrders();
 loadMenu();
}

// 📦 ORDERS
function loadOrders(){
 onSnapshot(collection(db,"orders"),snap=>{
  newDiv.innerHTML="";
  doingDiv.innerHTML="";
  doneDiv.innerHTML="";

  let total = 0;
  let daily = {};

  snap.forEach(d=>{
   const o = d.data();
   const id = d.id;

   let sum = 0;
   (o.cart||[]).forEach(i=>{
     sum += (i.price + (i.bubble||0)) * i.qty;
   });

   total += sum;

   const date = new Date(o.time);
   const day = date.toLocaleDateString("th-TH");

   daily[day] = (daily[day]||0) + sum;

   const div = document.createElement("div");
   div.className = "box";

   div.innerHTML = `
   ${o.name || "-"}<br>
   ${(o.cart||[]).map(i=>i.name+" x "+i.qty).join("<br>")}
   <br><b>${sum} บาท</b>
   <br>
   <button data-id="${id}" data-status="new">รับออเดอร์</button>
   <button data-id="${id}" data-status="doing">กำลังทำ</button>
   <button data-id="${id}" data-status="done">เสร็จ</button>
   `;

   div.querySelectorAll("button").forEach(btn=>{
     btn.onclick = ()=>{
       updateDoc(doc(db,"orders",btn.dataset.id),{
         status: btn.dataset.status
       });
     };
   });

   if(o.status==="doing"){
     doingDiv.appendChild(div);
   }else if(o.status==="done"){
     doneDiv.appendChild(div);
   }else{
     newDiv.appendChild(div);
   }
  });

  totalAll.innerText = "💰 รวมทั้งหมด: " + total + " บาท";

  dailyDiv.innerHTML="";
  Object.keys(daily).sort().forEach(d=>{
    dailyDiv.innerHTML += `${d} : ${daily[d]} บาท<br>`;
  });

 });
}

// ➕ MENU
document.getElementById("addMenu").onclick = async ()=>{
 const name = document.getElementById("mname").value;
 const price = Number(document.getElementById("mprice").value);

 if(!name || !price) return alert("กรอกไม่ครบ");

 await addDoc(collection(db,"menu"),{name,price});
};

// โหลดเมนู
function loadMenu(){
 onSnapshot(collection(db,"menu"),snap=>{
  menuListDiv.innerHTML="";

  snap.forEach(d=>{
    const m = d.data();
    const id = d.id;

    const div = document.createElement("div");
    div.className="box";

    div.innerHTML = `
    ${m.name} (${m.price})
    <button>ลบ</button>
    `;

    div.querySelector("button").onclick = ()=>{
      deleteDoc(doc(db,"menu",id));
    };

    menuListDiv.appendChild(div);
  });
 });
}

</script>

</body>
</html>
