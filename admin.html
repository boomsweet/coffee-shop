<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-4">
<h1 class="text-center text-xl font-bold">Hop Tea - เจ้าของร้าน</h1>

<input id="pass" type="password" placeholder="รหัส" class="border p-2">
<button onclick="login()" class="bg-black text-white px-3">เข้า</button>

<div id="panel" class="hidden">

<h2 class="mt-4 font-bold">เพิ่มเมนู</h2>
<input id="name" placeholder="ชื่อ">
<input id="price" type="number" placeholder="ราคา">
<input id="img" placeholder="รูป">
<button onclick="addMenu()" class="bg-green-500 text-white px-2">เพิ่ม</button>

<div id="menu-list" class="mt-4"></div>

<h2 class="mt-6 font-bold">ออเดอร์</h2>
<div id="orders"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
 apiKey: "AIzaSyCW-ztNX8EAio66VN8ODKo6_z9R8-B99mU",
 databaseURL:"https://coffee-shop-2042e-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let menu = JSON.parse(localStorage.getItem("menu")||"[]");

window.login = ()=>{
  if(document.getElementById("pass").value==="0000"){
    document.getElementById("panel").classList.remove("hidden");
    loadMenu();
    loadOrders();
  }else alert("รหัสผิด");
}

function saveMenu(){
  localStorage.setItem("menu", JSON.stringify(menu));
  const obj={}; menu.forEach(m=>obj[m.id]=m);
  set(ref(db,"menu"), obj);
}

window.addMenu = ()=>{
  const m={
    id:Date.now(),
    name:name.value,
    price:Number(price.value),
    img:img.value
  };
  menu.push(m);
  saveMenu();
  renderMenu();
}

window.del = (id)=>{
  menu = menu.filter(m=>m.id!==id);
  saveMenu();
  renderMenu();
}

function renderMenu(){
  document.getElementById("menu-list").innerHTML = menu.map(m=>`
    <div class="bg-white p-2 mb-2">
      ${m.name} ฿${m.price}
      <button onclick="del(${m.id})">ลบ</button>
    </div>
  `).join("");
}

function loadMenu(){
  renderMenu();
}

function loadOrders(){
  onValue(ref(db,"orders"), snap=>{
    const data = snap.val()||{};
    document.getElementById("orders").innerHTML =
    Object.keys(data).map(k=>{
      const o=data[k];
      return `
      <div class="bg-white p-2 mb-2">
        <b>${o.time}</b><br>
        ฿${o.total}<br>
        ${Object.values(o.items).map(i=>i.name+" x"+i.qty).join("<br>")}
        <button onclick="done('${k}')">เสร็จ</button>
      </div>`;
    }).join("");
  });
}

window.done = (id)=>{
  update(ref(db,"orders/"+id),{status:"completed"});
}
</script>
</body>
</html>
