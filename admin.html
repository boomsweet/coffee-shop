<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Admin</title>

<style>
body{font-family:sans-serif;background:#020617;color:#fff;padding:10px}
.box{background:#1e293b;padding:10px;margin:10px;border-radius:10px}
button{padding:5px;margin:3px;border:none;border-radius:8px}
.new{background:red}
.doing{background:orange}
.done{background:green}
</style>
</head>

<body>

<h1>📦 ออเดอร์</h1>
<h2 id="total"></h2>

<h2>🆕 ใหม่</h2>
<div id="new"></div>

<h2>👨‍🍳 กำลังทำ</h2>
<div id="doing"></div>

<h2>✅ เสร็จแล้ว</h2>
<div id="done"></div>

<script type="module">
import { db, collection, onSnapshot, doc, updateDoc } from "./firebase.js";

onSnapshot(collection(db,"orders"),snap=>{
 let total=0;

 new.innerHTML="";
 doing.innerHTML="";
 done.innerHTML="";

 snap.forEach(d=>{
  const o=d.data();
  const id=d.id;

  let sum=0;
  o.cart.forEach(i=>sum+=i.price*i.qty);
  total+=sum;

  const html=`
  <div class="box">
  ${o.name} (${o.phone})<br>
  ${o.cart.map(i=>i.name+" x "+i.qty).join("<br>")}
  <br>💰 ${sum}
  <br>
  <button class="new" onclick="set('${id}','new')">ใหม่</button>
  <button class="doing" onclick="set('${id}','doing')">ทำ</button>
  <button class="done" onclick="set('${id}','done')">เสร็จ</button>
  </div>`;

  if(o.status=="doing") doing.innerHTML+=html;
  else if(o.status=="done") done.innerHTML+=html;
  else new.innerHTML+=html;
 });

 document.getElementById("total").innerText="ยอดรวม "+total+" บาท";
});

window.set=async(id,status)=>{
 await updateDoc(doc(db,"orders",id),{status});
}
</script>

</body>
</html>
