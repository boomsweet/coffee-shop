<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hop Tea - เจ้าของร้าน</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b00">
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#fff;padding:10px}
.header{background:#ff6b00;color:#fff;padding:15px;font-size:20px;text-align:center}
.card{background:#222;margin:5px;padding:10px;border-radius:10px}
.new{border-left:5px solid red}
.cook{border-left:5px solid orange}
.done{border-left:5px solid green}
.paid{border-left:5px solid blue}
button{margin:3px;padding:5px;border:none;border-radius:5px;background:#ff6b00;color:#fff;cursor:pointer}
input{padding:5px;margin:3px;border-radius:5px;border:1px solid #ccc}
img{width:80px;height:80px;object-fit:cover;margin-right:5px;border-radius:5px}
.flex{display:flex;align-items:center}
</style>
</head>
<body>

<div class="header">📋 ระบบเจ้าของร้าน Hop Tea</div>

<h4>🔐 เข้าสู่ระบบ</h4>
<input type="password" id="pass" placeholder="รหัสเจ้าของร้าน">
<button onclick="login()">เข้า</button>

<div id="admin" style="display:none">
<h3>📺 ออเดอร์ลูกค้า</h3>
<div id="orders"></div>
<h3>📊 ยอดขายรวม: <span id="sum">0</span> บาท</h3>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
 apiKey:"AIzaSyCW-ztNX8EAio66VN8ODKo6_z9R8-B99mU",
 databaseURL:"https://coffee-shop-2042e-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db=getDatabase(app);

const ordersDiv=document.getElementById("orders");
const sumEl=document.getElementById("sum");

// menuData เหมือน customer.html
let menuData = {
"ชาเขียวนม":"images/tea_milk_green.png",
"ชานมโกโก้":"images/tea_cocoa.png",

"ชามะนาว":"images/tea_lemon.png",
"ชาดำ":"images/tea_black.png",
"ชาเขียวใส":"images/tea_green.png",
"ชาเขียวมะนาว":"images/tea_lemon_green.png",
"ชาเขียวน้ำผึ้งมะนาว":"images/tea_honey_lemon.png",
"ชามะลิ":"images/jasmine_tea.png",
"ชามะลิลิ้นจี่":"images/jasmine_lychee.png",

"ชามะลิสตรอว์เบอร์รี่":"images/jasmine_strawberry.png",
"ชามะลิเก๊กฮวย":"images/jasmine_chrysanthemum.png",
"ชามะลินม":"images/jasmine_milk.png",
"ชาเบอร์รี่":"images/berry_tea.png",
"ชาเบอร์รี่มะนาว":"images/berry_lemon.png",
"ชาเบอร์รี่น้ำผึ้ง":"images/berry_honey.png",

"นมชมพู":"images/milk_pink.png",

"โอวัลติน":"images/milk_ovaltine.png",
"นมเผือก":"images/milk_taro.png",
"นมแคนตาลูป":"images/milk_cantaloupe.png",
"สตรอว์เบอร์รี่นมสด":"images/milk_strawberry.png",
"เอสเปรสโซ่":"images/coffee_espresso.png",
"ลาเต้":"images/coffee_latte.png",
"มอคค่า":"images/coffee_mocha.png",
"คาปูชิโน่":"images/coffee_cappuccino.png",
"แดงโซดา":"images/soda_red.png",
"เขียวโซดา":"images/soda_green.png",
"มะนาวโซดา":"images/soda_lemon.png",
"น้ำผึ้งมะนาวโซดา":"images/soda_honey_lemon.png",
"เสาวรสโซดา":"images/soda_passion.png",

"องุ่นโซดา":"images/soda_grape.png",
"ลิ้นจี่โซดา":"images/soda_lychee.png",
"แคนตาลูปโซดา":"images/soda_cantaloupe.png",
"สตรอว์เบอร์รี่โซดา":"images/soda_strawberry.png",
"มะม่วงโซดา":"images/soda_mango.png",
"กีวี่โซดา":"images/soda_kiwi.png",
"แอปเปิ้ลโซดา":"images/soda_apple.png",
"ชาพีช":"images/other_peach.png",
"ชานมไต้หวัน บราวน์ชูก้า":"images/other_milk_tea_brownsugar.png",
"ชาเขียว บราวน์ชูก้า":"images/other_green_tea_brownsugar.png",
"นมสด บราวน์ชูก้า":"images/other_fresh_milk_brownsugar.png"
};

window.login=()=>{
 if(document.getElementById("pass").value==="0000"){
   document.getElementById("admin").style.display="block";
 }else{
   alert("รหัสไม่ถูกต้อง");
 }
}

function renderOrders(data){
 let html="",sum=0;
 for(let k in data){
   const o=data[k];
   let list="";
   for(let item in o.cart){
     const c=o.cart[item];
     const img=menuData[item]||"";
     list+=`<div class="flex"><img src="${img}">${item} x${c.qty}</div>`;
   }
   html+=`<div class="card ${o.status}">
   👤 ${o.name}<br>
   📞 ${o.phone}<br>
   🧾 ${list}
   💰 ${o.total} บาท<br>
   <button onclick="setStatus('${k}','cook')">ทำ</button>
   <button onclick="setStatus('${k}','done')">เสร็จ</button>
   <button onclick="setStatus('${k}','paid')">จ่ายแล้ว</button>
   </div>`;
   if(o.status==="paid") sum+=parseInt(o.total||0);
 }
 ordersDiv.innerHTML=html;
 sumEl.innerText=sum;
}

window.setStatus=(key,status)=>{
 update(ref(db,"orders/"+key),{status:status});
}

onValue(ref(db,"orders"),snapshot=>{
  const data=snapshot.val()||{};
  renderOrders(data);
});

// Service Worker
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

</script>
</body>
</html>
