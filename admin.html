<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hop Tea - เจ้าของร้าน</title>
<link rel="manifest" href="manifest-admin.json">
<meta name="theme-color" content="#ff6b00">
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#fff;padding:10px}
.header{background:#ff6b00;color:#fff;padding:15px;font-size:20px;text-align:center}
.card{background:#222;margin:5px;padding:10px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,0.2);}
.new{border-left:5px solid red}
.cook{border-left:5px solid orange}
.done{border-left:5px solid green}
.paid{border-left:5px solid blue}
button{background:#ff6b00;color:#fff;border:none;padding:5px;border-radius:5px;cursor:pointer;margin:2px}
input{padding:5px;margin:2px;border-radius:5px;border:1px solid #ccc;width:calc(50% - 8px);}
.install{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;}
</style>
</head>
<body>

<!-- ติดตั้งแอป -->
<div id="installBox" class="install">
<h2>📱 ติดตั้งแอปเจ้าของร้าน</h2>
<p>เพื่อใช้งานเหมือนแอปจริง</p>
<button onclick="installApp()">ติดตั้งแอป</button>
</div>

<div id="adminApp" style="display:none">

<div class="header">🏪 Hop Tea - เจ้าของร้าน</div>

<h3>🔐 เข้าระบบ</h3>
<input type="password" id="pass" placeholder="รหัสผ่าน">
<button onclick="login()">เข้าสู่ระบบ</button>

<div id="ordersSection" style="display:none">
<h3>📺 ออเดอร์</h3>
<div id="orders"></div>
<h3>📊 ยอดขาย: <span id="sum">0</span></h3>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// Firebase
const app = initializeApp({
 apiKey:"AIzaSyCW-ztNX8EAio66VN8ODKo6_z9R8-B99mU",
 databaseURL:"https://coffee-shop-2042e-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db = getDatabase(app);

function login(){
  if(pass.value==="0000"){
    ordersSection.style.display="block";
  }else{
    alert("รหัสผิด");
  }
}

// ดูออเดอร์ real-time
onValue(ref(db,"orders"),snapshot=>{
  let data = snapshot.val()||{}, html="", sum=0;
  for(let k in data){
    let o=data[k],list="";
    for(let i in o.cart){
      let c=o.cart[i];
      list+=`${i} x${c.qty} ${c.pearl?"ไข่มุก":""}<br>`;
    }
    html+=`<div class="card ${o.status}">👤 ${o.name}<br>📞 ${o.phone}<br>🧾 ${list}💰 ${o.total} บาท<br>
    <button onclick="setStatus('${k}','cook')">ทำ</button>
    <button onclick="setStatus('${k}','done')">เสร็จ</button>
    <button onclick="setStatus('${k}','paid')">จ่ายแล้ว</button></div>`;
    if(o.status=="paid") sum+=parseInt(o.total||0);
  }
  orders.innerHTML=html;
  sumEl.innerText=sum;
});

window.setStatus=(k,status)=>{
  update(ref(db,"orders/"+k),{status:status});
}
</script>

<script>
// PWA install
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault();deferredPrompt=e;});
window.installApp=async()=>{if(deferredPrompt){deferredPrompt.prompt();const {outcome}=await deferredPrompt.userChoice;if(outcome==='accepted'){installBox.style.display="none";adminApp.style.display="block";}}else{alert("กรุณากดเพิ่มไปหน้าจอหลัก");}};
if(window.matchMedia('(display-mode: standalone)').matches){installBox.style.display="none";adminApp.style.display="block";}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>

</body>
</html>
